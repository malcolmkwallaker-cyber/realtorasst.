    const ch = this.charAt(this.index);
    const unlocked = this.isUnlocked(this.index);

    // big card
    G.UI.panel(ctx, 90, 32, 300, 178, {
      bg: G.C.navy,
      border: unlocked ? G.C.yellow : G.C.slate,
      title: unlocked ? (ch.name + ' - ' + ch.title) : '????? - SECRET AGENT',
      titleBg: unlocked ? ch.color : G.C.dusk,
    });

    if (unlocked) {
      const hop = Math.abs(Math.sin(this.t * 4)) * 3;
      G.drawSprite(ctx, G.Sprites[ch.sprite], 108, 56 - hop, 4);

      let ty = 50;
      for (const line of G.UI.wrap(ctx, ch.bio.join(' '), 190, 7)) {
        G.UI.text(ctx, line, 186, ty, { size: 7, color: G.C.gray });
        ty += 8;
      }
      ty += 4;
      G.UI.text(ctx, 'STRENGTHS:', 186, ty, { size: 7, color: G.C.cyan }); ty += 9;
      for (const st of ch.strengths) {
        G.UI.text(ctx, '* ' + st, 190, ty, { size: 7, color: G.C.lime });
        ty += 9;
      }
      ty += 3;
      G.UI.text(ctx, 'SPECIAL: ' + ch.ability.name, 104, Math.max(ty, 150), { size: 8, color: G.C.yellow });
      let ay = Math.max(ty, 150) + 10;
      for (const l of G.UI.wrap(ctx, ch.ability.desc, 274, 7)) {
        G.UI.text(ctx, l, 104, ay, { size: 7, color: G.C.white });
        ay += 8;
      }
      if (Math.floor(this.t * 2) % 2 === 0) {
        G.UI.text(ctx, 'PRESS ENTER!', 240, 198, { align: 'center', size: 8, color: G.C.yellow });
      }
    } else {
      // locked silhouette
      ctx.fillStyle = G.C.ink;
      ctx.fillRect(108, 56, 56, 68);
      G.UI.text(ctx, '?', 136, 78, { align: 'center', size: 26, color: G.C.slate });
      G.UI.text(ctx, 'LOCKED', 240, 90, { align: 'center', size: 12, color: G.C.slate });
      G.UI.text(ctx, 'HOW TO UNLOCK:', 240, 120, { align: 'center', size: 8, color: G.C.cyan });
      G.UI.text(ctx, ch.unlockHint, 240, 134, { align: 'center', size: 8, color: G.C.yellow });
    }

    // thumbnail strip
    for (let i = 0; i < this.ORDER.length; i++) {
      const c = this.charAt(i);
      const un = this.isUnlocked(i);
      const x = G.W / 2 - this.ORDER.length * 22 + i * 44;
      const sel = i === this.index;
      ctx.fillStyle = sel ? G.C.blue : G.C.ink;
      ctx.fillRect(x, 218, 40, 40);
      ctx.strokeStyle = sel ? G.C.yellow : G.C.slate;

        G.UI.text(ctx, '?', x + 20, 228, { align: 'center', size: 14, color: G.C.slate });
      }

    G.UI.text(ctx, 'MOST HOMES SOLD BY END OF JUNE WINS. [ESC] BACK', G.W / 2, 262, { align: 'center', size: 6, color: G.C.gray });
  },
});

// scenes/map.js - the day hub: Northern MN map + action menu,
// weather, Brad's bank, Jeff's plaza, and the occasional squatch

'use strict';

G.Engine.register('map', {
  MAP_X: 150,

  enter(params = {}) {
    this.t = 0;
    this.mode = 'menu';           // menu | drive | stats | pipeline
    this.pipeScroll = 0;
    this.particles = new G.Particles();
    this.banner = null;
    this.deer = { x: G.rand(200, 440), y: G.rand(60, 230), vx: 6, show: G.chance(0.5) };
    this.bigfoot = null;

    const s = G.State.s;
    if (!s) { G.Engine.goto('title'); return; }

    // head-to-head listing battle interrupts the morning
    if (s.pendingBattle && !params.result) {
      G.Engine.goto('battle');
      return;
    }

    if (s.bigfootToday) {
      this.bigfoot = { x: G.rand(180, 450), y: G.rand(40, 230), t: 0, found: false };
    }

    const loc = G.Data.MAP.locations.office;
    if (this.carX === undefined) { this.carX = loc.x; this.carY = loc.y; }
    this.carTarget = null;
    this.pendingAction = null;

    this.buildMenu();
    G.Audio.startMusic();

    if (params.newDay) {
      const d = Math.min(s.dayOfMonth, G.Data.SEASON.daysPerMonth);
      const w = G.State.weatherData();
      this.banner = { text: G.State.monthName() + ' DAY ' + d + '/' + G.Data.SEASON.daysPerMonth + ' - ' + w.label, t: 2.4 };
    }

    if (params.result) {
      const { actionId, score } = params.result;
      this.resolveAction(actionId, score);
    }
    if (params.jeffDeal) {
      // returning from Jeff's negotiate minigame is handled via result above
    }
  },

  buildMenu() {
    const items = [];
    for (const a of G.Data.ACTIONS) {
      if (a.hidden) continue;
      const avail = G.State.actionAvailable(a.id);
      items.push({
        label: a.label,
        id: a.id,
        kind: 'action',
        disabled: !avail.ok,
        note: avail.ok ? '-' + G.State.actionCost(a.id) + 'E' : avail.reason,
        desc: a.desc,
      });
    }
    // legendary visits
    const s = G.State.s;
    items.push({
      label: '$ BRAD (BANK)', id: 'brad', kind: 'visit',
      disabled: s.bradUsed,
      note: s.bradUsed ? 'GONE' : 'FREE',
      desc: 'Visit Brad Nolan, The Mortgage Wizard. CLEAR TO CLOSE awaits.',
    });
    const jeffAvail = !s.commercialUnlocked || (s.jeffCooldown <= 0 && s.energy >= 1);
    items.push({
      label: '# JEFF (PLAZA)', id: 'jeff', kind: 'visit',
      disabled: !jeffAvail,
      note: !s.commercialUnlocked ? 'MEET' : (s.jeffCooldown > 0 ? s.jeffCooldown + 'D' : '-1E'),
      desc: 'Visit Jeff Nobleza, The Commercial King. Cap rates. Big money.',
    });
    const ab = G.State.char().ability;
    items.push({
      label: '* ' + ab.name, id: 'ability', kind: 'ability',
      disabled: s.abilityUsed,
      note: s.abilityUsed ? 'USED' : 'FREE',
      desc: ab.desc,
    });
    // SHOP / STATS / PIPELINE / END DAY live as fixed buttons below the list

    const keepIndex = this.menu ? this.menu.index : 0;
    this.menu = new G.Menu(items, {
      x: 4, y: 44, w: 142, rowH: 11,
      maxVisible: 14,
      onSelect: (it) => this.onMenuPick(it),
    });
    this.menu.index = Math.min(keepIndex, items.length - 1);
    this.menu.skipDisabled(1);
  },

  onMenuPick(it) {
    const s = G.State.s;
    if (it.kind === 'action') {
      const a = G.Data.ACTIONS.find(x => x.id === it.id);
      const loc = G.Data.MAP.locations[a.loc];
      this.pendingAction = a;
      this.carTarget = { x: loc.x, y: loc.y + 12 };
      this.mode = 'drive';
      G.Audio.swoosh();
    } else if (it.id === 'brad') {
      const loc = G.Data.MAP.locations.bank;
      this.pendingAction = { id: '_brad', loc: 'bank' };
      this.carTarget = { x: loc.x, y: loc.y + 12 };
      this.mode = 'drive';
      G.Audio.swoosh();
    } else if (it.id === 'jeff') {
      const loc = G.Data.MAP.locations.plaza;
      this.pendingAction = { id: '_jeff', loc: 'plaza' };
      this.carTarget = { x: loc.x, y: loc.y + 12 };
      this.mode = 'drive';
      G.Audio.swoosh();
    } else if (it.id === 'ability') {
      const res = G.State.useAbility();
      if (res) {
        this.particles.spawn(74, 140, { count: 20, colors: [G.C.yellow, G.C.cyan, G.C.lime] });
        G.Popup.show({
          title: G.State.char().ability.name, lines: res.lines,
          color: G.C.purple, onClose: () => this.buildMenu(),
        });
      }
    } else if (it.id === 'shop') {
      G.Engine.goto('shop');
    } else if (it.id === 'stats') {
      this.mode = 'stats';
    } else if (it.id === 'pipeline') {
      this.mode = 'pipeline'; this.pipeScroll = 0;
    } else if (it.id === 'endday') {
      this.endDay();
    }
  },

  // ----------------------------------------------------------
  visitBrad() {
    const res = G.State.visitBrad();
    if (res.sold) {
      G.Audio.cash();
      G.Engine.shake = 5;
      // golden paperwork everywhere
      this.particles.spawn(G.W / 2, 100, { count: 60, colors: [G.C.yellow, G.C.white, '#e6c86e'], life: 1.8, vyMin: -120, vyMax: -30 });
    }
    G.Popup.show({
      title: res.used ? 'THE BANK' : 'CLEAR TO CLOSE!',
      lines: res.lines,
      sprite: 'bradNolan',
      color: G.C.yellow, textColor: G.C.white,
      onClose: () => this.buildMenu(),
    });
  },

  visitJeff() {
    const res = G.State.visitJeff();
    if (res.unlock) {
      G.Audio.fanfare();
      G.Engine.shake = 4;
      // commercial buildings rise from the ground (particles will do)
      this.particles.spawn(222, 200, { count: 40, colors: [G.C.slate, G.C.sky, G.C.cyan], life: 1.5, vyMin: -100, vyMax: -40 });
      G.Popup.show({
        title: 'COMMERCIAL TAKEOVER!',
        lines: res.lines,
        sprite: 'jeffNobleza',
        color: G.C.purple,
        onClose: () => this.buildMenu(),
      });
    } else if (res.deal) {
      G.Popup.show({
        title: 'JEFF HAS A DEAL',
        lines: [...res.lines, '', 'Win the negotiation to close it. Ready?'],
        sprite: 'jeffNobleza',
        color: G.C.purple,
        onClose: () => G.Engine.goto('negotiateGame', { actionId: 'commercial' }),
      });
    } else {
      G.Popup.show({
        title: 'NOBLEZA COMMERCIAL',
        lines: res.lines,
        sprite: 'jeffNobleza',
        color: G.C.slate,
        onClose: () => this.buildMenu(),
      });
    }
  },

  // ----------------------------------------------------------
  resolveAction(actionId, score) {
    const res = G.State.performAction(actionId, score);
    const a = G.Data.ACTIONS.find(x => x.id === actionId);
    if (res.sold > 0) {
      G.Audio.cash();
      G.Engine.shake = 4;
      this.particles.spawn(G.W / 2, G.H / 2, { count: 40, colors: [G.C.yellow, G.C.green, G.C.lime, G.C.white], life: 1.4 });
    }
    G.Popup.show({
      title: (a ? a.label : 'RESULTS') + ' - RESULTS',
      lines: res.lines,
      color: res.sold > 0 ? G.C.green : G.C.blue,
      onClose: () => {
        this.buildMenu();
        if (G.State.s.energy <= 0) {
          G.Popup.show({
            title: 'OUT OF ENERGY',
            lines: ['You are running on fumes and gas station coffee.', 'Time to end the day.'],
            color: G.C.slate,
            onClose: () => this.endDay(),
          });
        }
      },
    });
  },

  // ----------------------------------------------------------
  endDay() {
    const s = G.State.s;
    const r = G.State.endDay();
    const lines = [];
    if (r.passiveLines.length) lines.push(...r.passiveLines, '');
    if (r.rivalLines.length) {
      lines.push('MEANWHILE...', ...r.rivalLines);
    } else {
      lines.push('Your rival was suspiciously quiet today.');
    }
    lines.push('', 'SCORE: YOU ' + s.stats.homesSold + ' - RIVAL ' + s.rival.homesSold);

    G.Popup.show({
      title: 'END OF DAY', lines, color: G.C.navy,
      onClose: () => {
        const proceed = () => {
          if (r.bossTime) G.Engine.goto('boss');
          else G.Engine.goto('map', { newDay: true });
        };
        if (r.eventText) {
          G.Audio[r.eventGood ? 'good' : 'thud']();
          G.Popup.show({
            title: r.eventGood ? 'PLOT TWIST!' : 'UFF DA...',
            lines: [r.eventText],
            color: r.eventGood ? G.C.green : G.C.red,
            onClose: proceed,
          });
        } else proceed();
      },
    });
  },

  // ----------------------------------------------------------
  update(dt) {
    this.t += dt;
    this.particles.update(dt);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }

    if (this.deer.show) {
      this.deer.x += this.deer.vx * dt;
      if (this.deer.x > 460) this.deer.vx = -6;
      if (this.deer.x < 160) this.deer.vx = 6;
    }

    // bigfoot: shy, wanders, click to spot him
    if (this.bigfoot && !this.bigfoot.found) {
      this.bigfoot.t += dt;
      this.bigfoot.x += Math.sin(this.bigfoot.t * 0.7) * 8 * dt;
      if (G.Input.clickedRect(this.bigfoot.x - 6, this.bigfoot.y - 6, 20, 24)) {
        this.bigfoot.found = true;
        G.State.s.stats.followers += 500;
        G.Profile.award('squatch');
        G.Audio.fanfare();
        this.particles.spawn(this.bigfoot.x, this.bigfoot.y, { count: 24, colors: [G.C.lime, G.C.yellow] });
        G.Popup.show({
          title: 'SQUATCH SPOTTED!',
          lines: ['You saw him. He saw you. He nodded.', 'You got a (blurry) photo. +500 FOLLOWERS.', 'He is a homeowner, by the way. Paid cash.'],
          sprite: 'bigfoot',
          color: G.C.green,
        });
      }
    }

    if (this.mode === 'drive') {
      const tgt = this.carTarget;
      const d = G.dist(this.carX, this.carY, tgt.x, tgt.y);
      if (d < 3) {
        this.mode = 'menu';
        const a = this.pendingAction;
        this.pendingAction = null;
        if (a.id === '_brad') { this.visitBrad(); return; }
        if (a.id === '_jeff') { this.visitJeff(); return; }
        if (a.minigame) {
          G.Engine.goto(a.minigame, { actionId: a.id });
        } else {
          this.resolveAction(a.id, null);
        }
      } else {
        const sp = 130 * dt;
        this.carX += (tgt.x - this.carX) / d * sp;
        this.carY += (tgt.y - this.carY) / d * sp;
      }
      return;
    }

    if (this.mode === 'stats' || this.mode === 'pipeline') {
      if (this.mode === 'pipeline') {
        if (G.Input.up()) { this.pipeScroll = Math.max(0, this.pipeScroll - 1); return; }
        if (G.Input.down()) { this.pipeScroll++; return; }
      }
      if (G.Input.cancel() || G.Input.confirm() || G.Input.mouse.clicked) {
        this.mode = 'menu'; G.Audio.back();
      }
      return;
    }

    // hotkeys for the bottom nav
    if (G.Input.p('p')) { this.mode = 'pipeline'; this.pipeScroll = 0; G.Audio.select(); return; }
    if (G.Input.p('t')) { this.mode = 'stats'; G.Audio.select(); return; }
    if (G.Input.p('b')) { G.Engine.goto('shop'); G.Audio.select(); return; }
    if (G.Input.p('z')) { this.endDay(); return; }

    this.menu.update();
  },

  // ----------------------------------------------------------
  render(ctx) {
    const s = G.State.s;
    if (!s) return;

    this.renderMap(ctx);
    this.renderWeather(ctx);
    this.renderSidebar(ctx);
    this.renderHud(ctx);
    this.particles.render(ctx);

    if (this.mode === 'stats') this.renderStats(ctx);
    if (this.mode === 'pipeline') this.renderPipeline(ctx);

    if (this.banner) {
      const a = Math.min(1, this.banner.t);
      ctx.globalAlpha = a;
      ctx.fillStyle = G.C.ink;
      ctx.fillRect(0, 110, G.W, 34);
      G.UI.text(ctx, this.banner.text, G.W / 2, 122, { align: 'center', size: 12, color: G.C.yellow });
      ctx.globalAlpha = 1;
    }
  },

  renderMap(ctx) {
    const s = G.State.s;
    const MX = this.MAP_X;

    ctx.fillStyle = ['#41684d', '#4a7c59', '#529960'][s.month] || '#529960';
    ctx.fillRect(MX, 0, G.W - MX, G.H);

    for (let i = 0; i < 60; i++) {
      const px = MX + ((i * 53) % (G.W - MX));
      const py = (i * 37) % G.H;
      ctx.fillStyle = i % 3 ? 'rgba(26,28,44,0.12)' : 'rgba(255,255,255,0.05)';
      ctx.fillRect(px, py, 3, 2);
    }
    if (s.month === 0) {
      for (let i = 0; i < 24; i++) {
        ctx.fillStyle = 'rgba(244,244,244,0.5)';
        ctx.fillRect(MX + ((i * 89) % (G.W - MX - 10)), (i * 61) % (G.H - 8), 6, 3);
      }
    }

    ctx.strokeStyle = '#6b6f82';
    ctx.lineWidth = 2;
    const T = G.Data.MAP.towns;
    ctx.beginPath();
    for (let i = 0; i < T.length - 1; i++) {
      ctx.moveTo(T[i].x, T[i].y);
      ctx.lineTo(T[i + 1].x, T[i + 1].y);
    }
    ctx.stroke();
    ctx.lineWidth = 1;

    for (const lake of G.Data.MAP.lakes) {
      ctx.fillStyle = G.C.blue;
      ctx.beginPath();
      ctx.ellipse(lake.x + lake.w / 2, lake.y + lake.h / 2, lake.w / 2, lake.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = G.C.sky;
      for (let i = 0; i < 5; i++) {
        const wx = lake.x + 8 + ((i * 31 + Math.floor(this.t * 8)) % (lake.w - 16));
        ctx.fillRect(wx, lake.y + 6 + (i * 7) % (lake.h - 12), 4, 1);
      }
      G.UI.text(ctx, lake.name, lake.x + lake.w / 2, lake.y + lake.h / 2 - 3, { align: 'center', size: 6, color: G.C.cyan });
    }

    for (let i = 0; i < 26; i++) {
      const px = MX + 6 + ((i * 47) % (G.W - MX - 16));
      const py = 4 + ((i * 71) % (G.H - 30));
      const onLake = G.Data.MAP.lakes.some(l =>
        px > l.x - 6 && px < l.x + l.w + 2 && py > l.y - 8 && py < l.y + l.h + 2);
      if (!onLake) G.drawSprite(ctx, i % 2 ? G.Sprites.pine : G.Sprites.pine2, px, py, 1);
    }

    for (const t of T) {
      ctx.fillStyle = G.C.gray;
      ctx.fillRect(t.x - 3, t.y - 2, 6, 4);
      G.UI.text(ctx, t.name, t.x, t.y + 5, { align: 'center', size: 6, color: G.C.white, shadow: true });
    }

    // action locations
    const selected = this.menu && this.menu.items[this.menu.index];
    let selLoc = null;
    if (selected) {
      if (selected.kind === 'action') selLoc = (G.Data.ACTIONS.find(a => a.id === selected.id) || {}).loc;
      if (selected.id === 'brad') selLoc = 'bank';
      if (selected.id === 'jeff') selLoc = 'plaza';
    }
    for (const [key, loc] of Object.entries(G.Data.MAP.locations)) {
      const sp = G.Sprites[loc.sprite];
      G.drawSprite(ctx, sp, loc.x - sp.width / 2, loc.y - sp.height, 1);
      if (key === selLoc) {
        const bob = Math.sin(this.t * 6) * 2;
        ctx.fillStyle = G.C.yellow;
        ctx.beginPath();
        ctx.moveTo(loc.x, loc.y - sp.height - 4 + bob);
        ctx.lineTo(loc.x - 4, loc.y - sp.height - 10 + bob);
        ctx.lineTo(loc.x + 4, loc.y - sp.height - 10 + bob);
        ctx.fill();
        G.UI.text(ctx, loc.label, loc.x, loc.y - sp.height - 19 + bob, { align: 'center', size: 6, color: G.C.yellow, shadow: true });
      }
    }

    if (this.deer.show) {
      G.drawSprite(ctx, G.Sprites.deer, this.deer.x, this.deer.y, 1, this.deer.vx < 0);
    }

    // bigfoot lurks among the pines
    if (this.bigfoot && !this.bigfoot.found) {
      ctx.globalAlpha = 0.6 + Math.sin(this.bigfoot.t * 2) * 0.2;
      G.drawSprite(ctx, G.Sprites.bigfoot, this.bigfoot.x, this.bigfoot.y, 1);
      ctx.globalAlpha = 1;
    }

    const carSprite = (G.State.has('vehicle') || G.State.has('luxsuv')) ? G.Sprites.carFancy : G.Sprites.car;
    G.drawSprite(ctx, carSprite, this.carX - 5, this.carY - 4, 1, this.carTarget && this.carTarget.x < this.carX);

    G.UI.text(ctx, 'NORTHERN MINNESOTA', G.W - 6, G.H - 10, { align: 'right', size: 6, color: 'rgba(244,244,244,0.5)' });
  },

  renderWeather(ctx) {
    const w = G.State.weatherData();
    const MX = this.MAP_X;
    if (w.snow) {
      ctx.fillStyle = G.C.white;
      for (let i = 0; i < 40; i++) {
        const x = MX + ((i * 83 + this.t * 30) % (G.W - MX));
        const y = (i * 47 + this.t * 60) % G.H;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    if (w.rain) {
      ctx.strokeStyle = 'rgba(115,239,247,0.4)';
      for (let i = 0; i < 30; i++) {
        const x = MX + ((i * 97 + this.t * 140) % (G.W - MX));
        const y = (i * 53 + this.t * 240) % G.H;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 5); ctx.stroke();
      }
    }
    if (w.fog) {
      ctx.fillStyle = 'rgba(148,176,194,0.28)';
      ctx.fillRect(MX, 0, G.W - MX, G.H);
    }
    if (w.aurora) {
      for (let x = MX; x < G.W; x += 4) {
        const h = 16 + Math.sin(x * 0.04 + this.t * 1.4) * 8;
        ctx.fillStyle = 'rgba(56,183,100,0.18)';
        ctx.fillRect(x, 4 + Math.sin(x * 0.02 + this.t) * 5, 4, h);
      }
    }
    if (w.id === 'heat') {
      ctx.fillStyle = 'rgba(239,125,87,0.10)';
      ctx.fillRect(MX, 0, G.W - MX, G.H);
    }
  },

  renderSidebar(ctx) {
    const s = G.State.s;
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(0, 0, this.MAP_X, G.H);
    ctx.strokeStyle = G.C.slate;
    ctx.beginPath(); ctx.moveTo(this.MAP_X - 0.5, 0); ctx.lineTo(this.MAP_X - 0.5, G.H); ctx.stroke();

    const ch = G.State.char();
    G.drawSprite(ctx, G.Sprites[ch.sprite], 4, 4, 2);
    G.UI.text(ctx, ch.name, 38, 6, { size: 9, color: ch.id === 'bridger' ? '#c0562f' : (ch.color || G.C.lime) });
    G.UI.text(ctx, G.money(s.cash), 38, 17, { size: 8, color: G.C.yellow });

    G.UI.text(ctx, 'ENERGY', 38, 28, { size: 6, color: G.C.gray });
    for (let i = 0; i < G.State.maxEnergy(); i++) {
      ctx.fillStyle = i < s.energy ? G.C.lime : G.C.dusk;
      ctx.fillRect(72 + i * 8, 28, 6, 6);
      ctx.strokeStyle = G.C.slate;
      ctx.strokeRect(72.5 + i * 8, 28.5, 5, 5);
    }

    this.menu.render(ctx);

    // fixed bottom nav: always visible so PIPELINE/STATS/SHOP/END DAY never scroll off
    if (G.UI.button(ctx, 'SHOP [B]', 4, 202, 70, 13, { size: 7 })) { G.Engine.goto('shop'); G.Audio.select(); }
    if (G.UI.button(ctx, 'STATS [T]', 77, 202, 69, 13, { size: 7 })) { this.mode = 'stats'; G.Audio.select(); }
    if (G.UI.button(ctx, 'PIPELINE [P]', 4, 217, 70, 13, { size: 7 })) { this.mode = 'pipeline'; this.pipeScroll = 0; G.Audio.select(); }
    if (G.UI.button(ctx, 'END DAY [Z]', 77, 217, 69, 13, { size: 7, color: G.C.orange })) { this.endDay(); }

    const it = this.menu.items[this.menu.index];
    if (it && it.desc) {
      const lines = G.UI.wrap(ctx, it.desc, 138, 7).slice(0, 4);
      let y = 236;
      ctx.fillStyle = G.C.dusk;
      ctx.fillRect(2, y - 3, this.MAP_X - 6, lines.length * 8 + 6);
      for (const l of lines) {
        G.UI.text(ctx, l, 6, y, { size: 7, color: G.C.cyan });
        y += 8;
      }
    }
  },

  renderHud(ctx) {
    const s = G.State.s;
    const w = 210, x = G.W - w - 4, y = 3;
    ctx.fillStyle = 'rgba(26,28,44,0.85)';
    ctx.fillRect(x, y, w, 22);
    ctx.strokeStyle = G.C.slate;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 21);
    G.UI.text(ctx, G.State.monthName() + ' D' + Math.min(s.dayOfMonth, G.Data.SEASON.daysPerMonth) + '/' + G.Data.SEASON.daysPerMonth, x + 5, y + 3, { size: 7, color: G.C.white });
    G.UI.text(ctx, 'YOU ' + s.stats.homesSold, x + 5, y + 12, { size: 7, color: G.C.lime });
    G.UI.text(ctx, 'RIVAL ' + s.rival.homesSold, x + 50, y + 12, { size: 7, color: G.C.red });
    const wd = G.State.weatherData();
    G.UI.text(ctx, wd.label, x + w - 5, y + 3, { align: 'right', size: 7, color: G.C.cyan });
    G.UI.text(ctx, 'LEADS ' + s.leads.length + '  FLW ' + s.stats.followers, x + w - 5, y + 12, { align: 'right', size: 7, color: G.C.yellow });
  },

  renderStats(ctx) {
    const s = G.State.s;
    ctx.fillStyle = 'rgba(26,28,44,0.85)';
    ctx.fillRect(0, 0, G.W, G.H);
    G.UI.panel(ctx, 90, 14, 300, 244, { title: 'SEASON STAT SHEET', titleBg: G.C.teal, bg: G.C.ink });

    const rows = [
      ['HOMES SOLD', s.stats.homesSold, G.C.lime],
      ['COMMISSION EARNED', G.money(s.stats.commission), G.C.yellow],
      ['COMMERCIAL DEALS', s.stats.commercialDeals, G.C.purple],
      ['LISTINGS TAKEN', s.stats.listings, G.C.white],
      ['BUYER CLIENTS', s.stats.buyers, G.C.white],
      ['REFERRALS', s.stats.referrals, G.C.white],
      ['ONLINE REVIEWS', s.stats.reviews + ' (5-STAR)', G.C.cyan],
      ['SOCIAL FOLLOWERS', s.stats.followers, G.C.sky],
      ['CLIENT HAPPINESS', s.stats.happiness + '/100', G.C.orange],
      ['REPUTATION', s.stats.reputation + '/100', G.C.yellow],
      ['LEADS RECEIVED', s.stats.leadsReceived, G.C.gray],
      ['CONVERSION RATE', G.pct(G.State.conversionRate()), G.C.lime],
      ['BOSS WINS', s.stats.bossWins, G.C.purple],
      ['RIVALRY LEVEL', ['FRIENDLY', 'SPICY', 'FULL FEUD'][Math.min(2, Math.floor(s.rivalry / 2))], G.C.red],
      ['CASH ON HAND', G.money(s.cash), G.C.yellow],
    ];
    let y = 32;
    for (const [label, val, color] of rows) {
      G.UI.text(ctx, label, 104, y, { size: 8, color: G.C.gray });
      G.UI.text(ctx, String(val), 376, y, { align: 'right', size: 8, color });
      y += 14;
    }
    G.UI.text(ctx, '[ESC] CLOSE', G.W / 2, y + 4, { align: 'center', size: 7, color: G.C.yellow });
  },

  renderPipeline(ctx) {
    const s = G.State.s;
    ctx.fillStyle = 'rgba(26,28,44,0.85)';
    ctx.fillRect(0, 0, G.W, G.H);
    G.UI.panel(ctx, 60, 16, 360, 238, { title: 'LEAD PIPELINE (' + s.leads.length + ')', titleBg: G.C.blue, bg: G.C.ink });

    const order = G.Data.STAGES;
    const leads = s.leads.slice().sort((a, b) => order.indexOf(b.stage) - order.indexOf(a.stage));
    const perPage = 13;
    const maxScroll = Math.max(0, leads.length - perPage);
    this.pipeScroll = G.clamp(this.pipeScroll, 0, maxScroll);
    const visible = leads.slice(this.pipeScroll, this.pipeScroll + perPage);

    let y = 36;
    if (!leads.length) {
      G.UI.text(ctx, 'NO LEADS. GO MAKE A VIDEO OR HOST AN OPEN HOUSE!', G.W / 2, 120, { align: 'center', size: 8, color: G.C.gray });
    }
    for (const l of visible) {
      G.UI.text(ctx, l.name, 70, y, { size: 7, color: G.C.white });
      G.UI.text(ctx, l.label, 165, y, { size: 7, color: l.commercial ? G.C.purple : l.lake ? G.C.cyan : l.luxury ? G.C.yellow : G.C.gray });
      G.UI.text(ctx, G.money(l.value), 300, y, { size: 7, color: G.C.yellow });
      const sc = G.Data.STAGE_COLORS[l.stage];
      ctx.fillStyle = sc;
      ctx.fillRect(340, y, 4, 6);
      G.UI.text(ctx, G.Data.STAGE_LABELS[l.stage] + (l.issue ? '!' : ''), 348, y, { size: 7, color: l.issue ? G.C.red : sc });
      y += 15;
    }
    if (maxScroll > 0) {
      G.UI.text(ctx, 'UP/DOWN TO SCROLL (' + (this.pipeScroll + 1) + '-' + Math.min(leads.length, this.pipeScroll + perPage) + ')', G.W / 2, 236, { align: 'center', size: 6, color: G.C.slate });
    }
    G.UI.text(ctx, '[ESC] CLOSE', G.W / 2, 245, { align: 'center', size: 7, color: G.C.yellow });
  },
});

</script>
<script>
// ============================================================
// scenes/shop.js - business upgrades: GEAR | OFFICES | TOYS
// ============================================================
'use strict';

G.Engine.register('shop', {
  TABS: ['GEAR', 'OFFICES', 'TOYS'],

  enter() {
    this.t = 0;
    this.tab = 0;
    this.buildMenu();
  },

  tabItems() {
    if (this.tab === 0) return G.Data.UPGRADES;
    if (this.tab === 1) return G.Data.OFFICES;
    return G.Data.TOYS;
  },

  buildMenu() {
    const s = G.State.s;
    const items = this.tabItems().map((u, i) => {
      const owned = G.State.has(u.id);
      const afford = s.cash >= u.cost;
      // offices unlock in order
      let lockedByOrder = false;
      if (this.tab === 1 && i > 0 && !G.State.has(G.Data.OFFICES[i - 1].id)) lockedByOrder = true;
      return {
        label: u.name,
        id: u.id,
        disabled: owned || !afford || lockedByOrder,
        note: owned ? 'OWNED' : lockedByOrder ? 'LOCKED' : G.money(u.cost),
        desc: u.desc + (lockedByOrder ? ' (Buy the previous office first.)' : ''),
        cost: u.cost,
      };
    });
    items.push({ label: 'BACK TO MAP', id: 'back', note: '', desc: 'Return to the grind.' });

    const keep = this.menu ? this.menu.index : 0;
    this.menu = new G.Menu(items, {
      x: 12, y: 52, w: 210, rowH: 14,
      maxVisible: 13,
      onSelect: (it) => {
        if (it.id === 'back') { G.Engine.goto('map'); return; }
        if (G.State.buyUpgrade(it.id)) {
          G.Audio.cash();
          this.buildMenu();
        } else {
          G.Audio.bad();
        }
      },
    });
    this.menu.index = Math.min(keep, items.length - 1);
  },

  update(dt) {
    this.t += dt;
    if (G.Input.cancel()) { G.Audio.back(); G.Engine.goto('map'); return; }
    // tab switching
    if (G.Input.left())  { this.tab = (this.tab + 2) % 3; this.buildMenu(); G.Audio.move(); return; }
    if (G.Input.right()) { this.tab = (this.tab + 1) % 3; this.buildMenu(); G.Audio.move(); return; }
    for (let i = 0; i < 3; i++) {
      const x = 12 + i * 74;
      if (G.Input.clickedRect(x, 30, 70, 16)) { this.tab = i; this.buildMenu(); G.Audio.move(); return; }
    }
    this.menu.update();
  },

  render(ctx) {
    const s = G.State.s;
    ctx.fillStyle = G.C.dusk;
    ctx.fillRect(0, 0, G.W, G.H);

    G.UI.panel(ctx, 4, 4, G.W - 8, G.H - 8, { title: 'PRO SHOP - GROW YOUR EMPIRE', titleBg: G.C.purple, bg: G.C.ink });
    G.UI.text(ctx, 'CASH: ' + G.money(s.cash), G.W - 16, 22, { align: 'right', size: 10, color: G.C.yellow });

    // tabs
    for (let i = 0; i < 3; i++) {
      const x = 12 + i * 74;
      const sel = this.tab === i;
      ctx.fillStyle = sel ? G.C.blue : G.C.navy;
      ctx.fillRect(x, 30, 70, 16);
      ctx.strokeStyle = sel ? G.C.yellow : G.C.slate;
      ctx.strokeRect(x + 0.5, 30.5, 69, 15);
      G.UI.text(ctx, this.TABS[i], x + 35, 34, { align: 'center', size: 8, color: sel ? G.C.white : G.C.gray });
    }
    G.UI.text(ctx, '< > SWITCH TAB', 240, 34, { size: 7, color: G.C.slate });

    this.menu.render(ctx);

    // detail card
    const it = this.menu.items[this.menu.index];
    G.UI.panel(ctx, 240, 52, 226, 140, { title: it.label, titleBg: G.C.blue, bg: G.C.navy });
    let y = 72;
    for (const l of G.UI.wrap(ctx, it.desc || '', 202, 8)) {
      G.UI.text(ctx, l, 250, y, { size: 8, color: G.C.white });
      y += 11;
    }
    if (it.id !== 'back') {
      const owned = G.State.has(it.id);
      G.UI.text(ctx, owned ? 'ALREADY OWNED' : 'COST: ' + G.money(it.cost || 0), 250, 172, {
        size: 9, color: owned ? G.C.lime : (s.cash >= (it.cost || 0) ? G.C.yellow : G.C.red),
      });
    }

    const ownedCount = G.State.allShopItems().filter(u => G.State.has(u.id)).length;
    G.UI.text(ctx, 'OWNED: ' + ownedCount + '/' + G.State.allShopItems().length + ' UPGRADES', 240, 200, { size: 7, color: G.C.gray });
    G.UI.text(ctx, '[ESC] BACK', 240, 212, { size: 7, color: G.C.slate });
  },
});

</script>
<script>
// ============================================================
// scenes/minigames.js - the 8 action mini-games
// All share a frame: INTRO -> PLAY -> RESULT -> back to map.
// Each finishes with a score 0..1 that state.js turns into results.
// ============================================================
'use strict';

// ------------------------------------------------------------
// Shared minigame scaffolding
// def: { title, subtitle, howto:[], duration, init(), play(dt), draw(ctx), bonus() }
// ------------------------------------------------------------
G.makeMinigame = (name, def) => {
  const scene = {
    enter(params) {
      this.actionId = params.actionId;
      this.phase = 'intro';
      this.t = 0;
      this.playT = 0;
      this.score = 0;
      this.flash = null; // {text, color, t}
      this.particles = new G.Particles();
      def.init.call(this);
      G.Audio.stopMusic();
    },

    exit() { G.Audio.startMusic(); },

    finish(rawScore) {
      if (this.phase === 'done') return;
      let sc = G.clamp(rawScore, 0, 1);
      if (def.bonus) sc = G.clamp(sc + def.bonus.call(this), 0, 1);
      this.score = sc;
      this.phase = 'done';
      this.t = 0;
      if (sc >= 0.6) G.Audio.great(); else if (sc >= 0.35) G.Audio.good(); else G.Audio.sadTromb();
    },

    pop(text, color) { this.flash = { text, color: color || G.C.yellow, t: 0.7 }; },

    update(dt) {
      this.t += dt;
      this.particles.update(dt);
      if (this.flash) { this.flash.t -= dt; if (this.flash.t <= 0) this.flash = null; }

      if (this.phase === 'intro') {
        if (this.t > 0.3 && (G.Input.confirm() || G.Input.mouse.clicked)) {
          this.phase = 'play';
          this.t = 0;
          G.Audio.select();
        }
        return;
      }
      if (this.phase === 'play') {
        this.playT += dt;
        def.play.call(this, dt);
        if (def.duration && this.playT >= def.duration) this.finish(def.timeUp ? def.timeUp.call(this) : this.score);
        return;
      }
      if (this.phase === 'done') {
        if (this.t > 0.5 && (G.Input.confirm() || G.Input.mouse.clicked)) {
          G.Engine.goto('map', { result: { actionId: this.actionId, score: this.score } });
        }
      }
    },

    render(ctx) {
      ctx.fillStyle = def.bg || G.C.dusk;
      ctx.fillRect(0, 0, G.W, G.H);

      // header
      ctx.fillStyle = G.C.ink;
      ctx.fillRect(0, 0, G.W, 24);
      G.UI.text(ctx, def.title, 8, 5, { size: 11, color: G.C.yellow });
      G.UI.text(ctx, def.subtitle, G.W - 8, 8, { align: 'right', size: 7, color: G.C.gray });

      if (this.phase === 'intro') {
        G.UI.panel(ctx, 90, 70, 300, 130, { title: 'GET READY', titleBg: G.C.blue, bg: G.C.ink });
        let y = 92;
        for (const line of def.howto) {
          for (const l of G.UI.wrap(ctx, line, 270, 8)) {
            G.UI.text(ctx, l, 104, y, { size: 8, color: G.C.white });
            y += 11;
          }
        }
        if (Math.floor(this.t * 2) % 2 === 0) {
          G.UI.text(ctx, '- PRESS ENTER TO START -', G.W / 2, 182, { align: 'center', size: 8, color: G.C.yellow });
        }
        return;
      }

      def.draw.call(this, ctx);
      this.particles.render(ctx);

      // timer bar
      if (def.duration && this.phase === 'play') {
        G.UI.bar(ctx, 8, G.H - 12, G.W - 16, 6, 1 - this.playT / def.duration,
          this.playT / def.duration > 0.75 ? G.C.red : G.C.cyan);
      }

      // flash text
      if (this.flash) {
        G.UI.text(ctx, this.flash.text, G.W / 2, 110, { align: 'center', size: 14, color: this.flash.color, shadow: true });
      }

      if (this.phase === 'done') {
        ctx.fillStyle = 'rgba(26,28,44,0.8)';
        ctx.fillRect(0, 0, G.W, G.H);
        const grade = this.score >= 0.85 ? 'S' : this.score >= 0.7 ? 'A' : this.score >= 0.5 ? 'B' : this.score >= 0.3 ? 'C' : 'D';
        const gcol = this.score >= 0.7 ? G.C.lime : this.score >= 0.4 ? G.C.yellow : G.C.red;
        G.UI.text(ctx, 'RANK', G.W / 2, 82, { align: 'center', size: 10, color: G.C.gray });
        G.UI.text(ctx, grade, G.W / 2, 98, { align: 'center', size: 44, color: gcol, shadow: true });
        G.UI.text(ctx, def.gradeLines ? def.gradeLines.call(this) : Math.round(this.score * 100) + '%', G.W / 2, 152, { align: 'center', size: 9, color: G.C.white });
        if (this.t > 0.5 && Math.floor(this.t * 2) % 2 === 0) {
          G.UI.text(ctx, '- PRESS ENTER -', G.W / 2, 190, { align: 'center', size: 8, color: G.C.yellow });
        }
      }
    },
  };

  // expose the definition's helper methods (e.g. newRound) on the scene
  for (const [k, v] of Object.entries(def)) {
    if (typeof v === 'function' && !(k in scene)) scene[k] = v;
  }
  G.Engine.register(name, scene);
};

// ------------------------------------------------------------
// 1. CALL LEADS - stop the needle in the sweet-talk zone (x3)
// ------------------------------------------------------------
G.makeMinigame('callGame', {
  title: 'COLD CALL FRENZY',
  subtitle: 'STOP THE NEEDLE IN THE GREEN',
  howto: [
    'Your lead answers! Hit SPACE/ENTER (or click) when the needle is in the GREEN sweet-talk zone.',
    '3 calls. Green = appointment. Red = voicemail abyss.',
  ],
  bg: G.C.navy,

  init() {
    this.calls = 0;
    this.hits = 0;
    this.needle = 0;
    this.dir = 1;
    this.speed = 1.6;
    this.zone = { start: 0.4, width: 0.2 };
    this.locked = false;
    G.Audio.ring();
  },

  play(dt) {
    if (this.locked) return;
    this.needle += this.dir * this.speed * dt;
    if (this.needle > 1) { this.needle = 1; this.dir = -1; }
    if (this.needle < 0) { this.needle = 0; this.dir = 1; }

    if (G.Input.confirm() || G.Input.mouse.clicked) {
      this.locked = true;
      const inZone = this.needle >= this.zone.start && this.needle <= this.zone.start + this.zone.width;
      if (inZone) {
        this.hits++;
        this.pop(G.choice(['"OH YEAH, LET\'S MEET!"', '"YOU BETCHA!"', '"FINALLY, A REAL AGENT!"']), G.C.lime);
        G.Audio.good();
        this.particles.spawn(G.W / 2, 130, { count: 12, colors: [G.C.lime, G.C.cyan] });
      } else {
        this.pop(G.choice(['VOICEMAIL...', '"NEW PHONE WHO DIS"', '*DIAL TONE*']), G.C.red);
        G.Audio.bad();
      }
      setTimeout(() => {
        this.calls++;
        if (this.calls >= 3) { this.finish(this.hits / 3); return; }
        this.locked = false;
        this.speed += 0.55;
        this.zone.width = Math.max(0.12, this.zone.width - 0.03);
        this.zone.start = G.rand(0.15, 0.85 - this.zone.width);
        G.Audio.ring();
      }, 700);
    }
  },

  draw(ctx) {
    G.UI.text(ctx, 'CALL ' + Math.min(this.calls + 1, 3) + ' OF 3', G.W / 2, 44, { align: 'center', size: 10, color: G.C.white });
    G.drawSprite(ctx, G.Sprites.phone, G.W / 2 - 40 - Math.sin(this.t * 20) * (this.locked ? 0 : 2), 60, 4);
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], G.W / 2 + 20, 52, 3);

    // meter
    const mx = 90, my = 170, mw = 300, mh = 18;
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
    ctx.fillStyle = G.C.red;
    ctx.fillRect(mx, my, mw, mh);
    ctx.fillStyle = G.C.green;
    ctx.fillRect(mx + this.zone.start * mw, my, this.zone.width * mw, mh);
    // needle
    ctx.fillStyle = G.C.white;
    ctx.fillRect(mx + this.needle * mw - 1, my - 5, 3, mh + 10);
    G.UI.text(ctx, 'HITS: ' + this.hits, G.W / 2, 200, { align: 'center', size: 9, color: G.C.lime });
  },

  gradeLines() { return this.hits + ' APPOINTMENT' + (this.hits === 1 ? '' : 'S') + ' FROM 3 CALLS'; },
});

// ------------------------------------------------------------
// 2. TEXT LEADS - pick the right reply, fast
// ------------------------------------------------------------
G.TEXT_ROUNDS = [
  { msg: 'Is the house still available??', good: 'Yes! Want to tour it today?', bad: ['Define "available"...', 'It has always been available. Always.'] },
  { msg: 'What are the sellers like?', good: 'Lovely folks, motivated to sell!', bad: ['Never met em. Nobody has.', 'They live in the walls now.'] },
  { msg: 'Can we see it at 9pm tonight?', good: 'Absolutely, I will bring flashlights!', bad: ['No. I sleep at 8:30.', 'Only if you buy me dinner first.'] },
  { msg: 'Is the basement dry?', good: 'Inspection says yes - report attached!', bad: ['Depends how you define "lake".', 'It has a built-in pool (unintentional).'] },
  { msg: 'We love it but the price...', good: 'Let\'s write a smart offer together!', bad: ['Prices are fake. Money is fake.', 'Have you tried being richer?'] },
  { msg: 'Do the appliances stay?', good: 'Washer, dryer & fridge all stay!', bad: ['The fridge chooses who stays.', 'Everything must go... including you?'] },
];

G.makeMinigame('textGame', {
  title: 'THUMB STORM',
  subtitle: 'PICK THE PRO REPLY - FAST',
  howto: [
    'Leads are texting! Pick the PROFESSIONAL reply with UP/DOWN + ENTER (or click) before the patience meter empties.',
    '4 messages. Speed earns bonus points.',
  ],
  bg: G.C.teal,

  init() {
    this.rounds = G.shuffle(G.TEXT_ROUNDS).slice(0, 4);
    this.round = 0;
    this.points = 0;
    this.max = 4;
    this.newRound();
  },

  newRound() {
    const r = this.rounds[this.round];
    const opts = G.shuffle([{ t: r.good, ok: true }, { t: r.bad[0], ok: false }, { t: r.bad[1], ok: false }]);
    this.opts = opts;
    this.sel = 0;
    this.timer = 5;
    this.answered = false;
    G.Audio.tick();
  },

  play(dt) {
    if (this.answered) return;
    this.timer -= dt;
    if (this.timer <= 0) {
      this.pop('TOO SLOW! LEAD WANDERED OFF', G.C.red);
      G.Audio.bad();
      this.nextRound();
      return;
    }
    if (G.Input.up()) { this.sel = (this.sel + 2) % 3; G.Audio.move(); }
    if (G.Input.down()) { this.sel = (this.sel + 1) % 3; G.Audio.move(); }

    let picked = -1;
    if (G.Input.confirm()) picked = this.sel;
    for (let i = 0; i < 3; i++) {
      if (G.Input.clickedRect(60, 120 + i * 30, 360, 26)) picked = i;
    }

    if (picked >= 0) {
      this.sel = picked;
      if (this.opts[picked].ok) {
        const speedBonus = this.timer > 3 ? 0.25 : 0;
        this.points += 0.75 + speedBonus;
        this.pop(speedBonus ? 'LIGHTNING THUMBS! +BONUS' : 'SMOOTH REPLY!', G.C.lime);
        G.Audio.good();
      } else {
        this.pop('...THEY LEFT YOU ON READ', G.C.red);
        G.Audio.bad();
      }
      this.nextRound();
    }
  },

  nextRound() {
    this.answered = true;
    setTimeout(() => {
      this.round++;
      if (this.round >= 4) { this.finish(this.points / this.max); return; }
      this.newRound();
    }, 650);
  },

  draw(ctx) {
    const r = this.rounds[Math.min(this.round, 3)];
    G.UI.text(ctx, 'MSG ' + Math.min(this.round + 1, 4) + '/4', 8, 32, { size: 8, color: G.C.white });
    // incoming bubble
    G.UI.panel(ctx, 60, 44, 360, 40, { bg: G.C.ink, border: G.C.gray });
    G.UI.text(ctx, 'LEAD:', 70, 52, { size: 7, color: G.C.orange });
    G.UI.text(ctx, r.msg, 70, 64, { size: 9, color: G.C.white });
    // patience
    G.UI.text(ctx, 'PATIENCE', 60, 92, { size: 7, color: G.C.gray });
    G.UI.bar(ctx, 120, 92, 240, 7, this.timer / 5, this.timer < 1.5 ? G.C.red : G.C.orange);
    // replies
    for (let i = 0; i < 3; i++) {
      const y = 120 + i * 30;
      const sel = this.sel === i;
      ctx.fillStyle = sel ? G.C.blue : G.C.ink;
      ctx.fillRect(60, y, 360, 26);
      ctx.strokeStyle = sel ? G.C.yellow : G.C.slate;
      ctx.strokeRect(60.5, y + 0.5, 359, 25);
      G.UI.text(ctx, (sel ? '> ' : '  ') + this.opts[i].t, 68, y + 9, { size: 8, color: sel ? G.C.white : G.C.gray });
    }
  },

  gradeLines() { return 'REPLY GAME: ' + Math.round(this.score * 100) + '% SMOOTH'; },
});

// ------------------------------------------------------------
// 3. LISTING APPOINTMENT - repeat the pitch (Simon-style)
// ------------------------------------------------------------
G.makeMinigame('listingGame', {
  title: 'PITCH PERFECT',
  subtitle: 'REPEAT THE WINNING PITCH',
  howto: [
    'The seller wants to hear THE PITCH, in exactly the right order.',
    'Watch the arrow sequence, then repeat it with the ARROW KEYS.',
    '3 rounds. Each round gets longer. No pressure.',
  ],
  bg: G.C.purple,

  init() {
    this.round = 0;         // 0..2, lengths 3,4,5
    this.state = 'show';    // show | input | between
    this.seq = [];
    this.showIdx = 0;
    this.showTimer = 0;
    this.inputIdx = 0;
    this.done = 0;
    this.newSeq();
  },

  newSeq() {
    const len = 3 + this.round;
    const dirs = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    this.seq = Array.from({ length: len }, () => G.choice(dirs));
    this.state = 'show';
    this.showIdx = -1;
    this.showTimer = 0.4;
    this.inputIdx = 0;
  },

  play(dt) {
    const PITCH_WORDS = ['COMPS!', 'STAGING!', 'MARKETING!', 'PRICE!', 'DRONE!', 'TRUST!'];

    if (this.state === 'show') {
      this.showTimer -= dt;
      if (this.showTimer <= 0) {
        this.showIdx++;
        if (this.showIdx >= this.seq.length) {
          this.state = 'input';
          this.pop('YOUR TURN!', G.C.cyan);
        } else {
          this.showTimer = 0.55;
          G.Audio.tick();
        }
      }
      return;
    }

    if (this.state !== 'input') return;

    const dirs = { ArrowUp: G.Input.up(), ArrowDown: G.Input.down(), ArrowLeft: G.Input.left(), ArrowRight: G.Input.right() };
    for (const [key, hit] of Object.entries(dirs)) {
      if (!hit) continue;
      if (key === this.seq[this.inputIdx]) {
        G.Audio.move();
        this.pop(PITCH_WORDS[this.inputIdx % PITCH_WORDS.length], G.C.lime);
        this.inputIdx++;
        if (this.inputIdx >= this.seq.length) {
          this.done++;
          this.state = 'between';
          G.Audio.good();
          this.pop('NAILED IT!', G.C.lime);
          setTimeout(() => {
            this.round++;
            if (this.round >= 3) this.finish(this.done / 3);
            else this.newSeq();
          }, 700);
        }
      } else {
        G.Audio.bad();
        this.pop('"UM, THE ZILLOW SAYS..."', G.C.red);
        this.state = 'between';
        setTimeout(() => {
          this.round++;
          if (this.round >= 3) this.finish(this.done / 3);
          else this.newSeq();
        }, 700);
      }
      break;
    }
  },

  draw(ctx) {
    G.UI.text(ctx, 'ROUND ' + Math.min(this.round + 1, 3) + '/3   PITCHES LANDED: ' + this.done, G.W / 2, 34, { align: 'center', size: 9, color: G.C.white });
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], 80, 60, 3);
    G.drawSprite(ctx, G.Sprites.cabin, 340, 66, 3);

    const ARROWS = { ArrowUp: '^', ArrowDown: 'v', ArrowLeft: '<', ArrowRight: '>' };
    const n = this.seq.length;
    const startX = G.W / 2 - n * 16;
    for (let i = 0; i < n; i++) {
      const x = startX + i * 32;
      let show = false, litUp = false;
      if (this.state === 'show') {
        show = i <= this.showIdx;
        litUp = i === this.showIdx;
      } else {
        show = i < this.inputIdx;
        litUp = false;
      }
      ctx.fillStyle = litUp ? G.C.yellow : show ? G.C.blue : G.C.ink;
      ctx.fillRect(x, 150, 26, 26);
      ctx.strokeStyle = G.C.white;
      ctx.strokeRect(x + 0.5, 150.5, 25, 25);
      if (show || this.state === 'input') {
        const label = show ? ARROWS[this.seq[i]] : '?';
        G.UI.text(ctx, label, x + 13, 156, { align: 'center', size: 13, color: litUp ? G.C.ink : G.C.white });
      }
    }

    G.UI.text(ctx, this.state === 'show' ? 'MEMORIZE THE PITCH...' : 'REPEAT IT WITH ARROW KEYS!',
      G.W / 2, 196, { align: 'center', size: 9, color: this.state === 'show' ? G.C.orange : G.C.cyan });
  },

  bonus() { return G.State.has('drone') ? 0.05 : 0; },
  gradeLines() { return this.done + '/3 PITCH ROUNDS LANDED'; },
});

// ------------------------------------------------------------
// 4. SHOW HOMES - hit the feature keys as they light up
// ------------------------------------------------------------
G.makeMinigame('showGame', {
  title: 'THE GRAND TOUR',
  subtitle: 'HYPE THE FEATURES ON CUE',
  howto: [
    'You are touring buyers through the house. When a feature lights up, press its KEY before the excitement fades!',
    'Keys: A S D F. 6 features. Sell that granite.',
  ],
  bg: G.C.navy,

  duration: 18,

  init() {
    this.features = [
      { key: 'a', label: 'HOT TUB', x: 90, y: 170 },
      { key: 's', label: 'GARAGE', x: 190, y: 190 },
      { key: 'd', label: 'GRANITE', x: 290, y: 160 },
      { key: 'f', label: 'LAKE VIEW', x: 390, y: 150 },
      { key: 'a', label: 'FIREPLACE', x: 140, y: 120 },
      { key: 'd', label: 'DOCK', x: 340, y: 210 },
    ];
    this.queue = G.shuffle(this.features);
    this.idx = 0;
    this.active = null;
    this.activeT = 0;
    this.hits = 0;
    this.misses = 0;
    this.spawnT = 0.8;
  },

  play(dt) {
    if (!this.active) {
      this.spawnT -= dt;
      if (this.spawnT <= 0 && this.idx < this.queue.length) {
        this.active = this.queue[this.idx++];
        this.activeT = 1.6;
        G.Audio.tick();
      } else if (this.idx >= this.queue.length && !this.active) {
        this.finish(this.hits / this.queue.length);
      }
      return;
    }

    this.activeT -= dt;
    if (this.activeT <= 0) {
      this.misses++;
      this.pop('"...IS THAT WATER DAMAGE?"', G.C.red);
      G.Audio.bad();
      this.active = null;
      this.spawnT = 0.7;
      return;
    }

    for (const k of ['a', 's', 'd', 'f']) {
      if (G.Input.p(k)) {
        if (k === this.active.key) {
          this.hits++;
          this.pop(this.active.label + '! "WOW!"', G.C.lime);
          this.particles.spawn(this.active.x, this.active.y, { count: 10, colors: [G.C.yellow, G.C.cyan] });
          G.Audio.good();
        } else {
          this.misses++;
          this.pop('YOU HYPED THE WRONG ROOM', G.C.red);
          G.Audio.bad();
        }
        this.active = null;
        this.spawnT = 0.7;
        break;
      }
    }
  },

  timeUp() { return this.hits / this.queue.length; },

  draw(ctx) {
    // house cross-section
    ctx.fillStyle = '#6b4226';
    ctx.fillRect(60, 100, 360, 130);
    ctx.fillStyle = G.C.red;
    ctx.beginPath();
    ctx.moveTo(50, 100); ctx.lineTo(240, 60); ctx.lineTo(430, 100);
    ctx.fill();
    ctx.fillStyle = G.C.ink;
    for (let i = 0; i < 3; i++) ctx.fillRect(100 + i * 110, 115, 60, 100);

    G.UI.text(ctx, 'FEATURES HYPED: ' + this.hits, 8, 32, { size: 8, color: G.C.lime });

    for (const f of this.features) {
      const on = this.active === f;
      if (on) {
        const pulse = Math.abs(Math.sin(this.t * 8)) * 6;
        ctx.fillStyle = G.C.yellow;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 10 + pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = G.C.ink;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 9, 0, Math.PI * 2);
        ctx.fill();
        G.UI.text(ctx, f.key.toUpperCase(), f.x, f.y - 4, { align: 'center', size: 9, color: G.C.yellow });
        G.UI.text(ctx, f.label, f.x, f.y - 24, { align: 'center', size: 8, color: G.C.white, shadow: true });
        G.UI.bar(ctx, f.x - 15, f.y + 14, 30, 4, this.activeT / 1.6, G.C.orange);
      } else {
        ctx.fillStyle = 'rgba(244,244,244,0.25)';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  },

  bonus() { return G.State.has('photographer') ? 0.08 : 0; },
  gradeLines() { return this.hits + '/' + this.queue.length + ' FEATURES HYPED'; },
});

// ------------------------------------------------------------
// 5. NEGOTIATION BATTLE - talk/listen tug-of-war
// ------------------------------------------------------------
G.makeMinigame('negotiateGame', {
  title: 'DEAL DUEL',
  subtitle: 'TALK WHEN GREEN. LISTEN WHEN RED.',
  howto: [
    'Tug-of-war over the deal! During TALK phases, MASH SPACE to push the bar your way.',
    'During LISTEN phases, DO NOT press anything - interrupting costs you.',
    'Get the bar as far right as you can before time runs out.',
  ],
  bg: G.C.ink,
  duration: 15,

  init() {
    this.bar = 0.35;
    this.phase2 = 'talk'; // talk | listen
    this.phaseT = 2.5;
    this.mash = 0;
  },

  play(dt) {
    this.phaseT -= dt;
    if (this.phaseT <= 0) {
      this.phase2 = this.phase2 === 'talk' ? 'listen' : 'talk';
      this.phaseT = this.phase2 === 'talk' ? G.rand(2, 3) : G.rand(1.2, 2);
      G.Audio[this.phase2 === 'talk' ? 'good' : 'thud']();
    }

    // opponent pressure
    this.bar -= 0.045 * dt;

    if (G.Input.p(' ') || G.Input.p('Enter') || G.Input.mouse.clicked) {
      if (this.phase2 === 'talk') {
        this.bar += 0.035;
        G.Audio.tick();
      } else {
        this.bar -= 0.06;
        this.pop('"LET ME FINISH!" -THEM', G.C.red);
        G.Audio.bad();
      }
    }
    this.bar = G.clamp(this.bar, 0, 1);
    if (this.bar >= 1) this.finish(1);
  },

  timeUp() { return this.bar; },

  draw(ctx) {
    const talk = this.phase2 === 'talk';
    ctx.fillStyle = talk ? 'rgba(56,183,100,0.15)' : 'rgba(177,62,83,0.2)';
    ctx.fillRect(0, 24, G.W, G.H - 24);

    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], 90, 64, 3);
    G.drawSprite(ctx, G.Sprites.bossShark, 340, 64, 3);
    G.UI.text(ctx, 'YOU', 111, 122, { align: 'center', size: 8, color: G.C.lime });
    G.UI.text(ctx, 'OTHER AGENT', 361, 122, { align: 'center', size: 8, color: G.C.red });

    G.UI.text(ctx, talk ? '>>> TALK! MASH SPACE! <<<' : '*** LISTEN... DO NOT PRESS ***',
      G.W / 2, 44, { align: 'center', size: 12, color: talk ? G.C.lime : G.C.red, shadow: true });

    // tug bar
    const bx = 60, by = 160, bw = 360, bh = 20;
    ctx.fillStyle = G.C.dusk;
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = G.C.red;
    ctx.fillRect(bx, by, bw * 0.45, bh);
    ctx.fillStyle = G.C.green;
    ctx.fillRect(bx + bw * 0.45, by, bw * 0.55, bh);
    ctx.fillStyle = G.C.white;
    ctx.fillRect(bx + this.bar * bw - 2, by - 5, 5, bh + 10);
    G.UI.text(ctx, 'DEAL DIES', bx, by + 26, { size: 7, color: G.C.red });
    G.UI.text(ctx, 'DEAL SIGNED', bx + bw, by + 26, { align: 'right', size: 7, color: G.C.lime });
  },

  bonus() { return 0; }, // character bonus handled in state.js
  gradeLines() { return 'LEVERAGE: ' + Math.round(this.score * 100) + '%'; },
});

// ------------------------------------------------------------
// 6. INSPECTION - fix issues by typing their key combos
// ------------------------------------------------------------
G.makeMinigame('inspectGame', {
  title: 'FIX-IT FRENZY',
  subtitle: 'CLEAR THE INSPECTION REPORT',
  howto: [
    'The inspection report is BAD. Fix each issue by pressing its two keys in order.',
    'Clear as many of the 5 issues as you can before time runs out!',
  ],
  bg: G.C.dusk,
  duration: 16,

  init() {
    const ISSUES = ['LEAKY FAUCET', 'SQUIRRELS (RUDE)', 'ROOF FROM 1971', 'RADON???', 'MYSTERY SWITCH', 'SPOOKY FURNACE', 'DOOR TO NOWHERE'];
    const KEYS = 'qwerasdfzxcv'.split('');
    this.issues = G.shuffle(ISSUES).slice(0, 5).map((label, i) => ({
      label,
      combo: [G.choice(KEYS), G.choice(KEYS)],
      progress: 0,
      fixed: false,
    }));
    this.current = 0;
  },

  play(dt) {
    const cur = this.issues[this.current];
    if (!cur) return;

    for (const k of 'qwerasdfzxcv'.split('')) {
      if (!G.Input.p(k)) continue;
      if (k === cur.combo[cur.progress]) {
        cur.progress++;
        G.Audio.tick();
        if (cur.progress >= 2) {
          cur.fixed = true;
          this.pop(cur.label + ' - FIXED!', G.C.lime);
          this.particles.spawn(G.W / 2, 130, { count: 10, colors: [G.C.lime, G.C.white] });
          G.Audio.good();
          this.current++;
          if (this.current >= this.issues.length) this.finish(1);
        }
      } else {
        cur.progress = 0;
        this.pop('WRONG TOOL!', G.C.red);
        G.Audio.bad();
      }
      break;
    }
  },

  timeUp() { return this.issues.filter(i => i.fixed).length / this.issues.length; },

  draw(ctx) {
    G.drawSprite(ctx, G.Sprites.houseStarter, 30, 50, 3);
    let y = 44;
    for (let i = 0; i < this.issues.length; i++) {
      const iss = this.issues[i];
      const active = i === this.current;
      ctx.fillStyle = iss.fixed ? 'rgba(56,183,100,0.25)' : active ? G.C.navy : G.C.ink;
      ctx.fillRect(150, y, 300, 30);
      ctx.strokeStyle = active ? G.C.yellow : G.C.slate;
      ctx.strokeRect(150.5, y + 0.5, 299, 29);
      G.UI.text(ctx, (iss.fixed ? '[OK] ' : '[!!] ') + iss.label, 158, y + 5, {
        size: 8, color: iss.fixed ? G.C.lime : active ? G.C.white : G.C.slate,
      });
      if (!iss.fixed && active) {
        for (let c = 0; c < 2; c++) {
          const done = c < iss.progress;
          ctx.fillStyle = done ? G.C.lime : G.C.dusk;
          ctx.fillRect(360 + c * 24, y + 5, 20, 20);
          ctx.strokeStyle = G.C.white;
          ctx.strokeRect(360.5 + c * 24, y + 5.5, 19, 19);
          G.UI.text(ctx, iss.combo[c].toUpperCase(), 370 + c * 24, y + 10, { align: 'center', size: 10, color: done ? G.C.ink : G.C.yellow });
        }
      }
      y += 36;
    }
  },

  bonus() { return G.State.has('tc') ? 0.05 : 0; },
  gradeLines() { return this.issues.filter(i => i.fixed).length + '/5 ISSUES FIXED'; },
});

// ------------------------------------------------------------
// 7. MAKE VIDEO - rhythm game, hit notes at the line
// ------------------------------------------------------------
G.makeMinigame('videoGame', {
  title: 'LIGHTS, CAMERA, LISTING!',
  subtitle: 'HIT THE BEATS - LEFT / DOWN / RIGHT',
  howto: [
    'Film the perfect listing video! Notes fall down 3 lanes.',
    'Press LEFT / DOWN / RIGHT when a note reaches the glowing line.',
    'Great timing = great content = leads.',
  ],
  bg: G.C.purple,
  duration: 16,

  init() {
    this.lanes = ['ArrowLeft', 'ArrowDown', 'ArrowRight'];
    this.notes = [];
    let t = 1.2;
    for (let i = 0; i < 14; i++) {
      this.notes.push({ lane: G.randInt(0, 2), t, hit: false, missed: false });
      t += G.rand(0.55, 1.0);
    }
    this.hits = 0;
    this.combo = 0;
    this.FALL = 3.0;   // seconds from top to line
    this.LINE_Y = 200;
  },

  play(dt) {
    const inputs = [G.Input.left(), G.Input.down(), G.Input.right()];
    for (let lane = 0; lane < 3; lane++) {
      if (!inputs[lane]) continue;
      // find nearest unhit note in this lane near the line
      let best = null, bestD = 1;
      for (const n of this.notes) {
        if (n.lane !== lane || n.hit || n.missed) continue;
        const d = Math.abs(n.t - this.playT);
        if (d < bestD) { bestD = d; best = n; }
      }
      if (best && bestD <= 0.18) {
        best.hit = true;
        this.hits++;
        this.combo++;
        this.pop(bestD < 0.07 ? 'PERFECT! x' + this.combo : 'NICE! x' + this.combo, bestD < 0.07 ? G.C.cyan : G.C.lime);
        this.particles.spawn(140 + lane * 100, this.LINE_Y, { count: 8, colors: [G.C.cyan, G.C.yellow] });
        G.Audio.good();
      } else {
        this.combo = 0;
        this.pop('OFF BEAT!', G.C.red);
        G.Audio.bad();
      }
    }
    // mark misses
    for (const n of this.notes) {
      if (!n.hit && !n.missed && this.playT - n.t > 0.2) {
        n.missed = true;
        this.combo = 0;
      }
    }
    if (this.notes.every(n => n.hit || n.missed)) {
      this.finish(this.hits / this.notes.length);
    }
  },

  timeUp() { return this.hits / this.notes.length; },

  draw(ctx) {
    const laneX = [140, 240, 340];
    const LABELS = ['<', 'v', '>'];
    // lanes
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = 'rgba(26,28,44,0.6)';
      ctx.fillRect(laneX[i] - 18, 24, 36, G.H - 24);
    }
    // hit line
    const pulse = Math.abs(Math.sin(this.t * 4));
    ctx.fillStyle = 'rgba(115,239,247,' + (0.5 + pulse * 0.5) + ')';
    ctx.fillRect(110, this.LINE_Y, 260, 3);
    for (let i = 0; i < 3; i++) {
      G.UI.text(ctx, LABELS[i], laneX[i], this.LINE_Y + 10, { align: 'center', size: 12, color: G.C.cyan });
    }
    // notes
    for (const n of this.notes) {
      if (n.hit) continue;
      const yProg = 1 - (n.t - this.playT) / this.FALL;
      if (yProg < 0 || yProg > 1.15) continue;
      const y = 24 + yProg * (this.LINE_Y - 24);
      ctx.fillStyle = n.missed ? G.C.slate : [G.C.orange, G.C.lime, G.C.sky][n.lane];
      ctx.fillRect(laneX[n.lane] - 10, y - 5, 20, 10);
      ctx.strokeStyle = G.C.white;
      ctx.strokeRect(laneX[n.lane] - 10.5, y - 5.5, 21, 11);
    }
    // camera guy
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], 40, 100, 3);
    G.UI.text(ctx, 'HITS ' + this.hits + '/' + this.notes.length, G.W - 12, 32, { align: 'right', size: 9, color: G.C.white });
    if (this.combo >= 3) {
      G.UI.text(ctx, 'COMBO x' + this.combo + '!', G.W - 12, 46, { align: 'right', size: 9, color: G.C.yellow });
    }
  },

  bonus() {
    let b = G.State.char().videoBonus || 0;
    if (G.State.has('camera')) b += 0.15;
    return b;
  },
  gradeLines() { return this.hits + '/' + this.notes.length + ' BEATS HIT'; },
});

// ------------------------------------------------------------
// 8. OPEN HOUSE - catch guests, dodge tire kickers
// ------------------------------------------------------------
G.makeMinigame('openHouseGame', {
  title: 'OPEN HOUSE RUSH',
  subtitle: 'CATCH LEADS - DODGE TIRE KICKERS',
  howto: [
    'Guests are flooding in! Move your SIGN-IN SHEET with LEFT/RIGHT to catch falling guests.',
    'YELLOW STARS are hot leads (+2). WHITE guests are leads (+1).',
    'RED tire kickers just want free cookies (-1). Avoid!',
  ],
  bg: G.C.teal,
  duration: 20,

  init() {
    this.px = G.W / 2;
    this.items = [];
    this.spawnT = 0;
    this.points = 0;
    this.MAX = 14;
  },

  play(dt) {
    // move
    const sp = 220 * dt;
    if (G.Input.held('ArrowLeft') || G.Input.held('a')) this.px -= sp;
    if (G.Input.held('ArrowRight') || G.Input.held('d')) this.px += sp;
    if (G.Input.mouse.x > 0) {
      // gentle mouse-follow if the mouse is being used
      if (Math.abs(G.Input.mouse.x - this.px) > 8 && G.Input.mouse.down) {
        this.px += Math.sign(G.Input.mouse.x - this.px) * sp;
      }
    }
    this.px = G.clamp(this.px, 40, G.W - 40);

    // spawn
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = G.rand(0.45, 0.85);
      const roll = Math.random();
      this.items.push({
        x: G.rand(50, G.W - 50),
        y: 20,
        v: G.rand(60, 110) + this.playT * 3,
        kind: roll < 0.15 ? 'star' : roll < 0.62 ? 'guest' : 'kicker',
      });
    }

    // fall + catch
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.y += it.v * dt;
      if (it.y > 228 && it.y < 248 && Math.abs(it.x - this.px) < 30) {
        if (it.kind === 'star') { this.points += 2; this.pop('HOT LEAD! +2', G.C.yellow); G.Audio.great(); }
        else if (it.kind === 'guest') { this.points += 1; this.pop('SIGNED IN! +1', G.C.lime); G.Audio.good(); }
        else { this.points = Math.max(0, this.points - 1); this.pop('"JUST LOOKING" -1', G.C.red); G.Audio.bad(); }
        this.items.splice(i, 1);
      } else if (it.y > G.H) {
        this.items.splice(i, 1);
      }
    }
  },

  timeUp() { return this.points / this.MAX; },

  draw(ctx) {
    // house backdrop
    ctx.fillStyle = 'rgba(26,28,44,0.3)';
    ctx.fillRect(0, 24, G.W, G.H - 24);
    G.drawSprite(ctx, G.Sprites.houseStarter, G.W / 2 - 21, 26, 3);
    G.UI.text(ctx, 'SIGN-INS: ' + this.points, 8, 32, { size: 9, color: G.C.lime });

    for (const it of this.items) {
      if (it.kind === 'star') {
        G.drawSprite(ctx, G.Sprites.star, it.x - 5, it.y - 5, 2);
      } else {
        ctx.fillStyle = it.kind === 'guest' ? G.C.white : G.C.red;
        ctx.fillRect(it.x - 3, it.y - 8, 6, 6);      // head
        ctx.fillRect(it.x - 4, it.y - 1, 8, 8);      // body
      }
    }

    // player + clipboard
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], this.px - 14, 224, 2);
    ctx.fillStyle = G.C.yellow;
    ctx.fillRect(this.px - 30, 236, 60, 5);
    G.UI.text(ctx, 'SIGN-IN', this.px, 243, { align: 'center', size: 6, color: G.C.ink });
  },

  bonus() { return G.State.char().openHouseBonus || 0; },
  gradeLines() { return this.points + ' SIGN-INS COLLECTED'; },
});

</script>
<script>
// ============================================================
// scenes/boss.js - month-end boss showdown vs a top local agent
// Best-of-N skill clashes: stop the needle in the green zone.
// Your stats & upgrades widen the zone; boss gimmicks fight back.
// ============================================================
'use strict';

G.Engine.register('boss', {
  enter() {
    this.t = 0;
    this.boss = G.State.currentBoss();
    this.phase = 'intro';
    this.round = 0;
    this.playerWins = 0;
    this.bossWins = 0;
    this.flash = null;
    this.particles = new G.Particles();
    this.needle = 0;
    this.dir = 1;
    this.locked = false;
    G.Audio.stopMusic();
    G.Audio.thud();
  },

  exit() { G.Audio.startMusic(); },

  // How much a skill widens your green zone (0..~0.14)
  skillBonus(skill) {
    const s = G.State.s;
    const has = (u) => G.State.has(u);
    let b = 0;
    switch (skill) {
      case 'PROSPECTING':
        if (has('crm')) b += 0.05;
        if (has('website') || has('seo')) b += 0.03;
        b += Math.min(0.05, s.stats.leadsReceived / 400);
        break;
      case 'MARKETING':
        if (has('camera')) b += 0.03;
        if (has('social') || has('tiktok')) b += 0.04;
        if (has('marketing') || has('marketingdir')) b += 0.04;
        b += Math.min(0.04, s.stats.followers / 30000);
        break;
      case 'NEGOTIATION':
        b += (G.State.char().negotiateBonus || 0) * 0.4;
        b += Math.min(0.04, s.stats.homesSold / 250);
        break;
      case 'CLIENT SERVICE':
        b += s.stats.happiness / 1200;
        b += Math.min(0.03, s.stats.reviews / 300);
        b += s.stats.reputation / 2000;
        break;
      case 'SPEED':
        if (has('vehicle') || has('luxsuv')) b += 0.04;
        if (has('ai')) b += 0.04;
        if (has('assistant')) b += 0.03;
        break;
      case 'STRATEGY':
        b += Object.keys(s.upgrades).length * 0.008;
        break;
    }
    return Math.min(0.14, b);
  },

  startRound() {
    const skill = this.boss.skills[this.round % this.boss.skills.length];
    const gim = this.boss.gimmick || {};
    this.skill = skill;
    let width = Math.max(0.09, 0.30 - this.boss.difficulty * 0.22 + this.skillBonus(skill));
    if (gim.zone) width *= gim.zone;
    width = Math.max(0.07, width);
    this.zone = { start: G.rand(0.15, 0.85 - width), width };
    this.speed = (1.4 + this.boss.difficulty * 1.4 + this.round * 0.22) * (gim.speed || 1);
    this.needle = 0;
    this.dir = 1;
    this.locked = false;
    this.phase = 'round';
    G.Audio.ring();
  },

  update(dt) {
    this.t += dt;
    this.particles.update(dt);
    if (this.flash) { this.flash.t -= dt; if (this.flash.t <= 0) this.flash = null; }

    if (this.phase === 'intro') {
      if (this.t > 0.5 && (G.Input.confirm() || G.Input.mouse.clicked)) {
        G.Audio.select();
        this.startRound();
      }
      return;
    }

    if (this.phase === 'round') {
      if (this.locked) return;
      this.needle += this.dir * this.speed * dt;
      if (this.needle > 1) { this.needle = 1; this.dir = -1; }
      if (this.needle < 0) { this.needle = 0; this.dir = 1; }

      if (G.Input.confirm() || G.Input.mouse.clicked) {
        this.locked = true;
        const hit = this.needle >= this.zone.start && this.needle <= this.zone.start + this.zone.width;
        if (hit) {
          this.playerWins++;
          this.flash = { text: this.skill + ' - YOU WIN THE ROUND!', color: G.C.lime, t: 1.1 };
          this.particles.spawn(G.W / 2, 130, { count: 20, colors: [G.C.lime, G.C.yellow, G.C.cyan] });
          G.Audio.great();
        } else {
          this.bossWins++;
          this.flash = { text: this.boss.name.split(' ').slice(0, 2).join(' ') + ' TAKES ' + this.skill + '!', color: G.C.red, t: 1.1 };
          G.Engine.shake = 3;
          G.Audio.thud();
          const gim = this.boss.gimmick || {};
          if (gim.loseCash) {
            G.State.s.cash = Math.max(0, G.State.s.cash - gim.loseCash);
            this.flash.text += ' (-' + G.money(gim.loseCash) + ')';
          }
        }
        setTimeout(() => {
          this.round++;
          const need = Math.floor(this.boss.rounds / 2) + 1;
          if (this.playerWins >= need || this.bossWins >= need || this.round >= this.boss.rounds) {
            this.phase = 'result';
            this.t = 0;
            if (this.playerWins > this.bossWins) G.Audio.fanfare(); else G.Audio.sadTromb();
          } else {
            this.startRound();
          }
        }, 1000);
      }
      return;
    }

    if (this.phase === 'result') {
      if (this.t > 0.8 && (G.Input.confirm() || G.Input.mouse.clicked)) {
        const won = this.playerWins > this.bossWins;
        const res = G.State.resolveBoss(won);
        G.Popup.show({
          title: won ? 'SHOWDOWN WON!' : 'SHOWDOWN LOST',
          lines: res.lines,
          color: won ? G.C.green : G.C.red,
          onClose: () => {
            if (res.seasonOver) G.Engine.goto('seasonEnd');
            else G.Engine.goto('map', { newDay: true });
          },
        });
      }
    }
  },

  render(ctx) {
    const b = this.boss;
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(0, 0, G.W, G.H);
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2 + this.t * 0.4;
      ctx.strokeStyle = 'rgba(93,39,93,0.5)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(G.W / 2, 100);
      ctx.lineTo(G.W / 2 + Math.cos(a) * 400, 100 + Math.sin(a) * 400);
      ctx.stroke();
    }
    ctx.lineWidth = 1;

    if (this.phase === 'intro') {
      G.UI.text(ctx, b.final ? 'FINAL BOSS' : 'MONTH-END SHOWDOWN', G.W / 2, 16, { align: 'center', size: 12, color: G.C.red, shadow: true });
      const shake = b.final ? Math.sin(this.t * 30) * 1.5 : 0;
      G.drawSprite(ctx, G.Sprites[b.sprite], G.W / 2 - 28 + shake, 36, 4);
      G.UI.text(ctx, b.name, G.W / 2, 106, { align: 'center', size: 13, color: G.C.yellow, shadow: true });
      let y = 126;
      for (const line of b.intro) {
        G.UI.text(ctx, line, G.W / 2, y, { align: 'center', size: 8, color: G.C.gray });
        y += 10;
      }
      G.UI.text(ctx, '"' + b.taunt + '"', G.W / 2, y + 5, { align: 'center', size: 8, color: G.C.orange });
      G.UI.text(ctx, 'BEST OF ' + b.rounds + ' SKILL CLASHES. STOP THE NEEDLE IN THE GREEN.', G.W / 2, y + 22, { align: 'center', size: 7, color: G.C.cyan });
      if (Math.floor(this.t * 2) % 2 === 0) {
        G.UI.text(ctx, '- PRESS ENTER TO THROW DOWN -', G.W / 2, y + 38, { align: 'center', size: 9, color: G.C.yellow });
      }
      return;
    }

    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], 80, 60, 4);
    G.drawSprite(ctx, G.Sprites[b.sprite], 336, 60, 4);
    G.UI.text(ctx, G.State.char().name, 108, 132, { align: 'center', size: 9, color: G.C.lime });
    G.UI.text(ctx, b.name.split(' ').slice(0, 2).join(' '), 364, 132, { align: 'center', size: 8, color: G.C.red });

    for (let i = 0; i < b.rounds; i++) {
      const x = G.W / 2 - b.rounds * 7 + i * 14;
      let col = G.C.dusk;
      if (i < this.playerWins) col = G.C.lime;
      else if (i >= b.rounds - this.bossWins) col = G.C.red;
      ctx.fillStyle = col;
      ctx.fillRect(x, 26, 10, 10);
      ctx.strokeStyle = G.C.white;
      ctx.strokeRect(x + 0.5, 26.5, 9, 9);
    }

    if (this.phase === 'round') {
      G.UI.text(ctx, 'ROUND ' + (this.round + 1) + ': ' + this.skill, G.W / 2, 46, { align: 'center', size: 12, color: G.C.cyan, shadow: true });

      const mx = 90, my = 170, mw = 300, mh = 20;
      ctx.fillStyle = G.C.ink;
      ctx.fillRect(mx - 3, my - 3, mw + 6, mh + 6);
      ctx.fillStyle = G.C.red;
      ctx.fillRect(mx, my, mw, mh);
      ctx.fillStyle = G.C.green;
      ctx.fillRect(mx + this.zone.start * mw, my, this.zone.width * mw, mh);
      ctx.fillStyle = G.C.white;
      ctx.fillRect(mx + this.needle * mw - 1, my - 6, 3, mh + 12);

      G.UI.text(ctx, 'SPACE / ENTER / CLICK TO STRIKE', G.W / 2, my + 30, { align: 'center', size: 8, color: G.C.gray });
      G.UI.text(ctx, 'YOUR ' + this.skill + ' SKILL WIDENS THE GREEN ZONE', G.W / 2, my + 44, { align: 'center', size: 6, color: G.C.slate });
    }

    if (this.phase === 'result') {
      const won = this.playerWins > this.bossWins;
      G.UI.text(ctx, won ? 'VICTORY!' : 'DEFEAT...', G.W / 2, 150, { align: 'center', size: 26, color: won ? G.C.lime : G.C.red, shadow: true });
      G.UI.text(ctx, 'ROUNDS: YOU ' + this.playerWins + ' - ' + this.bossWins + ' THEM', G.W / 2, 186, { align: 'center', size: 10, color: G.C.white });
      if (won) G.drawSprite(ctx, G.Sprites.trophy, G.W / 2 - 7, 202, 2);
      if (this.t > 0.8 && Math.floor(this.t * 2) % 2 === 0) {
        G.UI.text(ctx, '- PRESS ENTER -', G.W / 2, 230, { align: 'center', size: 8, color: G.C.yellow });
      }
    }

    this.particles.render(ctx);
    if (this.flash) {
      G.UI.text(ctx, this.flash.text, G.W / 2, 106, { align: 'center', size: 11, color: this.flash.color, shadow: true });
    }
  },
});

</script>
<script>
// ============================================================
// scenes/battle.js - HEAD-TO-HEAD LISTING BATTLE
// Both agents pitch the same seller. Four rounds:
// dialogue, market knowledge, presentation, negotiation.
// ============================================================
'use strict';

G.Engine.register('battle', {
  enter() {
    this.t = 0;
    this.phase = 'intro';     // intro | choice | simon | needle | result
    this.round = 0;           // 0 dialogue, 1 market, 2 presentation, 3 negotiation
    this.wins = 0;
    this.losses = 0;
    this.flash = null;
    this.particles = new G.Particles();
    this.rival = G.State.rivalChar();
    G.Audio.stopMusic();
    G.Audio.ring();
  },

  exit() { G.Audio.startMusic(); },

  ROUND_NAMES: ['DIALOGUE', 'MARKET KNOWLEDGE', 'PRESENTATION', 'NEGOTIATION'],

  startRound() {
    this.t = 0;
    if (this.round === 0 || this.round === 1) {
      const pool = this.round === 0 ? G.Data.BATTLE.dialogue : G.Data.BATTLE.market;
      const q = G.choice(pool);
      this.q = q;
      this.opts = G.shuffle([{ t: q.good, ok: true }, { t: q.bad[0], ok: false }, { t: q.bad[1], ok: false }]);
      this.sel = 0;
      this.timer = 7;
      this.phase = 'choice';
    } else if (this.round === 2) {
      const dirs = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
      this.seq = Array.from({ length: 4 }, () => G.choice(dirs));
      this.showIdx = -1;
      this.showTimer = 0.4;
      this.inputIdx = 0;
      this.simonState = 'show';
      this.phase = 'simon';
    } else {
      const bonus = (G.State.char().negotiateBonus || 0) * 0.3 + G.State.s.stats.reputation / 1500;
      const width = G.clamp(0.16 + bonus, 0.1, 0.3);
      this.zone = { start: G.rand(0.2, 0.8 - width), width };
      this.needle = 0; this.dir = 1; this.speed = 2.1; this.locked = false;
      this.phase = 'needle';
    }
  },

  roundOver(won) {
    if (won) { this.wins++; this.flash = { text: 'ROUND WON!', color: G.C.lime, t: 1 }; G.Audio.good(); }
    else { this.losses++; this.flash = { text: this.rival.name + ' TAKES IT!', color: G.C.red, t: 1 }; G.Audio.bad(); }
    this.phase = 'between';
    setTimeout(() => {
      this.round++;
      if (this.round >= 4) {
        this.phase = 'result';
        this.t = 0;
        this.won = this.wins > this.losses || (this.wins === this.losses && G.State.s.stats.reputation >= 50);
        if (this.won) G.Audio.fanfare(); else G.Audio.sadTromb();
      } else {
        this.startRound();
      }
    }, 1000);
  },

  update(dt) {
    this.t += dt;
    this.particles.update(dt);
    if (this.flash) { this.flash.t -= dt; if (this.flash.t <= 0) this.flash = null; }

    if (this.phase === 'intro') {
      if (this.t > 0.5 && (G.Input.confirm() || G.Input.mouse.clicked)) {
        G.Audio.select();
        this.startRound();
      }
      return;
    }

    if (this.phase === 'choice') {
      this.timer -= dt;
      if (this.timer <= 0) { this.roundOver(false); return; }
      if (G.Input.up())   { this.sel = (this.sel + 2) % 3; G.Audio.move(); }
      if (G.Input.down()) { this.sel = (this.sel + 1) % 3; G.Audio.move(); }
      let picked = -1;
      if (G.Input.confirm()) picked = this.sel;
      for (let i = 0; i < 3; i++) {
        if (G.Input.clickedRect(60, 130 + i * 30, 360, 26)) picked = i;
      }
      if (picked >= 0) { this.sel = picked; this.roundOver(this.opts[picked].ok); }
      return;
    }

    if (this.phase === 'simon') {
      if (this.simonState === 'show') {
        this.showTimer -= dt;
        if (this.showTimer <= 0) {
          this.showIdx++;
          if (this.showIdx >= this.seq.length) this.simonState = 'input';
          else { this.showTimer = 0.55; G.Audio.tick(); }
        }
        return;
      }
      const dirs = { ArrowUp: G.Input.up(), ArrowDown: G.Input.down(), ArrowLeft: G.Input.left(), ArrowRight: G.Input.right() };
      for (const [key, hit] of Object.entries(dirs)) {
        if (!hit) continue;
        if (key === this.seq[this.inputIdx]) {
          G.Audio.move();
          this.inputIdx++;
          if (this.inputIdx >= this.seq.length) this.roundOver(true);
        } else {
          this.roundOver(false);
        }
        break;
      }
      return;
    }

    if (this.phase === 'needle') {
      if (this.locked) return;
      this.needle += this.dir * this.speed * dt;
      if (this.needle > 1) { this.needle = 1; this.dir = -1; }
      if (this.needle < 0) { this.needle = 0; this.dir = 1; }
      if (G.Input.confirm() || G.Input.mouse.clicked) {
        this.locked = true;
        const hit = this.needle >= this.zone.start && this.needle <= this.zone.start + this.zone.width;
        this.roundOver(hit);
      }
      return;
    }

    if (this.phase === 'result') {
      if (this.t > 0.8 && (G.Input.confirm() || G.Input.mouse.clicked)) {
        const res = G.State.resolveBattle(this.won);
        G.Popup.show({
          title: this.won ? 'LISTING BATTLE WON!' : 'LISTING BATTLE LOST',
          lines: res.lines,
          color: this.won ? G.C.green : G.C.red,
          onClose: () => G.Engine.goto('map', { newDay: false }),
        });
      }
    }
  },

  render(ctx) {
    ctx.fillStyle = G.C.navy;
    ctx.fillRect(0, 0, G.W, G.H);
    // spotlight cone
    ctx.fillStyle = 'rgba(255,205,117,0.06)';
    ctx.beginPath();
    ctx.moveTo(G.W / 2, 0);
    ctx.lineTo(G.W / 2 - 140, G.H);
    ctx.lineTo(G.W / 2 + 140, G.H);
    ctx.fill();

    // header
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(0, 0, G.W, 24);
    G.UI.text(ctx, 'HEAD-TO-HEAD LISTING BATTLE', 8, 5, { size: 11, color: G.C.red });
    G.UI.text(ctx, 'ROUNDS: YOU ' + this.wins + ' - ' + this.losses + ' RIVAL', G.W - 8, 8, { align: 'right', size: 7, color: G.C.gray });

    // both agents + the seller
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], 50, 46, 3);
    G.drawSprite(ctx, G.Sprites[this.rival.sprite], 380, 46, 3, true);
    G.drawSprite(ctx, G.Sprites.cabin, G.W / 2 - 21, 40, 3);
    G.UI.text(ctx, 'YOU', 71, 100, { align: 'center', size: 8, color: G.C.lime });
    G.UI.text(ctx, this.rival.name, 401, 100, { align: 'center', size: 8, color: G.C.red });
    G.UI.text(ctx, 'THE SELLERS', G.W / 2, 70, { align: 'center', size: 7, color: G.C.yellow });

    if (this.phase === 'intro') {
      G.UI.text(ctx, 'BOTH OF YOU WANT THIS LISTING.', G.W / 2, 120, { align: 'center', size: 10, color: G.C.white, shadow: true });
      G.UI.text(ctx, this.rival.name + ' pulled into the driveway RIGHT behind you.', G.W / 2, 138, { align: 'center', size: 8, color: G.C.gray });
      G.UI.text(ctx, 'Win at dialogue, market knowledge, presentation & negotiation.', G.W / 2, 152, { align: 'center', size: 8, color: G.C.cyan });
      G.UI.text(ctx, 'Best of 4. Ties go to the agent with more REPUTATION.', G.W / 2, 164, { align: 'center', size: 7, color: G.C.slate });
      if (Math.floor(this.t * 2) % 2 === 0) {
        G.UI.text(ctx, '- PRESS ENTER TO PITCH -', G.W / 2, 190, { align: 'center', size: 9, color: G.C.yellow });
      }
      return;
    }

    if (this.phase !== 'result') {
      G.UI.text(ctx, 'ROUND ' + (this.round + 1) + ': ' + this.ROUND_NAMES[Math.min(this.round, 3)], G.W / 2, 108, { align: 'center', size: 10, color: G.C.cyan, shadow: true });
    }

    if (this.phase === 'choice') {
      G.UI.text(ctx, this.q.prompt, G.W / 2, 122, { align: 'center', size: 8, color: G.C.white });
      G.UI.bar(ctx, 140, 118, 200, 4, this.timer / 7, this.timer < 2 ? G.C.red : G.C.orange);
      for (let i = 0; i < 3; i++) {
        const y = 130 + i * 30;
        const sel = this.sel === i;
        ctx.fillStyle = sel ? G.C.blue : G.C.ink;
        ctx.fillRect(60, y, 360, 26);
        ctx.strokeStyle = sel ? G.C.yellow : G.C.slate;
        ctx.strokeRect(60.5, y + 0.5, 359, 25);
        G.UI.text(ctx, (sel ? '> ' : '  ') + this.opts[i].t, 68, y + 9, { size: 8, color: sel ? G.C.white : G.C.gray });
      }
      G.UI.text(ctx, 'UP/DOWN + ENTER (OR CLICK)', G.W / 2, 226, { align: 'center', size: 7, color: G.C.slate });
    }

    if (this.phase === 'simon') {
      const ARROWS = { ArrowUp: '^', ArrowDown: 'v', ArrowLeft: '<', ArrowRight: '>' };
      const n = this.seq.length;
      const startX = G.W / 2 - n * 16;
      G.UI.text(ctx, this.simonState === 'show' ? 'WATCH THE WINNING PRESENTATION FLOW...' : 'REPEAT IT WITH ARROW KEYS!',
        G.W / 2, 128, { align: 'center', size: 9, color: this.simonState === 'show' ? G.C.orange : G.C.cyan });
      for (let i = 0; i < n; i++) {
        const x = startX + i * 32;
        let show = false, litUp = false;
        if (this.simonState === 'show') { show = i <= this.showIdx; litUp = i === this.showIdx; }
        else { show = i < this.inputIdx; }
        ctx.fillStyle = litUp ? G.C.yellow : show ? G.C.blue : G.C.ink;
        ctx.fillRect(x, 148, 26, 26);
        ctx.strokeStyle = G.C.white;
        ctx.strokeRect(x + 0.5, 148.5, 25, 25);
        if (show) G.UI.text(ctx, ARROWS[this.seq[i]], x + 13, 154, { align: 'center', size: 13, color: litUp ? G.C.ink : G.C.white });
        else if (this.simonState === 'input') G.UI.text(ctx, '?', x + 13, 154, { align: 'center', size: 13, color: G.C.slate });
      }
    }

    if (this.phase === 'needle') {
      G.UI.text(ctx, 'CLOSE THE SELLER. STOP IN THE GREEN.', G.W / 2, 128, { align: 'center', size: 9, color: G.C.white });
      const mx = 90, my = 160, mw = 300, mh = 18;
      ctx.fillStyle = G.C.ink;
      ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
      ctx.fillStyle = G.C.red;
      ctx.fillRect(mx, my, mw, mh);
