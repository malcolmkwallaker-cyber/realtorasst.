<script>
// ============================================================
// scenes/map.js - the day hub: Northern MN map + action menu
// ============================================================
'use strict';

G.Engine.register('map', {
  MAP_X: 150,

  enter(params = {}) {
    this.t = 0;
    this.mode = 'menu';           // menu | drive | stats | pipeline
    this.pipeScroll = 0;
    this.particles = new G.Particles();
    this.banner = null;
    this.deer = { x: G.rand(200, 440), y: G.rand(60, 230), vx: 6, show: G.chance(0.5) };

    const s = G.State.s;
    if (!s) { G.Engine.goto('title'); return; }

    const loc = G.Data.MAP.locations.office;
    if (this.carX === undefined) { this.carX = loc.x; this.carY = loc.y; }
    this.carTarget = null;
    this.pendingAction = null;

    this.buildMenu();
    G.Audio.startMusic();

    if (params.newDay) {
      const d = Math.min(s.dayOfMonth, G.Data.SEASON.daysPerMonth);
      this.banner = { text: G.State.monthName() + ' - DAY ' + d + ' OF ' + G.Data.SEASON.daysPerMonth, t: 2.2 };
    }

    // returning from a minigame with a result
    if (params.result) {
      const { actionId, score } = params.result;
      this.resolveAction(actionId, score);
    }
  },

  buildMenu() {
    const items = [];
    for (const a of G.Data.ACTIONS) {
      const avail = G.State.actionAvailable(a.id);
      items.push({
        label: a.label,
        id: a.id,
        kind: 'action',
        disabled: !avail.ok,
        note: avail.ok ? '-' + G.State.actionCost(a.id) + 'E' : avail.reason,
        desc: a.desc,
      });
    }
    const ab = G.State.char().ability;
    items.push({
      label: '* ' + ab.name, id: 'ability', kind: 'ability',
      disabled: G.State.s.abilityUsed,
      note: G.State.s.abilityUsed ? 'USED' : 'FREE',
      desc: ab.desc,
    });
    items.push({ label: 'SHOP', id: 'shop', kind: 'nav', note: G.money(G.State.s.cash), desc: 'Spend commission on business upgrades.' });
    items.push({ label: 'STATS', id: 'stats', kind: 'nav', desc: 'Your full season stat sheet.' });
    items.push({ label: 'PIPELINE', id: 'pipeline', kind: 'nav', desc: 'Every lead and where they stand.' });
    items.push({ label: 'END DAY', id: 'endday', kind: 'nav', note: 'Zz', desc: 'Call it a day. Leads age, rival moves, stuff happens.' });

    const keepIndex = this.menu ? this.menu.index : 0;
    this.menu = new G.Menu(items, {
      x: 4, y: 44, w: 142, rowH: 12,
      onSelect: (it) => this.onMenuPick(it),
    });
    this.menu.index = Math.min(keepIndex, items.length - 1);
    this.menu.skipDisabled(1);
  },

  onMenuPick(it) {
    const s = G.State.s;
    if (it.kind === 'action') {
      const a = G.Data.ACTIONS.find(x => x.id === it.id);
      const loc = G.Data.MAP.locations[a.loc];
      this.pendingAction = a;
      this.carTarget = { x: loc.x, y: loc.y + 12 };
      this.mode = 'drive';
      G.Audio.swoosh();
    } else if (it.id === 'ability') {
      const res = G.State.useAbility();
      if (res) {
        this.particles.spawn(74, 140, { count: 20, colors: [G.C.yellow, G.C.cyan, G.C.lime] });
        G.Popup.show({
          title: G.State.char().ability.name, lines: res.lines,
          color: G.C.purple, onClose: () => this.buildMenu(),
        });
      }
    } else if (it.id === 'shop') {
      G.Engine.goto('shop');
    } else if (it.id === 'stats') {
      this.mode = 'stats';
    } else if (it.id === 'pipeline') {
      this.mode = 'pipeline'; this.pipeScroll = 0;
    } else if (it.id === 'endday') {
      this.endDay();
    }
  },

  // ----------------------------------------------------------
  resolveAction(actionId, score) {
    const res = G.State.performAction(actionId, score);
    const a = G.Data.ACTIONS.find(x => x.id === actionId);
    if (res.sold > 0) {
      G.Audio.cash();
      G.Engine.shake = 4;
      this.particles.spawn(G.W / 2, G.H / 2, { count: 40, colors: [G.C.yellow, G.C.green, G.C.lime, G.C.white], life: 1.4 });
    }
    G.Popup.show({
      title: a.label + ' - RESULTS',
      lines: res.lines,
      color: res.sold > 0 ? G.C.green : G.C.blue,
      onClose: () => {
        this.buildMenu();
        if (G.State.s.energy <= 0) {
          G.Popup.show({
            title: 'OUT OF ENERGY',
            lines: ['You are running on fumes and gas station coffee.', 'Time to end the day.'],
            color: G.C.slate,
            onClose: () => this.endDay(),
          });
        }
      },
    });
  },

  // ----------------------------------------------------------
  endDay() {
    const s = G.State.s;
    const r = G.State.endDay();
    const lines = [];
    if (r.passiveLines.length) lines.push(...r.passiveLines, '');
    if (r.rivalLines.length) {
      lines.push('MEANWHILE...', ...r.rivalLines);
    } else {
      lines.push('Your rival was suspiciously quiet today.');
    }
    lines.push('', 'SCORE: YOU ' + s.stats.homesSold + ' - RIVAL ' + s.rival.homesSold);

    G.Popup.show({
      title: 'END OF DAY', lines, color: G.C.navy,
      onClose: () => {
        const proceed = () => {
          if (r.bossTime) G.Engine.goto('boss');
          else G.Engine.goto('map', { newDay: true });
        };
        if (r.eventText) {
          G.Audio[r.eventGood ? 'good' : 'thud']();
          G.Popup.show({
            title: r.eventGood ? 'PLOT TWIST!' : 'UFF DA...',
            lines: [r.eventText],
            color: r.eventGood ? G.C.green : G.C.red,
            onClose: proceed,
          });
        } else proceed();
      },
    });
  },

  // ----------------------------------------------------------
  update(dt) {
    this.t += dt;
    this.particles.update(dt);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }

    // wandering deer
    if (this.deer.show) {
      this.deer.x += this.deer.vx * dt;
      if (this.deer.x > 460) this.deer.vx = -6;
      if (this.deer.x < 160) this.deer.vx = 6;
    }

    if (this.mode === 'drive') {
      const tgt = this.carTarget;
      const d = G.dist(this.carX, this.carY, tgt.x, tgt.y);
      if (d < 3) {
        this.mode = 'menu';
        const a = this.pendingAction;
        this.pendingAction = null;
        if (a.minigame) {
          G.Engine.goto(a.minigame, { actionId: a.id });
        } else {
          this.resolveAction(a.id, null);
        }
      } else {
        const sp = 130 * dt;
        this.carX += (tgt.x - this.carX) / d * sp;
        this.carY += (tgt.y - this.carY) / d * sp;
      }
      return;
    }

    if (this.mode === 'stats' || this.mode === 'pipeline') {
      if (G.Input.cancel() || G.Input.confirm() || G.Input.mouse.clicked) {
        if (this.mode === 'pipeline') {
          // allow scrolling before closing on click
        }
        if (G.Input.cancel() || G.Input.confirm()) { this.mode = 'menu'; G.Audio.back(); return; }
        if (G.Input.mouse.clicked) { this.mode = 'menu'; G.Audio.back(); return; }
      }
      if (this.mode === 'pipeline') {
        if (G.Input.up()) this.pipeScroll = Math.max(0, this.pipeScroll - 1);
        if (G.Input.down()) this.pipeScroll++;
      }
      return;
    }

    this.menu.update();
  },

  // ----------------------------------------------------------
  render(ctx) {
    const s = G.State.s;
    if (!s) return;

    this.renderMap(ctx);
    this.renderSidebar(ctx);
    this.renderHud(ctx);
    this.particles.render(ctx);

    if (this.mode === 'stats') this.renderStats(ctx);
    if (this.mode === 'pipeline') this.renderPipeline(ctx);

    if (this.banner) {
      const a = Math.min(1, this.banner.t);
      ctx.globalAlpha = a;
      ctx.fillStyle = G.C.ink;
      ctx.fillRect(0, 110, G.W, 34);
      G.UI.text(ctx, this.banner.text, G.W / 2, 122, { align: 'center', size: 13, color: G.C.yellow });
      ctx.globalAlpha = 1;
    }
  },

  renderMap(ctx) {
    const s = G.State.s;
    const MX = this.MAP_X;

    // land
    ctx.fillStyle = s.month === 0 ? '#3d5a45' : s.month === 1 ? '#38b76422' : '#38b764';
    ctx.fillStyle = ['#41684d', '#4a7c59', '#529960'][s.month];
    ctx.fillRect(MX, 0, G.W - MX, G.H);

    // texture patches
    for (let i = 0; i < 60; i++) {
      const px = MX + ((i * 53) % (G.W - MX));
      const py = (i * 37) % G.H;
      ctx.fillStyle = i % 3 ? 'rgba(26,28,44,0.12)' : 'rgba(255,255,255,0.05)';
      ctx.fillRect(px, py, 3, 2);
    }
    // April snow patches
    if (s.month === 0) {
      for (let i = 0; i < 24; i++) {
        ctx.fillStyle = 'rgba(244,244,244,0.5)';
        ctx.fillRect(MX + ((i * 89) % (G.W - MX - 10)), (i * 61) % (G.H - 8), 6, 3);
      }
    }

    // roads between towns
    ctx.strokeStyle = '#6b6f82';
    ctx.lineWidth = 2;
    const T = G.Data.MAP.towns;
    ctx.beginPath();
    for (let i = 0; i < T.length - 1; i++) {
      ctx.moveTo(T[i].x, T[i].y);
      ctx.lineTo(T[i + 1].x, T[i + 1].y);
    }
    ctx.stroke();

    // lakes
    for (const lake of G.Data.MAP.lakes) {
      ctx.fillStyle = G.C.blue;
      ctx.beginPath();
      ctx.ellipse(lake.x + lake.w / 2, lake.y + lake.h / 2, lake.w / 2, lake.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      // shimmer
      ctx.fillStyle = G.C.sky;
      for (let i = 0; i < 5; i++) {
        const wx = lake.x + 8 + ((i * 31 + Math.floor(this.t * 8)) % (lake.w - 16));
        ctx.fillRect(wx, lake.y + 6 + (i * 7) % (lake.h - 12), 4, 1);
      }
      G.UI.text(ctx, lake.name, lake.x + lake.w / 2, lake.y + lake.h / 2 - 3, { align: 'center', size: 6, color: G.C.cyan });
    }

    // pines
    for (let i = 0; i < 26; i++) {
      const px = MX + 6 + ((i * 47) % (G.W - MX - 16));
      const py = 4 + ((i * 71) % (G.H - 30));
      const onLake = G.Data.MAP.lakes.some(l =>
        px > l.x - 6 && px < l.x + l.w + 2 && py > l.y - 8 && py < l.y + l.h + 2);
      if (!onLake) G.drawSprite(ctx, i % 2 ? G.Sprites.pine : G.Sprites.pine2, px, py, 1);
    }

    // towns
    for (const t of T) {
      ctx.fillStyle = G.C.gray;
      ctx.fillRect(t.x - 3, t.y - 2, 6, 4);
      G.UI.text(ctx, t.name, t.x, t.y + 5, { align: 'center', size: 6, color: G.C.white, shadow: true });
    }

    // action locations
    const selected = this.menu && this.menu.items[this.menu.index];
    const selLoc = selected && selected.kind === 'action'
      ? G.Data.ACTIONS.find(a => a.id === selected.id).loc : null;
    for (const [key, loc] of Object.entries(G.Data.MAP.locations)) {
      const sp = G.Sprites[loc.sprite];
      G.drawSprite(ctx, sp, loc.x - sp.width / 2, loc.y - sp.height, 1);
      if (key === selLoc) {
        const bob = Math.sin(this.t * 6) * 2;
        ctx.fillStyle = G.C.yellow;
        ctx.beginPath();
        ctx.moveTo(loc.x, loc.y - sp.height - 4 + bob);
        ctx.lineTo(loc.x - 4, loc.y - sp.height - 10 + bob);
        ctx.lineTo(loc.x + 4, loc.y - sp.height - 10 + bob);
        ctx.fill();
        G.UI.text(ctx, loc.label, loc.x, loc.y - sp.height - 19 + bob, { align: 'center', size: 6, color: G.C.yellow, shadow: true });
      }
    }

    // deer
    if (this.deer.show) {
      G.drawSprite(ctx, G.Sprites.deer, this.deer.x, this.deer.y, 1, this.deer.vx < 0);
    }

    // the car
    const carSprite = G.State.has('vehicle') ? G.Sprites.carFancy : G.Sprites.car;
    G.drawSprite(ctx, carSprite, this.carX - 5, this.carY - 4, 1, this.carTarget && this.carTarget.x < this.carX);

    // compass + label
    G.UI.text(ctx, 'NORTHERN MINNESOTA', G.W - 6, G.H - 10, { align: 'right', size: 6, color: 'rgba(244,244,244,0.5)' });
  },

  renderSidebar(ctx) {
    const s = G.State.s;
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(0, 0, this.MAP_X, G.H);
    ctx.strokeStyle = G.C.slate;
    ctx.beginPath(); ctx.moveTo(this.MAP_X - 0.5, 0); ctx.lineTo(this.MAP_X - 0.5, G.H); ctx.stroke();

    const ch = G.State.char();
    G.drawSprite(ctx, G.Sprites[ch.sprite], 4, 4, 2);
    G.UI.text(ctx, ch.name, 38, 6, { size: 9, color: ch.id === 'bridger' ? '#c0562f' : G.C.lime });
    G.UI.text(ctx, G.money(s.cash), 38, 17, { size: 8, color: G.C.yellow });

    // energy pips
    G.UI.text(ctx, 'ENERGY', 38, 28, { size: 6, color: G.C.gray });
    for (let i = 0; i < G.State.maxEnergy(); i++) {
      ctx.fillStyle = i < s.energy ? G.C.lime : G.C.dusk;
      ctx.fillRect(72 + i * 8, 28, 6, 6);
      ctx.strokeStyle = G.C.slate;
      ctx.strokeRect(72.5 + i * 8, 28.5, 5, 5);
    }

    this.menu.render(ctx);

    // hovered action description
    const it = this.menu.items[this.menu.index];
    if (it && it.desc) {
      const lines = G.UI.wrap(ctx, it.desc, 138, 7);
      let y = G.H - 8 - lines.length * 8;
      ctx.fillStyle = G.C.dusk;
      ctx.fillRect(2, y - 3, this.MAP_X - 6, lines.length * 8 + 6);
      for (const l of lines) {
        G.UI.text(ctx, l, 6, y, { size: 7, color: G.C.cyan });
        y += 8;
      }
    }
  },

  renderHud(ctx) {
    const s = G.State.s;
    // top-right scoreboard strip
    const w = 180, x = G.W - w - 4, y = 3;
    ctx.fillStyle = 'rgba(26,28,44,0.85)';
    ctx.fillRect(x, y, w, 22);
    ctx.strokeStyle = G.C.slate;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 21);
    G.UI.text(ctx, G.State.monthName() + ' D' + s.dayOfMonth + '/' + G.Data.SEASON.daysPerMonth, x + 5, y + 3, { size: 7, color: G.C.white });
    G.UI.text(ctx, 'YOU ' + s.stats.homesSold, x + 5, y + 12, { size: 7, color: G.C.lime });
    G.UI.text(ctx, 'RIVAL ' + s.rival.homesSold, x + 50, y + 12, { size: 7, color: G.C.red });
    G.UI.text(ctx, 'FOLLOWERS ' + s.stats.followers, x + w - 5, y + 3, { align: 'right', size: 7, color: G.C.sky });
    G.UI.text(ctx, 'LEADS ' + s.leads.length, x + w - 5, y + 12, { align: 'right', size: 7, color: G.C.yellow });
  },

  renderStats(ctx) {
    const s = G.State.s;
    ctx.fillStyle = 'rgba(26,28,44,0.85)';
    ctx.fillRect(0, 0, G.W, G.H);
    G.UI.panel(ctx, 90, 24, 300, 222, { title: 'SEASON STAT SHEET', titleBg: G.C.teal, bg: G.C.ink });

    const rows = [
      ['HOMES SOLD', s.stats.homesSold, G.C.lime],
      ['COMMISSION EARNED', G.money(s.stats.commission), G.C.yellow],
      ['LISTINGS TAKEN', s.stats.listings, G.C.white],
      ['BUYER CLIENTS', s.stats.buyers, G.C.white],
      ['REFERRALS', s.stats.referrals, G.C.white],
      ['ONLINE REVIEWS', s.stats.reviews + ' (5-STAR)', G.C.cyan],
      ['SOCIAL FOLLOWERS', s.stats.followers, G.C.sky],
      ['CLIENT HAPPINESS', s.stats.happiness + '/100', G.C.orange],
      ['LEADS RECEIVED', s.stats.leadsReceived, G.C.gray],
      ['CONVERSION RATE', G.pct(G.State.conversionRate()), G.C.lime],
      ['BOSS WINS', s.stats.bossWins, G.C.purple],
      ['CASH ON HAND', G.money(s.cash), G.C.yellow],
    ];
    let y = 44;
    for (const [label, val, color] of rows) {
      G.UI.text(ctx, label, 104, y, { size: 8, color: G.C.gray });
      G.UI.text(ctx, String(val), 376, y, { align: 'right', size: 8, color });
      y += 14;
    }
    G.UI.text(ctx, 'HAPPINESS BOOSTS REFERRALS. FOLLOWERS BRING LEADS.', G.W / 2, y + 6, { align: 'center', size: 6, color: G.C.slate });
    G.UI.text(ctx, '[ESC] CLOSE', G.W / 2, 234, { align: 'center', size: 7, color: G.C.yellow });
  },

  renderPipeline(ctx) {
    const s = G.State.s;
    ctx.fillStyle = 'rgba(26,28,44,0.85)';
    ctx.fillRect(0, 0, G.W, G.H);
    G.UI.panel(ctx, 60, 16, 360, 238, { title: 'LEAD PIPELINE (' + s.leads.length + ')', titleBg: G.C.blue, bg: G.C.ink });

    const order = G.Data.STAGES;
    const leads = s.leads.slice().sort((a, b) => order.indexOf(b.stage) - order.indexOf(a.stage));
    const perPage = 13;
    const maxScroll = Math.max(0, leads.length - perPage);
    this.pipeScroll = G.clamp(this.pipeScroll, 0, maxScroll);
    const visible = leads.slice(this.pipeScroll, this.pipeScroll + perPage);

    let y = 36;
    if (!leads.length) {
      G.UI.text(ctx, 'NO LEADS. GO MAKE A VIDEO OR HOST AN OPEN HOUSE!', G.W / 2, 120, { align: 'center', size: 8, color: G.C.gray });
    }
    for (const l of visible) {
      G.UI.text(ctx, l.name, 70, y, { size: 7, color: G.C.white });
      G.UI.text(ctx, l.label, 165, y, { size: 7, color: l.lake ? G.C.cyan : l.luxury ? G.C.yellow : G.C.gray });
      G.UI.text(ctx, G.money(l.value), 300, y, { size: 7, color: G.C.yellow });
      const sc = G.Data.STAGE_COLORS[l.stage];
      ctx.fillStyle = sc;
      ctx.fillRect(340, y, 4, 6);
      G.UI.text(ctx, G.Data.STAGE_LABELS[l.stage] + (l.issue ? '!' : ''), 348, y, { size: 7, color: l.issue ? G.C.red : sc });
      y += 15;
    }
    if (maxScroll > 0) {
      G.UI.text(ctx, 'UP/DOWN TO SCROLL (' + (this.pipeScroll + 1) + '-' + Math.min(leads.length, this.pipeScroll + perPage) + ')', G.W / 2, 236, { align: 'center', size: 6, color: G.C.slate });
    }
    G.UI.text(ctx, '[ESC] CLOSE', G.W / 2, 245, { align: 'center', size: 7, color: G.C.yellow });
  },
});

</script>
<script>
// ============================================================
// scenes/shop.js - business upgrades
// ============================================================
'use strict';

G.Engine.register('shop', {
  enter() {
    this.t = 0;
    this.buildMenu();
  },

  buildMenu() {
    const s = G.State.s;
    const items = G.Data.UPGRADES.map(u => {
      const owned = G.State.has(u.id);
      const afford = s.cash >= u.cost;
      return {
        label: u.name,
        id: u.id,
        disabled: owned || !afford,
        note: owned ? 'OWNED' : G.money(u.cost),
        desc: u.desc,
      };
    });
    items.push({ label: 'BACK TO MAP', id: 'back', note: '', desc: 'Return to the grind.' });

    const keep = this.menu ? this.menu.index : 0;
    this.menu = new G.Menu(items, {
      x: 12, y: 40, w: 210, rowH: 15,
      onSelect: (it) => {
        if (it.id === 'back') { G.Engine.goto('map'); return; }
        if (G.State.buyUpgrade(it.id)) {
          G.Audio.cash();
          this.buildMenu();
        } else {
          G.Audio.bad();
        }
      },
    });
    this.menu.index = Math.min(keep, items.length - 1);
  },

  update(dt) {
    this.t += dt;
    if (G.Input.cancel()) { G.Audio.back(); G.Engine.goto('map'); return; }
    this.menu.update();
  },

  render(ctx) {
    const s = G.State.s;
    ctx.fillStyle = G.C.dusk;
    ctx.fillRect(0, 0, G.W, G.H);

    G.UI.panel(ctx, 4, 4, G.W - 8, G.H - 8, { title: 'PRO SHOP - GROW YOUR BUSINESS', titleBg: G.C.purple, bg: G.C.ink });
    G.UI.text(ctx, 'CASH: ' + G.money(s.cash), G.W - 16, 22, { align: 'right', size: 10, color: G.C.yellow });

    this.menu.render(ctx);

    // detail card for the highlighted upgrade
    const it = this.menu.items[this.menu.index];
    G.UI.panel(ctx, 236, 40, 230, 150, { title: it.label, titleBg: G.C.blue, bg: G.C.navy });
    let y = 60;
    for (const l of G.UI.wrap(ctx, it.desc || '', 206, 8)) {
      G.UI.text(ctx, l, 246, y, { size: 8, color: G.C.white });
      y += 11;
    }
    if (it.id !== 'back') {
      const owned = G.State.has(it.id);
      G.UI.text(ctx, owned ? 'ALREADY OWNED' : 'COST: ' + it.note, 246, 170, {
        size: 9, color: owned ? G.C.lime : (s.cash >= (G.Data.UPGRADES.find(u => u.id === it.id) || {}).cost ? G.C.yellow : G.C.red),
      });
    }

    // owned list
    const owned = G.Data.UPGRADES.filter(u => G.State.has(u.id));
    G.UI.text(ctx, 'OWNED: ' + (owned.length ? owned.map(u => u.name).join(', ') : 'NOTHING YET'), 12, G.H - 30, { size: 6, color: G.C.gray });
    G.UI.text(ctx, '[ESC] BACK', G.W / 2, G.H - 18, { align: 'center', size: 7, color: G.C.slate });
  },
});

</script>
<script>
// ============================================================
// scenes/minigames.js - the 8 action mini-games
// All share a frame: INTRO -> PLAY -> RESULT -> back to map.
// Each finishes with a score 0..1 that state.js turns into results.
// ============================================================
'use strict';

// ------------------------------------------------------------
// Shared minigame scaffolding
// def: { title, subtitle, howto:[], duration, init(), play(dt), draw(ctx), bonus() }
// ------------------------------------------------------------
G.makeMinigame = (name, def) => {
  const scene = {
    enter(params) {
      this.actionId = params.actionId;
      this.phase = 'intro';
      this.t = 0;
      this.playT = 0;
      this.score = 0;
      this.flash = null; // {text, color, t}
      this.particles = new G.Particles();
      def.init.call(this);
      G.Audio.stopMusic();
    },

    exit() { G.Audio.startMusic(); },

    finish(rawScore) {
      if (this.phase === 'done') return;
      let sc = G.clamp(rawScore, 0, 1);
      if (def.bonus) sc = G.clamp(sc + def.bonus.call(this), 0, 1);
      this.score = sc;
      this.phase = 'done';
      this.t = 0;
      if (sc >= 0.6) G.Audio.great(); else if (sc >= 0.35) G.Audio.good(); else G.Audio.sadTromb();
    },

    pop(text, color) { this.flash = { text, color: color || G.C.yellow, t: 0.7 }; },

    update(dt) {
      this.t += dt;
      this.particles.update(dt);
      if (this.flash) { this.flash.t -= dt; if (this.flash.t <= 0) this.flash = null; }

      if (this.phase === 'intro') {
        if (this.t > 0.3 && (G.Input.confirm() || G.Input.mouse.clicked)) {
          this.phase = 'play';
          this.t = 0;
          G.Audio.select();
        }
        return;
      }
      if (this.phase === 'play') {
        this.playT += dt;
        def.play.call(this, dt);
        if (def.duration && this.playT >= def.duration) this.finish(def.timeUp ? def.timeUp.call(this) : this.score);
        return;
      }
      if (this.phase === 'done') {
        if (this.t > 0.5 && (G.Input.confirm() || G.Input.mouse.clicked)) {
          G.Engine.goto('map', { result: { actionId: this.actionId, score: this.score } });
        }
      }
    },

    render(ctx) {
      ctx.fillStyle = def.bg || G.C.dusk;
      ctx.fillRect(0, 0, G.W, G.H);

      // header
      ctx.fillStyle = G.C.ink;
      ctx.fillRect(0, 0, G.W, 24);
      G.UI.text(ctx, def.title, 8, 5, { size: 11, color: G.C.yellow });
      G.UI.text(ctx, def.subtitle, G.W - 8, 8, { align: 'right', size: 7, color: G.C.gray });

      if (this.phase === 'intro') {
        G.UI.panel(ctx, 90, 70, 300, 130, { title: 'GET READY', titleBg: G.C.blue, bg: G.C.ink });
        let y = 92;
        for (const line of def.howto) {
          for (const l of G.UI.wrap(ctx, line, 270, 8)) {
            G.UI.text(ctx, l, 104, y, { size: 8, color: G.C.white });
            y += 11;
          }
        }
        if (Math.floor(this.t * 2) % 2 === 0) {
          G.UI.text(ctx, '- PRESS ENTER TO START -', G.W / 2, 182, { align: 'center', size: 8, color: G.C.yellow });
        }
        return;
      }

      def.draw.call(this, ctx);
      this.particles.render(ctx);

      // timer bar
      if (def.duration && this.phase === 'play') {
        G.UI.bar(ctx, 8, G.H - 12, G.W - 16, 6, 1 - this.playT / def.duration,
          this.playT / def.duration > 0.75 ? G.C.red : G.C.cyan);
      }

      // flash text
      if (this.flash) {
        G.UI.text(ctx, this.flash.text, G.W / 2, 110, { align: 'center', size: 14, color: this.flash.color, shadow: true });
      }

      if (this.phase === 'done') {
        ctx.fillStyle = 'rgba(26,28,44,0.8)';
        ctx.fillRect(0, 0, G.W, G.H);
        const grade = this.score >= 0.85 ? 'S' : this.score >= 0.7 ? 'A' : this.score >= 0.5 ? 'B' : this.score >= 0.3 ? 'C' : 'D';
        const gcol = this.score >= 0.7 ? G.C.lime : this.score >= 0.4 ? G.C.yellow : G.C.red;
        G.UI.text(ctx, 'RANK', G.W / 2, 82, { align: 'center', size: 10, color: G.C.gray });
        G.UI.text(ctx, grade, G.W / 2, 98, { align: 'center', size: 44, color: gcol, shadow: true });
        G.UI.text(ctx, def.gradeLines ? def.gradeLines.call(this) : Math.round(this.score * 100) + '%', G.W / 2, 152, { align: 'center', size: 9, color: G.C.white });
        if (this.t > 0.5 && Math.floor(this.t * 2) % 2 === 0) {
          G.UI.text(ctx, '- PRESS ENTER -', G.W / 2, 190, { align: 'center', size: 8, color: G.C.yellow });
        }
      }
    },
  };

  // expose the definition's helper methods (e.g. newRound) on the scene
  for (const [k, v] of Object.entries(def)) {
    if (typeof v === 'function' && !(k in scene)) scene[k] = v;
  }
  G.Engine.register(name, scene);
};

    if (this.needle < 0) { this.needle = 0; this.dir = 1; }

    if (G.Input.confirm() || G.Input.mouse.clicked) {

        G.Audio.good();
        this.particles.spawn(G.W / 2, 130, { count: 12, colors: [G.C.lime, G.C.cyan] });
      } else {
        this.pop(G.choice(['VOICEMAIL...', '"NEW PHONE WHO DIS"', '*DIAL TONE*']), G.C.red);
        G.Audio.bad();
      }
      setTimeout(() => {
        this.calls++;
        if (this.calls >= 3) { this.finish(this.hits / 3); return; }
        this.locked = false;
        this.speed += 0.55;
        this.zone.width = Math.max(0.12, this.zone.width - 0.03);
        this.zone.start = G.rand(0.15, 0.85 - this.zone.width);
        G.Audio.ring();

    G.drawSprite(ctx, G.Sprites.phone, G.W / 2 - 40 - Math.sin(this.t * 20) * (this.locked ? 0 : 2), 60, 4);

    ctx.fillStyle = G.C.ink;
    ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
    ctx.fillStyle = G.C.red;
    ctx.fillRect(mx, my, mw, mh);
    ctx.fillStyle = G.C.green;
    ctx.fillRect(mx + this.zone.start * mw, my, this.zone.width * mw, mh);
    // needle
    ctx.fillStyle = G.C.white;
    ctx.fillRect(mx + this.needle * mw - 1, my - 5, 3, mh + 10);
    G.UI.text(ctx, 'HITS: ' + this.hits, G.W / 2, 200, { align: 'center', size: 9, color: G.C.lime });

  gradeLines() { return this.hits + ' APPOINTMENT' + (this.hits === 1 ? '' : 'S') + ' FROM 3 CALLS'; },

G.makeMinigame('textGame', {
  title: 'THUMB STORM',
  subtitle: 'PICK THE PRO REPLY - FAST',
  howto: [
    'Leads are texting! Pick the PROFESSIONAL reply with UP/DOWN + ENTER (or click) before the patience meter empties.',
    '4 messages. Speed earns bonus points.',
  ],
  bg: G.C.teal,

  init() {
    this.rounds = G.shuffle(G.TEXT_ROUNDS).slice(0, 4);
    this.round = 0;
    this.points = 0;
    this.max = 4;
    this.newRound();
  },

  newRound() {
    const r = this.rounds[this.round];
    const opts = G.shuffle([{ t: r.good, ok: true }, { t: r.bad[0], ok: false }, { t: r.bad[1], ok: false }]);
    this.opts = opts;
    this.sel = 0;
    this.timer = 5;
    this.answered = false;
    G.Audio.tick();
  },

  play(dt) {
    if (this.answered) return;
    this.timer -= dt;
    if (this.timer <= 0) {
      this.pop('TOO SLOW! LEAD WANDERED OFF', G.C.red);
      G.Audio.bad();
      this.nextRound();
      return;
    }
    if (G.Input.up()) { this.sel = (this.sel + 2) % 3; G.Audio.move(); }
    if (G.Input.down()) { this.sel = (this.sel + 1) % 3; G.Audio.move(); }

    let picked = -1;
    if (G.Input.confirm()) picked = this.sel;
    for (let i = 0; i < 3; i++) {
      if (G.Input.clickedRect(60, 120 + i * 30, 360, 26)) picked = i;
    }

    if (picked >= 0) {
      this.sel = picked;
      if (this.opts[picked].ok) {
        const speedBonus = this.timer > 3 ? 0.25 : 0;
        this.points += 0.75 + speedBonus;
        this.pop(speedBonus ? 'LIGHTNING THUMBS! +BONUS' : 'SMOOTH REPLY!', G.C.lime);
        G.Audio.good();
      } else {
        this.pop('...THEY LEFT YOU ON READ', G.C.red);
        G.Audio.bad();
      }
      this.nextRound();
    }
  },

  nextRound() {
    this.answered = true;
    setTimeout(() => {
      this.round++;
      if (this.round >= 4) { this.finish(this.points / this.max); return; }
      this.newRound();
    }, 650);
  },

  draw(ctx) {
    const r = this.rounds[Math.min(this.round, 3)];
    G.UI.text(ctx, 'MSG ' + Math.min(this.round + 1, 4) + '/4', 8, 32, { size: 8, color: G.C.white });

    G.UI.text(ctx, 'LEAD:', 70, 52, { size: 7, color: G.C.orange });
    G.UI.text(ctx, r.msg, 70, 64, { size: 9, color: G.C.white });
    // patience
    G.UI.text(ctx, 'PATIENCE', 60, 92, { size: 7, color: G.C.gray });
    G.UI.bar(ctx, 120, 92, 240, 7, this.timer / 5, this.timer < 1.5 ? G.C.red : G.C.orange);
    // replies
    for (let i = 0; i < 3; i++) {
      const y = 120 + i * 30;
      const sel = this.sel === i;
      ctx.fillStyle = sel ? G.C.blue : G.C.ink;
      ctx.fillRect(60, y, 360, 26);
      ctx.strokeStyle = sel ? G.C.yellow : G.C.slate;
      ctx.strokeRect(60.5, y + 0.5, 359, 25);
      G.UI.text(ctx, (sel ? '> ' : '  ') + this.opts[i].t, 68, y + 9, { size: 8, color: sel ? G.C.white : G.C.gray });
    }
  },

  gradeLines() { return 'REPLY GAME: ' + Math.round(this.score * 100) + '% SMOOTH'; },
});

// 3. LISTING APPOINTMENT - repeat the pitch (Simon-style)
// ------------------------------------------------------------
G.makeMinigame('listingGame', {
  title: 'PITCH PERFECT',
  subtitle: 'REPEAT THE WINNING PITCH',
  howto: [
    'The seller wants to hear THE PITCH, in exactly the right order.',
    'Watch the arrow sequence, then repeat it with the ARROW KEYS.',
    '3 rounds. Each round gets longer. No pressure.',
  ],
  bg: G.C.purple,

  init() {
    this.round = 0;         // 0..2, lengths 3,4,5
    this.state = 'show';    // show | input | between
    this.seq = [];
    this.showIdx = 0;
    this.showTimer = 0;
    this.inputIdx = 0;
    this.done = 0;
    this.newSeq();
  },

  newSeq() {
    const len = 3 + this.round;
    const dirs = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
    this.seq = Array.from({ length: len }, () => G.choice(dirs));
    this.state = 'show';
    this.showIdx = -1;
    this.showTimer = 0.4;
    this.inputIdx = 0;
  },

  play(dt) {
    const PITCH_WORDS = ['COMPS!', 'STAGING!', 'MARKETING!', 'PRICE!', 'DRONE!', 'TRUST!'];

    if (this.state === 'show') {
      this.showTimer -= dt;
      if (this.showTimer <= 0) {
        this.showIdx++;
        if (this.showIdx >= this.seq.length) {
          this.state = 'input';
          this.pop('YOUR TURN!', G.C.cyan);
        } else {
          this.showTimer = 0.55;
          G.Audio.tick();
        }
      }
      return;
    }

    if (this.state !== 'input') return;

    const dirs = { ArrowUp: G.Input.up(), ArrowDown: G.Input.down(), ArrowLeft: G.Input.left(), ArrowRight: G.Input.right() };
    for (const [key, hit] of Object.entries(dirs)) {
      if (!hit) continue;
      if (key === this.seq[this.inputIdx]) {
        G.Audio.move();
        this.pop(PITCH_WORDS[this.inputIdx % PITCH_WORDS.length], G.C.lime);
        this.inputIdx++;
        if (this.inputIdx >= this.seq.length) {
          this.done++;
          this.state = 'between';
          G.Audio.good();
          this.pop('NAILED IT!', G.C.lime);
          setTimeout(() => {
            this.round++;
            if (this.round >= 3) this.finish(this.done / 3);
            else this.newSeq();
          }, 700);
        }
      } else {
        G.Audio.bad();
        this.pop('"UM, THE ZILLOW SAYS..."', G.C.red);
        this.state = 'between';
        setTimeout(() => {
          this.round++;
          if (this.round >= 3) this.finish(this.done / 3);
          else this.newSeq();
        }, 700);
      }
      break;
    }
  },

  draw(ctx) {
    G.UI.text(ctx, 'ROUND ' + Math.min(this.round + 1, 3) + '/3   PITCHES LANDED: ' + this.done, G.W / 2, 34, { align: 'center', size: 9, color: G.C.white });
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], 80, 60, 3);
    G.drawSprite(ctx, G.Sprites.cabin, 340, 66, 3);

    const ARROWS = { ArrowUp: '^', ArrowDown: 'v', ArrowLeft: '<', ArrowRight: '>' };
    const n = this.seq.length;
    const startX = G.W / 2 - n * 16;
    for (let i = 0; i < n; i++) {
      const x = startX + i * 32;
      let show = false, litUp = false;
      if (this.state === 'show') {
        show = i <= this.showIdx;
        litUp = i === this.showIdx;
      } else {
        show = i < this.inputIdx;
        litUp = false;
      }
      ctx.fillStyle = litUp ? G.C.yellow : show ? G.C.blue : G.C.ink;
      ctx.fillRect(x, 150, 26, 26);
      ctx.strokeStyle = G.C.white;
      ctx.strokeRect(x + 0.5, 150.5, 25, 25);
      if (show || this.state === 'input') {
        const label = show ? ARROWS[this.seq[i]] : '?';
        G.UI.text(ctx, label, x + 13, 156, { align: 'center', size: 13, color: litUp ? G.C.ink : G.C.white });
      }
    }

    G.UI.text(ctx, this.state === 'show' ? 'MEMORIZE THE PITCH...' : 'REPEAT IT WITH ARROW KEYS!',
      G.W / 2, 196, { align: 'center', size: 9, color: this.state === 'show' ? G.C.orange : G.C.cyan });
  },

  bonus() { return G.State.has('drone') ? 0.05 : 0; },
  gradeLines() { return this.done + '/3 PITCH ROUNDS LANDED'; },
});

G.makeMinigame('showGame', {

  ],
  bg: G.C.navy,

  duration: 18,

  init() {
    this.features = [
      { key: 'a', label: 'HOT TUB', x: 90, y: 170 },
      { key: 's', label: 'GARAGE', x: 190, y: 190 },
      { key: 'd', label: 'GRANITE', x: 290, y: 160 },
      { key: 'f', label: 'LAKE VIEW', x: 390, y: 150 },
      { key: 'a', label: 'FIREPLACE', x: 140, y: 120 },
      { key: 'd', label: 'DOCK', x: 340, y: 210 },
    ];
    this.queue = G.shuffle(this.features);
    this.idx = 0;
    this.active = null;
    this.activeT = 0;
    this.hits = 0;
    this.misses = 0;
    this.spawnT = 0.8;
  },

  play(dt) {
    if (!this.active) {
      this.spawnT -= dt;
      if (this.spawnT <= 0 && this.idx < this.queue.length) {
        this.active = this.queue[this.idx++];
        this.activeT = 1.6;
        G.Audio.tick();
      } else if (this.idx >= this.queue.length && !this.active) {
        this.finish(this.hits / this.queue.length);
      }
      return;
    }

    this.activeT -= dt;
    if (this.activeT <= 0) {
      this.misses++;
      this.pop('"...IS THAT WATER DAMAGE?"', G.C.red);
      G.Audio.bad();
      this.active = null;
      this.spawnT = 0.7;
      return;
    }

    for (const k of ['a', 's', 'd', 'f']) {
      if (G.Input.p(k)) {
        if (k === this.active.key) {
          this.hits++;
          this.pop(this.active.label + '! "WOW!"', G.C.lime);
          this.particles.spawn(this.active.x, this.active.y, { count: 10, colors: [G.C.yellow, G.C.cyan] });
          G.Audio.good();
        } else {
          this.misses++;
          this.pop('YOU HYPED THE WRONG ROOM', G.C.red);
          G.Audio.bad();
        }
        this.active = null;
        this.spawnT = 0.7;
        break;
      }
    }
  },

  timeUp() { return this.hits / this.queue.length; },

  draw(ctx) {
    // house cross-section
    ctx.fillStyle = '#6b4226';
    ctx.fillRect(60, 100, 360, 130);
    ctx.fillStyle = G.C.red;
    ctx.beginPath();
    ctx.moveTo(50, 100); ctx.lineTo(240, 60); ctx.lineTo(430, 100);
    ctx.fill();
    ctx.fillStyle = G.C.ink;
    for (let i = 0; i < 3; i++) ctx.fillRect(100 + i * 110, 115, 60, 100);

    G.UI.text(ctx, 'FEATURES HYPED: ' + this.hits, 8, 32, { size: 8, color: G.C.lime });

    for (const f of this.features) {
      const on = this.active === f;
      if (on) {
        const pulse = Math.abs(Math.sin(this.t * 8)) * 6;
        ctx.fillStyle = G.C.yellow;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 10 + pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = G.C.ink;
        ctx.beginPath();
        ctx.arc(f.x, f.y, 9, 0, Math.PI * 2);
        ctx.fill();
        G.UI.text(ctx, f.key.toUpperCase(), f.x, f.y - 4, { align: 'center', size: 9, color: G.C.yellow });
        G.UI.text(ctx, f.label, f.x, f.y - 24, { align: 'center', size: 8, color: G.C.white, shadow: true });
        G.UI.bar(ctx, f.x - 15, f.y + 14, 30, 4, this.activeT / 1.6, G.C.orange);
      } else {
        ctx.fillStyle = 'rgba(244,244,244,0.25)';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  },

  bonus() { return G.State.has('photographer') ? 0.08 : 0; },
  gradeLines() { return this.hits + '/' + this.queue.length + ' FEATURES HYPED'; },
});

// 6. INSPECTION - fix issues by typing their key combos
// ------------------------------------------------------------
G.makeMinigame('inspectGame', {
  title: 'FIX-IT FRENZY',
  subtitle: 'CLEAR THE INSPECTION REPORT',
  howto: [
    'The inspection report is BAD. Fix each issue by pressing its two keys in order.',
    'Clear as many of the 5 issues as you can before time runs out!',
  ],
  bg: G.C.dusk,
  duration: 16,

  init() {
    const ISSUES = ['LEAKY FAUCET', 'SQUIRRELS (RUDE)', 'ROOF FROM 1971', 'RADON???', 'MYSTERY SWITCH', 'SPOOKY FURNACE', 'DOOR TO NOWHERE'];
    const KEYS = 'qwerasdfzxcv'.split('');
    this.issues = G.shuffle(ISSUES).slice(0, 5).map((label, i) => ({
      label,
      combo: [G.choice(KEYS), G.choice(KEYS)],
      progress: 0,
      fixed: false,
    }));
    this.current = 0;
  },

  play(dt) {
    const cur = this.issues[this.current];
    if (!cur) return;

    for (const k of 'qwerasdfzxcv'.split('')) {
      if (!G.Input.p(k)) continue;
      if (k === cur.combo[cur.progress]) {
        cur.progress++;
        G.Audio.tick();
        if (cur.progress >= 2) {
          cur.fixed = true;
          this.pop(cur.label + ' - FIXED!', G.C.lime);
          this.particles.spawn(G.W / 2, 130, { count: 10, colors: [G.C.lime, G.C.white] });
          G.Audio.good();
          this.current++;
          if (this.current >= this.issues.length) this.finish(1);
        }
      } else {
        cur.progress = 0;
        this.pop('WRONG TOOL!', G.C.red);
        G.Audio.bad();
      }
      break;
    }
  },

  timeUp() { return this.issues.filter(i => i.fixed).length / this.issues.length; },

  draw(ctx) {
    G.drawSprite(ctx, G.Sprites.houseStarter, 30, 50, 3);
    let y = 44;
    for (let i = 0; i < this.issues.length; i++) {
      const iss = this.issues[i];
      const active = i === this.current;
      ctx.fillStyle = iss.fixed ? 'rgba(56,183,100,0.25)' : active ? G.C.navy : G.C.ink;
      ctx.fillRect(150, y, 300, 30);
      ctx.strokeStyle = active ? G.C.yellow : G.C.slate;
      ctx.strokeRect(150.5, y + 0.5, 299, 29);
      G.UI.text(ctx, (iss.fixed ? '[OK] ' : '[!!] ') + iss.label, 158, y + 5, {
        size: 8, color: iss.fixed ? G.C.lime : active ? G.C.white : G.C.slate,
      });
      if (!iss.fixed && active) {
        for (let c = 0; c < 2; c++) {
          const done = c < iss.progress;
          ctx.fillStyle = done ? G.C.lime : G.C.dusk;
          ctx.fillRect(360 + c * 24, y + 5, 20, 20);
          ctx.strokeStyle = G.C.white;
          ctx.strokeRect(360.5 + c * 24, y + 5.5, 19, 19);
          G.UI.text(ctx, iss.combo[c].toUpperCase(), 370 + c * 24, y + 10, { align: 'center', size: 10, color: done ? G.C.ink : G.C.yellow });
        }
      }
      y += 36;
    }
  },

  bonus() { return G.State.has('tc') ? 0.05 : 0; },
  gradeLines() { return this.issues.filter(i => i.fixed).length + '/5 ISSUES FIXED'; },
});

// ------------------------------------------------------------
// 7. MAKE VIDEO - rhythm game, hit notes at the line
// ------------------------------------------------------------
G.makeMinigame('videoGame', {
  title: 'LIGHTS, CAMERA, LISTING!',
  subtitle: 'HIT THE BEATS - LEFT / DOWN / RIGHT',
  howto: [
    'Film the perfect listing video! Notes fall down 3 lanes.',
    'Press LEFT / DOWN / RIGHT when a note reaches the glowing line.',
    'Great timing = great content = leads.',
  ],
  bg: G.C.purple,
  duration: 16,

  init() {
    this.lanes = ['ArrowLeft', 'ArrowDown', 'ArrowRight'];
    this.notes = [];
    let t = 1.2;
    for (let i = 0; i < 14; i++) {
      this.notes.push({ lane: G.randInt(0, 2), t, hit: false, missed: false });
      t += G.rand(0.55, 1.0);
    }
    this.hits = 0;
    this.combo = 0;
    this.FALL = 3.0;   // seconds from top to line
    this.LINE_Y = 200;
  },

  play(dt) {
    const inputs = [G.Input.left(), G.Input.down(), G.Input.right()];
    for (let lane = 0; lane < 3; lane++) {
      if (!inputs[lane]) continue;
      // find nearest unhit note in this lane near the line
      let best = null, bestD = 1;
      for (const n of this.notes) {
        if (n.lane !== lane || n.hit || n.missed) continue;
        const d = Math.abs(n.t - this.playT);
        if (d < bestD) { bestD = d; best = n; }
      }
      if (best && bestD <= 0.18) {
        best.hit = true;
        this.hits++;
        this.combo++;
        this.pop(bestD < 0.07 ? 'PERFECT! x' + this.combo : 'NICE! x' + this.combo, bestD < 0.07 ? G.C.cyan : G.C.lime);
        this.particles.spawn(140 + lane * 100, this.LINE_Y, { count: 8, colors: [G.C.cyan, G.C.yellow] });
        G.Audio.good();
      } else {
        this.combo = 0;
        this.pop('OFF BEAT!', G.C.red);
        G.Audio.bad();
      }
    }
    // mark misses
    for (const n of this.notes) {
      if (!n.hit && !n.missed && this.playT - n.t > 0.2) {
        n.missed = true;
        this.combo = 0;
      }
    }
    if (this.notes.every(n => n.hit || n.missed)) {
      this.finish(this.hits / this.notes.length);
    }
  },

  timeUp() { return this.hits / this.notes.length; },

  draw(ctx) {
    const laneX = [140, 240, 340];
    const LABELS = ['<', 'v', '>'];
    // lanes
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = 'rgba(26,28,44,0.6)';
      ctx.fillRect(laneX[i] - 18, 24, 36, G.H - 24);
    }
    // hit line
    const pulse = Math.abs(Math.sin(this.t * 4));
    ctx.fillStyle = 'rgba(115,239,247,' + (0.5 + pulse * 0.5) + ')';
    ctx.fillRect(110, this.LINE_Y, 260, 3);
    for (let i = 0; i < 3; i++) {
      G.UI.text(ctx, LABELS[i], laneX[i], this.LINE_Y + 10, { align: 'center', size: 12, color: G.C.cyan });
    }
    // notes
    for (const n of this.notes) {
      if (n.hit) continue;
      const yProg = 1 - (n.t - this.playT) / this.FALL;
      if (yProg < 0 || yProg > 1.15) continue;
      const y = 24 + yProg * (this.LINE_Y - 24);
      ctx.fillStyle = n.missed ? G.C.slate : [G.C.orange, G.C.lime, G.C.sky][n.lane];
      ctx.fillRect(laneX[n.lane] - 10, y - 5, 20, 10);
      ctx.strokeStyle = G.C.white;
      ctx.strokeRect(laneX[n.lane] - 10.5, y - 5.5, 21, 11);
    }
    // camera guy
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], 40, 100, 3);
    G.UI.text(ctx, 'HITS ' + this.hits + '/' + this.notes.length, G.W - 12, 32, { align: 'right', size: 9, color: G.C.white });
    if (this.combo >= 3) {
      G.UI.text(ctx, 'COMBO x' + this.combo + '!', G.W - 12, 46, { align: 'right', size: 9, color: G.C.yellow });
    }
  },

  bonus() {
    let b = G.State.char().videoBonus || 0;
    if (G.State.has('camera')) b += 0.15;
    return b;
  },
  gradeLines() { return this.hits + '/' + this.notes.length + ' BEATS HIT'; },
});

// ------------------------------------------------------------
// 8. OPEN HOUSE - catch guests, dodge tire kickers
// ------------------------------------------------------------
G.makeMinigame('openHouseGame', {
  title: 'OPEN HOUSE RUSH',
  subtitle: 'CATCH LEADS - DODGE TIRE KICKERS',
  howto: [
    'Guests are flooding in! Move your SIGN-IN SHEET with LEFT/RIGHT to catch falling guests.',
    'YELLOW STARS are hot leads (+2). WHITE guests are leads (+1).',
    'RED tire kickers just want free cookies (-1). Avoid!',
  ],
  bg: G.C.teal,
  duration: 20,

  init() {
    this.px = G.W / 2;
    this.items = [];
    this.spawnT = 0;
    this.points = 0;
    this.MAX = 14;
  },

  play(dt) {
    // move
    const sp = 220 * dt;
    if (G.Input.held('ArrowLeft') || G.Input.held('a')) this.px -= sp;
    if (G.Input.held('ArrowRight') || G.Input.held('d')) this.px += sp;
    if (G.Input.mouse.x > 0) {
      // gentle mouse-follow if the mouse is being used
      if (Math.abs(G.Input.mouse.x - this.px) > 8 && G.Input.mouse.down) {
        this.px += Math.sign(G.Input.mouse.x - this.px) * sp;
      }
    }
    this.px = G.clamp(this.px, 40, G.W - 40);

    // spawn
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = G.rand(0.45, 0.85);
      const roll = Math.random();
      this.items.push({
        x: G.rand(50, G.W - 50),
        y: 20,
        v: G.rand(60, 110) + this.playT * 3,
        kind: roll < 0.15 ? 'star' : roll < 0.62 ? 'guest' : 'kicker',
      });
    }

    // fall + catch
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.y += it.v * dt;
      if (it.y > 228 && it.y < 248 && Math.abs(it.x - this.px) < 30) {
        if (it.kind === 'star') { this.points += 2; this.pop('HOT LEAD! +2', G.C.yellow); G.Audio.great(); }
        else if (it.kind === 'guest') { this.points += 1; this.pop('SIGNED IN! +1', G.C.lime); G.Audio.good(); }
        else { this.points = Math.max(0, this.points - 1); this.pop('"JUST LOOKING" -1', G.C.red); G.Audio.bad(); }
        this.items.splice(i, 1);
      } else if (it.y > G.H) {
        this.items.splice(i, 1);
      }
    }
  },

  timeUp() { return this.points / this.MAX; },

  draw(ctx) {
    // house backdrop
    ctx.fillStyle = 'rgba(26,28,44,0.3)';
    ctx.fillRect(0, 24, G.W, G.H - 24);
    G.drawSprite(ctx, G.Sprites.houseStarter, G.W / 2 - 21, 26, 3);
    G.UI.text(ctx, 'SIGN-INS: ' + this.points, 8, 32, { size: 9, color: G.C.lime });

    for (const it of this.items) {
      if (it.kind === 'star') {
        G.drawSprite(ctx, G.Sprites.star, it.x - 5, it.y - 5, 2);
      } else {
        ctx.fillStyle = it.kind === 'guest' ? G.C.white : G.C.red;
        ctx.fillRect(it.x - 3, it.y - 8, 6, 6);      // head
        ctx.fillRect(it.x - 4, it.y - 1, 8, 8);      // body
      }
    }

    // player + clipboard
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], this.px - 14, 224, 2);
    ctx.fillStyle = G.C.yellow;
    ctx.fillRect(this.px - 30, 236, 60, 5);
    G.UI.text(ctx, 'SIGN-IN', this.px, 243, { align: 'center', size: 6, color: G.C.ink });
  },

  bonus() { return G.State.char().openHouseBonus || 0; },
  gradeLines() { return this.points + ' SIGN-INS COLLECTED'; },
});

</script>
<script>
// ============================================================
// scenes/boss.js - month-end boss showdown vs a top local agent
// Best-of-N skill clashes: stop the needle in the green zone.
// Your stats & upgrades widen the zone per skill.
// ============================================================
'use strict';

G.Engine.register('boss', {
  enter() {
    this.t = 0;
    this.boss = G.State.currentBoss();
    this.phase = 'intro';
    this.round = 0;
    this.playerWins = 0;
    this.bossWins = 0;
    this.flash = null;
    this.particles = new G.Particles();
    this.needle = 0;
    this.dir = 1;
    this.locked = false;
    G.Audio.stopMusic();
    G.Audio.thud();
  },

  exit() { G.Audio.startMusic(); },

  // How much a skill widens your green zone (0..~0.14)
  skillBonus(skill) {
    const s = G.State.s;
    const has = (u) => G.State.has(u);
    let b = 0;
    switch (skill) {
      case 'PROSPECTING':
        if (has('crm')) b += 0.05;
        if (has('website')) b += 0.03;
        b += Math.min(0.05, s.stats.leadsReceived / 400);
        break;
      case 'MARKETING':
        if (has('camera')) b += 0.03;
        if (has('social')) b += 0.04;
        if (has('marketing')) b += 0.04;
        b += Math.min(0.04, s.stats.followers / 30000);
        break;
      case 'NEGOTIATION':
        b += (G.State.char().negotiateBonus || 0) * 0.4;
        b += Math.min(0.04, s.stats.homesSold / 250);
        break;
      case 'CLIENT SERVICE':
        b += s.stats.happiness / 1200;
        b += Math.min(0.03, s.stats.reviews / 300);
        break;
      case 'SPEED':
        if (has('vehicle')) b += 0.04;
        if (has('ai')) b += 0.04;
        if (has('assistant')) b += 0.03;
        break;
      case 'STRATEGY':
        b += Object.keys(s.upgrades).length * 0.012;
        break;
    }
    return Math.min(0.14, b);
  },

  startRound() {
    const skill = this.boss.skills[this.round % this.boss.skills.length];
    this.skill = skill;
    const width = Math.max(0.09, 0.30 - this.boss.difficulty * 0.22 + this.skillBonus(skill));
    this.zone = { start: G.rand(0.15, 0.85 - width), width };
    this.speed = 1.4 + this.boss.difficulty * 1.4 + this.round * 0.22;
    this.needle = 0;
    this.dir = 1;
    this.locked = false;
    this.phase = 'round';
    G.Audio.ring();
  },

  update(dt) {
    this.t += dt;
    this.particles.update(dt);
    if (this.flash) { this.flash.t -= dt; if (this.flash.t <= 0) this.flash = null; }

    if (this.phase === 'intro') {
      if (this.t > 0.5 && (G.Input.confirm() || G.Input.mouse.clicked)) {
        G.Audio.select();
        this.startRound();
      }
      return;
    }

    if (this.phase === 'round') {
      if (this.locked) return;
      this.needle += this.dir * this.speed * dt;
      if (this.needle > 1) { this.needle = 1; this.dir = -1; }
      if (this.needle < 0) { this.needle = 0; this.dir = 1; }

      if (G.Input.confirm() || G.Input.mouse.clicked) {
        this.locked = true;
        const hit = this.needle >= this.zone.start && this.needle <= this.zone.start + this.zone.width;
        if (hit) {
          this.playerWins++;
          this.flash = { text: this.skill + ' - YOU WIN THE ROUND!', color: G.C.lime, t: 1.1 };
          this.particles.spawn(G.W / 2, 130, { count: 20, colors: [G.C.lime, G.C.yellow, G.C.cyan] });
          G.Audio.great();
        } else {
          this.bossWins++;
          this.flash = { text: this.boss.name.split(' ')[0] + ' TAKES ' + this.skill + '!', color: G.C.red, t: 1.1 };
          G.Engine.shake = 3;
          G.Audio.thud();
        }
        setTimeout(() => {
          this.round++;
          const need = Math.floor(this.boss.rounds / 2) + 1;
          if (this.playerWins >= need || this.bossWins >= need || this.round >= this.boss.rounds) {
            this.phase = 'result';
            this.t = 0;
            if (this.playerWins > this.bossWins) G.Audio.fanfare(); else G.Audio.sadTromb();
          } else {
            this.startRound();
          }
        }, 1000);
      }
      return;
    }

    if (this.phase === 'result') {
      if (this.t > 0.8 && (G.Input.confirm() || G.Input.mouse.clicked)) {
        const won = this.playerWins > this.bossWins;
        const res = G.State.resolveBoss(won);
        G.Popup.show({
          title: won ? 'SHOWDOWN WON!' : 'SHOWDOWN LOST',
          lines: res.lines,
          color: won ? G.C.green : G.C.red,
          onClose: () => {
            if (res.seasonOver) G.Engine.goto('seasonEnd');
            else G.Engine.goto('map', { newDay: true });
          },
        });
      }
    }
  },

  render(ctx) {
    const b = this.boss;
    // dramatic backdrop
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(0, 0, G.W, G.H);
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2 + this.t * 0.4;
      ctx.strokeStyle = 'rgba(93,39,93,0.5)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(G.W / 2, 100);
      ctx.lineTo(G.W / 2 + Math.cos(a) * 400, 100 + Math.sin(a) * 400);
      ctx.stroke();
    }
    ctx.lineWidth = 1;

    if (this.phase === 'intro') {
      G.UI.text(ctx, b.final ? 'FINAL BOSS' : 'MONTH-END SHOWDOWN', G.W / 2, 20, { align: 'center', size: 12, color: G.C.red, shadow: true });
      const shake = b.final ? Math.sin(this.t * 30) * 1.5 : 0;
      G.drawSprite(ctx, G.Sprites[b.sprite], G.W / 2 - 28 + shake, 44, 4);
      G.UI.text(ctx, b.name, G.W / 2, 118, { align: 'center', size: 13, color: G.C.yellow, shadow: true });
      let y = 140;
      for (const line of b.intro) {
        G.UI.text(ctx, line, G.W / 2, y, { align: 'center', size: 8, color: G.C.gray });
        y += 11;
      }
      G.UI.text(ctx, '"' + b.taunt + '"', G.W / 2, y + 6, { align: 'center', size: 8, color: G.C.orange });
      G.UI.text(ctx, 'BEST OF ' + b.rounds + ' SKILL CLASHES. STOP THE NEEDLE IN THE GREEN.', G.W / 2, y + 26, { align: 'center', size: 7, color: G.C.cyan });
      if (Math.floor(this.t * 2) % 2 === 0) {
        G.UI.text(ctx, '- PRESS ENTER TO THROW DOWN -', G.W / 2, y + 44, { align: 'center', size: 9, color: G.C.yellow });
      }
      return;
    }

    // fighters
    G.drawSprite(ctx, G.Sprites[G.State.char().sprite], 80, 60, 4);
    G.drawSprite(ctx, G.Sprites[b.sprite], 336, 60, 4);
    G.UI.text(ctx, G.State.char().name, 108, 132, { align: 'center', size: 9, color: G.C.lime });
    G.UI.text(ctx, b.name.split(' ')[0], 364, 132, { align: 'center', size: 9, color: G.C.red });

    // round pips
    for (let i = 0; i < b.rounds; i++) {
      const x = G.W / 2 - b.rounds * 7 + i * 14;
      let col = G.C.dusk;
      if (i < this.playerWins) col = G.C.lime;
      else if (i >= b.rounds - this.bossWins) col = G.C.red;
      ctx.fillStyle = col;
      ctx.fillRect(x, 26, 10, 10);
      ctx.strokeStyle = G.C.white;
      ctx.strokeRect(x + 0.5, 26.5, 9, 9);
    }

    if (this.phase === 'round') {
      G.UI.text(ctx, 'ROUND ' + (this.round + 1) + ': ' + this.skill, G.W / 2, 46, { align: 'center', size: 12, color: G.C.cyan, shadow: true });

      const mx = 90, my = 170, mw = 300, mh = 20;
      ctx.fillStyle = G.C.ink;
      ctx.fillRect(mx - 3, my - 3, mw + 6, mh + 6);
      ctx.fillStyle = G.C.red;
      ctx.fillRect(mx, my, mw, mh);
      ctx.fillStyle = G.C.green;
      ctx.fillRect(mx + this.zone.start * mw, my, this.zone.width * mw, mh);
      ctx.fillStyle = G.C.white;
      ctx.fillRect(mx + this.needle * mw - 1, my - 6, 3, mh + 12);

      G.UI.text(ctx, 'SPACE / ENTER / CLICK TO STRIKE', G.W / 2, my + 30, { align: 'center', size: 8, color: G.C.gray });
      G.UI.text(ctx, 'YOUR ' + this.skill + ' SKILL WIDENS THE GREEN ZONE', G.W / 2, my + 44, { align: 'center', size: 6, color: G.C.slate });
    }

    if (this.phase === 'result') {
      const won = this.playerWins > this.bossWins;
      G.UI.text(ctx, won ? 'VICTORY!' : 'DEFEAT...', G.W / 2, 150, { align: 'center', size: 26, color: won ? G.C.lime : G.C.red, shadow: true });
      G.UI.text(ctx, 'ROUNDS: YOU ' + this.playerWins + ' - ' + this.bossWins + ' THEM', G.W / 2, 186, { align: 'center', size: 10, color: G.C.white });
      if (won) G.drawSprite(ctx, G.Sprites.trophy, G.W / 2 - 7, 202, 2);
      if (this.t > 0.8 && Math.floor(this.t * 2) % 2 === 0) {
        G.UI.text(ctx, '- PRESS ENTER -', G.W / 2, 230, { align: 'center', size: 8, color: G.C.yellow });
      }
    }

    this.particles.render(ctx);
    if (this.flash) {
      G.UI.text(ctx, this.flash.text, G.W / 2, 106, { align: 'center', size: 12, color: this.flash.color, shadow: true });
    }
  },
});

</script>
<script>
// ============================================================
// scenes/results.js - season end + leaderboard
// ============================================================
'use strict';

G.Engine.register('seasonEnd', {
  enter() {
    this.t = 0;
    this.particles = new G.Particles();
    const s = G.State.s;
    this.won = G.State.playerWon();
    this.tied = G.State.tied();
    this.score = G.State.seasonScore();

    // record on the leaderboard once
    if (!s.recorded) {
      s.recorded = true;
      G.Save.addLeaderboardEntry({
        name: G.State.char().name,
        homesSold: s.stats.homesSold,
        commission: s.stats.commission,
        score: this.score,
        won: this.won,
        date: new Date().toLocaleDateString(),
      });
    }
    if (this.won) G.Audio.fanfare(); else G.Audio.sadTromb();
  },

  update(dt) {
    this.t += dt;
    this.particles.update(dt);
    if (this.won && Math.random() < 0.2) {
      this.particles.spawn(G.rand(40, G.W - 40), -4, {
        count: 3, vyMin: 30, vyMax: 70, vxMin: -15, vxMax: 15, gravity: 10,
        colors: [G.C.yellow, G.C.lime, G.C.cyan, G.C.orange], life: 3,
      });
    }
    if (this.t > 1 && (G.Input.confirm() || G.Input.mouse.clicked)) {
      G.Audio.select();
      G.Engine.goto('leaderboard', { fromSeason: true });
    }
  },

  render(ctx) {
    const s = G.State.s;
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(0, 0, G.W, G.H);

    const title = this.tied ? 'DEAD HEAT!' : this.won ? 'REALTOR OF THE SEASON!' : 'SO CLOSE...';
    const col = this.tied ? G.C.yellow : this.won ? G.C.lime : G.C.red;
    G.UI.text(ctx, 'SEASON OVER', G.W / 2, 12, { align: 'center', size: 10, color: G.C.gray });
    G.UI.text(ctx, title, G.W / 2, 26, { align: 'center', size: 16, color: col, shadow: true });

    // podium
    const ch = G.State.char();
    const rc = G.State.rivalChar();
    const meX = this.won || this.tied ? 150 : 290;
    const themX = this.won || this.tied ? 290 : 150;
    ctx.fillStyle = G.C.slate;
    ctx.fillRect(130, 118, 80, this.won ? 26 : 14);
    ctx.fillRect(270, 118, 80, this.won ? 14 : 26);
    G.drawSprite(ctx, G.Sprites[ch.sprite], meX, (this.won ? 66 : 78), 3);
    G.drawSprite(ctx, G.Sprites[rc.sprite], themX, (this.won ? 78 : 66), 3);
    if (this.won) G.drawSprite(ctx, G.Sprites.trophy, meX + 42, 60, 2);
    else if (!this.tied) G.drawSprite(ctx, G.Sprites.trophy, themX + 42, 60, 2);

    G.UI.text(ctx, 'YOU: ' + s.stats.homesSold + ' HOMES', 170, 148, { align: 'center', size: 9, color: G.C.lime });
    G.UI.text(ctx, rc.name + ': ' + s.rival.homesSold + ' HOMES', 310, 148, { align: 'center', size: 9, color: G.C.red });

    // stat strip (3 columns x 3 rows)
    const rows = [
      ['COMMISSION', G.money(s.stats.commission)],
      ['LISTINGS', s.stats.listings],
      ['BUYERS', s.stats.buyers],
      ['REFERRALS', s.stats.referrals],
      ['REVIEWS', s.stats.reviews],
      ['FOLLOWERS', s.stats.followers],
      ['HAPPINESS', s.stats.happiness + '/100'],
      ['CONVERSION', G.pct(G.State.conversionRate())],
      ['BOSS WINS', s.stats.bossWins],
    ];
    for (let i = 0; i < rows.length; i++) {
      const cx = 40 + (i % 3) * 150;
      const cy = 168 + Math.floor(i / 3) * 24;
      G.UI.text(ctx, String(rows[i][0]), cx, cy, { size: 7, color: G.C.gray });
      G.UI.text(ctx, String(rows[i][1]), cx, cy + 9, { size: 9, color: G.C.white });
    }

    G.UI.text(ctx, 'FINAL SCORE: ' + this.score.toLocaleString('en-US'), G.W / 2, 244, { align: 'center', size: 11, color: G.C.yellow, shadow: true });

    this.particles.render(ctx);
    if (this.t > 1 && Math.floor(this.t * 2) % 2 === 0) {
      G.UI.text(ctx, '- PRESS ENTER FOR LEADERBOARD -', G.W / 2, 258, { align: 'center', size: 7, color: G.C.cyan });
    }
  },
});

// ------------------------------------------------------------
G.Engine.register('leaderboard', {
  enter(params = {}) {
    this.t = 0;
    this.fromSeason = !!params.fromSeason;
    this.entries = G.Save.getLeaderboard();
  },

  update(dt) {
    this.t += dt;
    if (this.t > 0.5 && (G.Input.confirm() || G.Input.cancel() || G.Input.mouse.clicked)) {
      G.Audio.back();
      G.Engine.goto('title');
    }
  },

  render(ctx) {
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(0, 0, G.W, G.H);
    G.UI.panel(ctx, 40, 10, G.W - 80, G.H - 20, { title: 'HALL OF FAME - TOP AGENTS', titleBg: G.C.purple });

    if (!this.entries.length) {
      G.UI.text(ctx, 'NO SEASONS COMPLETED YET.', G.W / 2, 110, { align: 'center', size: 10, color: G.C.gray });
      G.UI.text(ctx, 'GO SELL SOME HOUSES!', G.W / 2, 128, { align: 'center', size: 9, color: G.C.yellow });
    } else {
      G.UI.text(ctx, '#', 56, 32, { size: 7, color: G.C.slate });
      G.UI.text(ctx, 'AGENT', 76, 32, { size: 7, color: G.C.slate });
      G.UI.text(ctx, 'HOMES', 170, 32, { size: 7, color: G.C.slate });
      G.UI.text(ctx, 'COMMISSION', 220, 32, { size: 7, color: G.C.slate });
      G.UI.text(ctx, 'SCORE', 330, 32, { size: 7, color: G.C.slate });
      G.UI.text(ctx, 'W?', 396, 32, { size: 7, color: G.C.slate });

      let y = 46;
      this.entries.forEach((e, i) => {
        const rowCol = i === 0 ? G.C.yellow : i === 1 ? G.C.gray : i === 2 ? G.C.orange : G.C.white;
        G.UI.text(ctx, String(i + 1), 56, y, { size: 8, color: rowCol });
        G.UI.text(ctx, e.name, 76, y, { size: 8, color: e.name === 'BRIDGER' ? '#c0562f' : G.C.lime });
        G.UI.text(ctx, String(e.homesSold), 170, y, { size: 8, color: rowCol });
        G.UI.text(ctx, G.money(e.commission), 220, y, { size: 8, color: G.C.yellow });
        G.UI.text(ctx, e.score.toLocaleString('en-US'), 330, y, { size: 8, color: rowCol });
        G.UI.text(ctx, e.won ? 'W' : 'L', 396, y, { size: 8, color: e.won ? G.C.lime : G.C.red });
        y += 17;
      });
    }

    if (Math.floor(this.t * 2) % 2 === 0) {
      G.UI.text(ctx, '- PRESS ENTER FOR TITLE -', G.W / 2, G.H - 24, { align: 'center', size: 8, color: G.C.cyan });
    }
  },
});

</script>

window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('game');
  G.Engine.init(canvas);
  G.Engine.set('title');
