<script>
// ============================================================
// Bridger vs. Malcolm: Realtor Rivals
// utils.js - global namespace, math helpers, palette
// ============================================================
'use strict';

window.G = window.G || {};

// --- SNES-style 16 color palette (Sweetie-16) ---
G.C = {
  ink:    '#1a1c2c',
  purple: '#5d275d',
  red:    '#b13e53',
  orange: '#ef7d57',
  yellow: '#ffcd75',
  lime:   '#a7f070',
  green:  '#38b764',
  teal:   '#257179',
  navy:   '#29366f',
  blue:   '#3b5dc9',
  sky:    '#41a6f6',
  cyan:   '#73eff7',
  white:  '#f4f4f4',
  gray:   '#94b0c2',
  slate:  '#566c86',
  dusk:   '#333c57',
};

G.W = 480;
G.H = 270;

G.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
G.lerp = (a, b, t) => a + (b - a) * t;
G.rand = (lo, hi) => lo + Math.random() * (hi - lo);
G.randInt = (lo, hi) => Math.floor(G.rand(lo, hi + 1));
G.chance = (p) => Math.random() < p;
G.choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
G.shuffle = (arr) => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
G.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

// Weighted choice: items = [{weight, ...}]
G.weightedChoice = (items) => {
  const total = items.reduce((s, it) => s + (it.weight || 1), 0);
  let r = Math.random() * total;
  for (const it of items) {
    r -= (it.weight || 1);
    if (r <= 0) return it;
  }
  return items[items.length - 1];
};

// Money formatting: $1.2M / $850K / $6,750
G.money = (n) => {
  n = Math.round(n);
  if (Math.abs(n) >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (Math.abs(n) >= 10000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + n.toLocaleString('en-US');
};

G.pct = (n) => Math.round(n * 100) + '%';

// Simple timer/tween bookkeeping helper
G.Timer = class {
  constructor(duration) { this.t = 0; this.d = duration; this.done = false; }
  update(dt) {
    if (this.done) return true;
    this.t += dt;
    if (this.t >= this.d) { this.done = true; }
    return this.done;
  }
  get progress() { return G.clamp(this.t / this.d, 0, 1); }
  reset(d) { this.t = 0; this.done = false; if (d !== undefined) this.d = d; }
};

// Tiny particle system (confetti, cash, snow, sparkles)
G.Particles = class {
  constructor() { this.list = []; }
  spawn(x, y, opts = {}) {
    const n = opts.count || 8;
    for (let i = 0; i < n; i++) {
      this.list.push({
        x, y,
        vx: G.rand(opts.vxMin ?? -40, opts.vxMax ?? 40),
        vy: G.rand(opts.vyMin ?? -70, opts.vyMax ?? -20),
        g: opts.gravity ?? 120,
        life: G.rand(0.4, opts.life ?? 1.0),
        color: opts.colors ? G.choice(opts.colors) : G.C.yellow,
        size: opts.size ?? 2,
      });
    }
  }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.life -= dt;
      if (p.life <= 0) { this.list.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }
  render(ctx) {
    for (const p of this.list) {
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
  }
};

</script>
<script>
// ============================================================
// audio.js - WebAudio chiptune sound effects + tiny music loop
// ============================================================
'use strict';

G.Audio = {
  ctx: null,
  muted: false,
  musicOn: true,
  _musicTimer: null,
  _musicStep: 0,

  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  beep(freq, dur = 0.08, type = 'square', vol = 0.12, slide = 0) {
    if (this.muted) return;
    const ctx = this.ensure();
    if (!ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.linearRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  },

  seq(notes, step = 0.09, type = 'square', vol = 0.1) {
    if (this.muted) return;
    const ctx = this.ensure();
    if (!ctx) return;
    notes.forEach((f, i) => {
      if (!f) return;
      setTimeout(() => this.beep(f, step * 0.9, type, vol), i * step * 1000);
    });
  },

  // ---- Named SFX ----
  move()    { this.beep(520, 0.04, 'square', 0.06); },
  select()  { this.seq([660, 880], 0.06); },
  back()    { this.seq([440, 330], 0.06); },
  good()    { this.seq([523, 659, 784], 0.07, 'square', 0.1); },
  great()   { this.seq([523, 659, 784, 1047], 0.07, 'square', 0.12); },
  bad()     { this.seq([330, 262, 196], 0.09, 'sawtooth', 0.08); },
  cash()    { this.seq([988, 1319, 988, 1568], 0.05, 'square', 0.12); },
  ring()    { this.seq([880, 0, 880, 0, 880], 0.07, 'triangle', 0.1); },
  tick()    { this.beep(1200, 0.03, 'square', 0.05); },
  thud()    { this.beep(120, 0.12, 'sawtooth', 0.14, -60); },
  swoosh()  { this.beep(300, 0.15, 'sawtooth', 0.06, 500); },
  fanfare() { this.seq([523, 523, 523, 659, 784, 0, 784, 1047], 0.11, 'square', 0.12); },
  sadTromb(){ this.seq([392, 370, 349, 330], 0.22, 'sawtooth', 0.09); },
  ability() { this.seq([392, 523, 659, 784, 1047, 1319], 0.05, 'triangle', 0.12); },
  snow()    { this.beep(2000, 0.3, 'triangle', 0.03, -1500); },

  // ---- Tiny background loop (title/map). Two-channel arp + bass. ----
  MELODY: [
    523, 0, 659, 0, 784, 659, 523, 0,
    587, 0, 698, 0, 880, 698, 587, 0,
    523, 0, 659, 0, 784, 659, 1047, 0,
    988, 784, 659, 0, 523, 0, 0, 0,
  ],
  BASS: [
    131, 0, 0, 131, 175, 0, 0, 175,
    147, 0, 0, 147, 196, 0, 0, 196,
    131, 0, 0, 131, 175, 0, 0, 175,
    165, 0, 165, 0, 131, 0, 131, 0,
  ],

  startMusic() {
    if (this._musicTimer || !this.musicOn) return;
    const ctx = this.ensure();
    if (!ctx) return;
    this._musicStep = 0;
    this._musicTimer = setInterval(() => {
      if (this.muted || !this.musicOn) return;
      const i = this._musicStep % this.MELODY.length;
      const m = this.MELODY[i], b = this.BASS[i];
      if (m) this.beep(m, 0.1, 'square', 0.035);
      if (b) this.beep(b, 0.16, 'triangle', 0.06);
      this._musicStep++;
    }, 140);
  },

  stopMusic() {
    if (this._musicTimer) { clearInterval(this._musicTimer); this._musicTimer = null; }
  },

  toggleMute() {
    this.muted = !this.muted;
    if (!this.muted) this.select();
    return this.muted;
  },
};

</script>
<script>
// ============================================================
// input.js - keyboard + mouse (scaled to internal resolution)
// ============================================================
'use strict';

G.Input = {
  keys: {},        // currently held
  pressed: {},     // pressed this frame
  mouse: { x: -1, y: -1, down: false, clicked: false },
  anyKeyPressed: false,

  init(canvas) {
    this.canvas = canvas;

    window.addEventListener('keydown', (e) => {
      // avoid page scroll on game keys
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) {
        e.preventDefault();
      }
      const k = this.norm(e.key);
      if (!this.keys[k]) this.pressed[k] = true;
      this.keys[k] = true;
      this.anyKeyPressed = true;
      G.Audio.ensure(); // unlock audio on first gesture
    });

    window.addEventListener('keyup', (e) => {
      this.keys[this.norm(e.key)] = false;
    });

    const toGame = (e) => {
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left) / r.width * G.W,
        y: (e.clientY - r.top) / r.height * G.H,
      };
    };

    canvas.addEventListener('mousemove', (e) => {
      const p = toGame(e);
      this.mouse.x = p.x; this.mouse.y = p.y;
    });
    canvas.addEventListener('mousedown', (e) => {
      const p = toGame(e);
      this.mouse.x = p.x; this.mouse.y = p.y;
      this.mouse.down = true;
      this.mouse.clicked = true;
      G.Audio.ensure();
    });
    window.addEventListener('mouseup', () => { this.mouse.down = false; });

    // Touch support (mobile web)
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const p = toGame(t);
      this.mouse.x = p.x; this.mouse.y = p.y;
      this.mouse.down = true;
      this.mouse.clicked = true;
      G.Audio.ensure();
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      const p = toGame(t);
      this.mouse.x = p.x; this.mouse.y = p.y;
    }, { passive: false });
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      this.mouse.down = false;
    }, { passive: false });
  },

  norm(key) {
    if (key.length === 1) return key.toLowerCase();
    return key;
  },

  // convenience checks
  p(k) { return !!this.pressed[k]; },                       // pressed this frame
  held(k) { return !!this.keys[k]; },
  up()    { return this.p('ArrowUp') || this.p('w'); },
  down()  { return this.p('ArrowDown') || this.p('s'); },
  left()  { return this.p('ArrowLeft') || this.p('a'); },
  right() { return this.p('ArrowRight') || this.p('d'); },
  confirm() { return this.p('Enter') || this.p(' '); },
  cancel()  { return this.p('Escape') || this.p('Backspace'); },

  inRect(x, y, w, h) {
    return this.mouse.x >= x && this.mouse.x <= x + w &&
           this.mouse.y >= y && this.mouse.y <= y + h;
  },
  clickedRect(x, y, w, h) {
    return this.mouse.clicked && this.inRect(x, y, w, h);
  },

  endFrame() {
    this.pressed = {};
    this.mouse.clicked = false;
    this.anyKeyPressed = false;
  },
};

</script>

// ============================================================
// sprites.js - programmatic pixel art from string maps
// Each sprite: rows of chars; '.' = transparent, letters map to palette
// ============================================================
'use strict';

G.Sprites = {};

G.makeSprite = (rows, colors) => {
  const h = rows.length;
  const w = rows[0].length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.' || ch === ' ' || !colors[ch]) continue;
      c.fillStyle = colors[ch];
      c.fillRect(x, y, 1, 1);
    }
  }
  return cv;
};

// Draw a sprite scaled (integer scale keeps it crisp)
G.drawSprite = (ctx, sprite, x, y, scale = 1, flip = false) => {
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flip) {
    ctx.translate(Math.round(x) + sprite.width * scale, Math.round(y));
    ctx.scale(-scale, scale);
  } else {
    ctx.translate(Math.round(x), Math.round(y));
    ctx.scale(scale, scale);
  }
  ctx.drawImage(sprite, 0, 0);
  ctx.restore();
};

// ============================================================
// save.js - localStorage save/load + leaderboard
// ============================================================
'use strict';

G.Save = {
  KEY: 'realtorRivals.save.v1',
  LB_KEY: 'realtorRivals.leaderboard.v1',

  hasSave() {
    try { return !!localStorage.getItem(this.KEY); } catch (e) { return false; }
  },

  save(state) {
    try {
      localStorage.setItem(this.KEY, JSON.stringify({ v: 1, ts: Date.now(), state }));
      return true;
    } catch (e) { return false; }
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      return data.state || null;
    } catch (e) { return null; }
  },

  clear() {
    try { localStorage.removeItem(this.KEY); } catch (e) {}
  },

  // ---- Leaderboard ----
  getLeaderboard() {
    try {
      const raw = localStorage.getItem(this.LB_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  },

  addLeaderboardEntry(entry) {
    const lb = this.getLeaderboard();
    lb.push(entry);
    lb.sort((a, b) => b.score - a.score);
    const top = lb.slice(0, 10);
    try { localStorage.setItem(this.LB_KEY, JSON.stringify(top)); } catch (e) {}
    return top;
  },
};

<script>
// ============================================================
// state.js - game state, lead pipeline, action resolution,
//            rival AI, day/season progression
// ============================================================
'use strict';

G.State = {
  s: null, // current game state

  // ----------------------------------------------------------
  newGame(charId) {
    this.s = {
      charId,
      month: 0,        // 0..2
      dayOfMonth: 1,   // 1..daysPerMonth
      energy: G.Data.SEASON.baseEnergy,
      cash: 0,
      abilityUsed: false,
      leadSeq: 0,
      pendingBoss: false,
      bossIndex: 0,
      seasonOver: false,
      effects: { snowTomorrow: false },
      stats: {
        homesSold: 0, commission: 0, listings: 0, buyers: 0,
        referrals: 0, reviews: 5, followers: 120, happiness: 70,
        leadsReceived: 0, bossWins: 0,
      },
      rival: { homesSold: 0, commission: 0, followers: 150 },
      leads: [],
      upgrades: {},
      log: [],
    };
    // starting pipeline
    this.spawnLead('facebook');
    this.spawnLead('firsttime');
    this.spawnLead('signcall');
    this.spawnLead(this.char().id === 'malcolm' ? 'lakehome' : 'luxury');
    this.pushLog('Season started. Go get \'em!');
    return this.s;
  },

  loadGame() {
    const st = G.Save.load();
    if (st) this.s = st;
    return st;
  },

  autosave() { if (this.s && !this.s.seasonOver) G.Save.save(this.s); },

  // ----------------------------------------------------------
  char() { return G.Data.CHARACTERS[this.s.charId]; },
  rivalChar() { return G.Data.CHARACTERS[this.s.charId === 'malcolm' ? 'bridger' : 'malcolm']; },
  has(up) { return !!this.s.upgrades[up]; },
  maxEnergy() { return G.Data.SEASON.baseEnergy + (this.has('ai') ? 1 : 0); },
  totalDay() { return this.s.month * G.Data.SEASON.daysPerMonth + this.s.dayOfMonth; },
  totalDays() { return G.Data.SEASON.months.length * G.Data.SEASON.daysPerMonth; },
  monthName() { return G.Data.SEASON.months[this.s.month]; },

  pushLog(msg) {
    this.s.log.unshift(msg);
    if (this.s.log.length > 40) this.s.log.pop();
  },

  conversionRate() {
    const st = this.s.stats;
    return st.leadsReceived > 0 ? st.homesSold / st.leadsReceived : 0;
  },

  followerGainMult() {
    let m = 1;
    if (this.has('camera')) m *= 1.5;
    if (this.has('social')) m *= 2;
    return m;
  },

  // ----------------------------------------------------------
  // Leads
  // ----------------------------------------------------------
  spawnLead(typeId, opts = {}) {
    const s = this.s;
    let type;
    if (typeId) {
      type = G.Data.LEAD_TYPES.find(t => t.id === typeId);
    } else {
      const ch = this.char();
      const weighted = G.Data.LEAD_TYPES.map(t => ({
        ...t,
        weight: (t.weight || 1) * (t.lake ? ch.lakeLeadWeight : 1),
      }));
      type = G.weightedChoice(weighted);
    }
    let value = G.randInt(type.value[0], type.value[1]);
    if (type.luxury && this.char().luxuryValueBonus) {
      value = Math.round(value * (1 + this.char().luxuryValueBonus));
    }
    const lead = {
      id: ++s.leadSeq,
      name: G.choice(G.Data.LEAD_NAMES),
      type: type.id,
      label: type.label,
      seller: !!type.seller,
      lake: !!type.lake,
      luxury: !!type.luxury,
      value,
      warmth: G.clamp(type.warmth + G.randInt(-10, 10), 5, 95),
      stage: opts.stage || 'new',
      daysInStage: 0,
      issue: false,
      delay: 0,
      overpriced: false,
    };
    s.leads.push(lead);
    s.stats.leadsReceived++;
    return lead;
  },

  leadsInStage(...stages) {
    return this.s.leads.filter(l => stages.includes(l.stage));
  },

  // Most advanced lead first, warm ones preferred
  bestLead(leads) {
    const order = G.Data.STAGES;
    return leads.slice().sort((a, b) =>
      (order.indexOf(b.stage) - order.indexOf(a.stage)) || (b.warmth - a.warmth)
    )[0];
  },

  advance(lead, toStage) {
    lead.stage = toStage;
    lead.daysInStage = 0;
    if (toStage === 'active') {
      if (lead.seller) this.s.stats.listings++;
      else this.s.stats.buyers++;
    }
  },

  removeLead(lead) {
    const i = this.s.leads.indexOf(lead);
    if (i >= 0) this.s.leads.splice(i, 1);
  },

  // ----------------------------------------------------------
  // Action availability (so the menu can grey out useless picks)
  // ----------------------------------------------------------
  actionAvailable(id) {
    const s = this.s;
    const cost = this.actionCost(id);
    if (s.energy < cost) return { ok: false, reason: 'NO ENERGY' };
    switch (id) {
      case 'call': case 'text':
        return this.leadsInStage('new', 'hot').length
          ? { ok: true } : { ok: false, reason: 'NO NEW/WARM LEADS' };
      case 'followup':
        return this.leadsInStage('new', 'hot', 'appt').length
          ? { ok: true } : { ok: false, reason: 'NOBODY TO NUDGE' };
      case 'listing':
        return this.leadsInStage('appt').some(l => l.seller)
          ? { ok: true } : { ok: false, reason: 'NO SELLER APPTS' };
      case 'show':
        return this.leadsInStage('appt', 'active').some(l => !l.seller)
          ? { ok: true } : { ok: false, reason: 'NO BUYERS READY' };
      case 'offer':
        return this.offerReadyLeads().length
          ? { ok: true } : { ok: false, reason: 'NO CLIENTS READY' };
      case 'negotiate':
        return this.leadsInStage('offer').length
          ? { ok: true } : { ok: false, reason: 'NO OFFERS OUT' };
      case 'inspect':
        return this.leadsInStage('pending').some(l => l.issue)
          ? { ok: true } : { ok: false, reason: 'NO ISSUES FOUND' };
      case 'close':
        return this.closableLeads().length
          ? { ok: true } : { ok: false, reason: 'NOTHING TO CLOSE' };
      default:
        return { ok: true };
    }
  },

  actionCost(id) {
    const a = G.Data.ACTIONS.find(x => x.id === id);
    let cost = a ? a.energy : 1;
    if (id === 'openhouse' && this.has('vehicle')) cost = 1;
    return cost;
  },

  offerReadyLeads() {
    // buyers who found "the one" (active + toured a bit) or listings with buyer interest
    return this.leadsInStage('active').filter(l => {
      if (l.seller) {
        const wait = this.has('photographer') ? 0 : 1;
        return l.daysInStage >= wait + (l.overpriced ? 2 : 0);
      }
      return true;
    });
  },

  closableLeads() {
    return this.leadsInStage('pending').filter(l => !l.issue && l.delay <= 0 && l.daysInStage >= 1);
  },

  // ----------------------------------------------------------
  // Perform an action. score: 0..1 from a minigame (or null for instant)
  // Returns { lines: [], sold: n } for the results popup.
  // ----------------------------------------------------------
  performAction(id, score) {
    const s = this.s;
    const ch = this.char();
    s.energy -= this.actionCost(id);
    const lines = [];
    let sold = 0;

    const grade = (sc) => sc >= 0.85 ? 'PERFECT!' : sc >= 0.6 ? 'GREAT!' : sc >= 0.35 ? 'OKAY.' : 'ROUGH...';

    switch (id) {
      case 'call': {
        const targets = this.leadsInStage('new', 'hot');
        const n = Math.min(targets.length, Math.round(score * 3.4));
        lines.push(grade(score) + ' You worked the phones.');
        const picked = G.shuffle(targets).slice(0, Math.max(n, 0));
        for (const l of picked) {
          l.warmth = G.clamp(l.warmth + 20, 0, 100);
          if (l.stage === 'new') { this.advance(l, 'hot'); lines.push(l.name + ' warmed up! (' + l.label + ')'); }
          else { this.advance(l, 'appt'); lines.push(l.name + ' booked an appointment!'); }
        }
        if (!picked.length) lines.push('Straight to voicemail. All of them. Brutal.');
        break;
      }

      case 'text': {
        const targets = this.leadsInStage('new', 'hot');
        for (const l of targets) l.warmth = G.clamp(l.warmth + Math.round(15 * score), 0, 100);
        const n = Math.min(targets.length, score >= 0.8 ? 2 : score >= 0.45 ? 1 : 0);
        lines.push(grade(score) + ' Thumbs of fury engaged.');
        const picked = G.shuffle(targets).slice(0, n);
        for (const l of picked) {
          if (l.stage === 'new') { this.advance(l, 'hot'); lines.push(l.name + ' replied with 3 emojis. Warm!'); }
          else { this.advance(l, 'appt'); lines.push(l.name + ' set an appointment by text!'); }
        }
        break;
      }

      case 'followup': {
        const targets = this.leadsInStage('new', 'hot', 'appt');
        for (const l of targets) l.warmth = G.clamp(l.warmth + 10, 0, 100);
        s.stats.happiness = G.clamp(s.stats.happiness + 2, 0, 100);
        lines.push(G.choice(G.Data.FLAVOR.followup));
        lines.push('Your whole pipeline feels appreciated. (+warmth)');
        const hot = this.leadsInStage('hot');
        if (hot.length && G.chance(0.3 + (this.has('crm') ? 0.2 : 0))) {
          const l = this.bestLead(hot);
          this.advance(l, 'appt');
          lines.push(l.name + ' says "ope, yeah, let\'s meet!"');
        }
        break;
      }

      case 'openhouse': {
        let count = Math.round(score * 4) + (this.has('marketing') ? 1 : 0);
        count = G.clamp(count, 0, 6);
        lines.push(grade(score) + ' The open house wrapped up.');
        for (let i = 0; i < count; i++) {
          const l = this.spawnLead(G.chance(0.7) ? 'openhouse' : null);
          lines.push('+ NEW LEAD: ' + l.name + ' (' + l.label + ')');
        }
        if (!count) lines.push('Only visitor was a neighbor who "just loves floor plans."');
        s.stats.followers += Math.round(20 * score * this.followerGainMult());
        // buyer interest in your listings
        const listings = this.leadsInStage('active').filter(l => l.seller);
        if (listings.length && score > 0.5 && G.chance(0.5)) {
          const l = this.bestLead(listings);
          this.advance(l, 'offer');
          lines.push('An open house guest wrote an offer on ' + l.name + '\'s place!');
        }
        break;
      }

      case 'video': {
        const gain = Math.round((80 + 420 * score) * this.followerGainMult());
        s.stats.followers += gain;
        lines.push(grade(score) + ' Video posted: "' + G.choice([
          'TOP 5 LAKES THAT SLAP', 'THIS CABIN HAS A SECRET...', 'POV: YOU OWN A DOCK',
          'WE FOUND THE CHEAPEST HOUSE IN TOWN', 'ICE FISHING HOUSE TOUR (YES REALLY)',
        ]) + '"');
        lines.push('+' + gain + ' FOLLOWERS');
        const leadChance = score * (this.has('social') ? 0.9 : 0.6);
        if (G.chance(leadChance)) {
          const l = this.spawnLead(G.chance(0.5) ? 'facebook' : null);
          lines.push('+ NEW LEAD: ' + l.name + ' saw the video!');
        }
        if (score >= 0.9 && G.chance(0.5)) {
          const extra = Math.round(600 * this.followerGainMult());
          s.stats.followers += extra;
          lines.push('IT\'S TRENDING LOCALLY! +' + extra + ' bonus followers!');
        }
        break;
      }

      case 'listing': {
        const sellers = this.leadsInStage('appt').filter(l => l.seller);
        const l = this.bestLead(sellers);
        const bonus = ch.listingBonus + (this.has('drone') ? 0.15 : 0);
        if (score + bonus >= 0.5) {
          this.advance(l, 'active');
          if (this.has('drone')) l.value = Math.round(l.value * 1.1);
          lines.push(grade(G.clamp(score + bonus, 0, 1)) + ' LISTING TAKEN!');
          lines.push(l.name + ' listed at ' + G.money(l.value) + '.');
          lines.push('They loved the ' + G.choice(['drone footage', 'comp analysis', 'firm handshake', 'laminated flyers']) + '.');
        } else {
          l.warmth = G.clamp(l.warmth - 10, 0, 100);
          lines.push('ROUGH... ' + l.name + ' said they "wanna think about it."');
          lines.push('(Try again - they\'re still at appointment stage.)');
        }
        break;
      }

      case 'show': {
        let buyers = this.leadsInStage('active', 'appt').filter(l => !l.seller);
        buyers.sort((a, b) => (a.stage === 'active' ? -1 : 1) - (b.stage === 'active' ? -1 : 1));
        const howMany = this.has('assistant') ? 2 : 1;
        const picked = buyers.slice(0, howMany);
        lines.push(grade(score) + ' Tour day!');
        for (const l of picked) {
          if (l.stage === 'appt') {
            if (score >= 0.35) {
              this.advance(l, 'active');
              lines.push(l.name + ' is now YOUR buyer client!');
            } else {
              lines.push(l.name + ' "didn\'t vibe with the carpet." Still at appt.');
            }
          } else if (score >= 0.55) {
            this.advance(l, 'offer');
            lines.push(l.name + ' FOUND THE ONE! (' + G.choice([
              'It was the hot tub.', 'The garage fits the boat AND the wheeler.',
              'A bald eagle flew by during the tour. Done deal.', 'Granite. Countertops.',
            ]) + ')');
          } else {
            l.warmth = G.clamp(l.warmth + 5, 0, 100);
            lines.push(l.name + ' wants to see "just a few more."');
          }
        }
        break;
      }

      case 'offer': {
        const ready = this.offerReadyLeads();
        const l = this.bestLead(ready);
        this.advance(l, 'offer');
        lines.push(G.choice(G.Data.FLAVOR.offer));
        lines.push(l.name + ' (' + G.money(l.value) + ') is now UNDER OFFER.');
        break;
      }

      case 'negotiate': {
        const offers = this.leadsInStage('offer');
        const l = this.bestLead(offers);
        const power = G.clamp(score + ch.negotiateBonus, 0, 1);
        if (power >= 0.45) {
          this.advance(l, 'pending');
          if (power >= 0.8) {
            l.value = Math.round(l.value * 1.05);
            lines.push('MASTERCLASS. Deal agreed ABOVE asking: ' + G.money(l.value) + '!');
          } else {
            lines.push('Deal agreed! ' + l.name + ' at ' + G.money(l.value) + ' is PENDING.');
          }
          const issueChance = l.overpriced ? 0.5 : 0.3;
          if (G.chance(issueChance) && !(this.has('tc') && G.chance(0.5))) {
            l.issue = true;
            lines.push('...but the inspection flagged ' + G.choice([
              'a mystery switch that does nothing', 'squirrels with a lease',
              'a roof "older than disco"', '"moisture concerns" (it\'s Minnesota)',
            ]) + '. Fix it before closing!');
          }
        } else {
          l.warmth = G.clamp(l.warmth - 5, 0, 100);
          lines.push('The other side didn\'t budge. Deal still at OFFER stage.');
          lines.push(G.choice(['They countered with "no."', 'Their agent quoted a podcast.', 'They want the fish house excluded. Bold.']));
        }
        break;
      }

      case 'inspect': {
        const issues = this.leadsInStage('pending').filter(l => l.issue);
        const l = this.bestLead(issues);
        if (score >= 0.4) {
          l.issue = false;
          lines.push(grade(score) + ' Issues fixed on ' + l.name + '\'s deal!');
          lines.push('The inspector nodded approvingly. High praise.');
        } else {
          lines.push('The repair guy "can maybe swing by Thursday." Issue remains.');
        }
        break;
      }

      case 'close': {
        const list = this.closableLeads();
        const howMany = this.has('tc') ? 2 : 1;
        const toClose = list.slice(0, howMany);
        for (const l of toClose) {
          this.advance(l, 'closed');
          const comm = Math.round(l.value * 0.027);
          s.stats.homesSold++;
          s.stats.commission += comm;
          s.cash += comm;
          sold++;
          lines.push('SOLD! ' + l.name + ' - ' + G.money(l.value) + ' (+' + G.money(comm) + ' commission)');
          s.stats.happiness = G.clamp(s.stats.happiness + 4, 0, 100);
          if (G.chance(0.5)) { s.stats.reviews++; lines.push('+ 5-STAR REVIEW: "' + G.choice([
            'Sold our place in a weekend, dontcha know!', 'Best agent north of Brainerd.',
            'They brought bars to closing. BARS.', '10/10 would house again.',
          ]) + '"'); }
          if (G.chance(0.35 + s.stats.happiness / 400)) {
            const r = this.spawnLead('referral');
            s.stats.referrals++;
            lines.push('+ REFERRAL: they told ' + r.name + ' about you!');
          }
          this.removeLead(l); // keep list tidy; stats carry the record
        }
        lines.unshift(G.choice(G.Data.FLAVOR.close));
        break;
      }
    }

    return { lines, sold };
  },

  // ----------------------------------------------------------
  // Special ability (once per day)
  // ----------------------------------------------------------
  useAbility() {
    const s = this.s;
    if (s.abilityUsed) return null;
    s.abilityUsed = true;
    const lines = [];
    if (s.charId === 'malcolm') {
      const gain = Math.round(G.randInt(300, 800) * this.followerGainMult());
      s.stats.followers += gain;
      const n = G.randInt(2, 4);
      lines.push('VIRAL VIDEO! "' + G.choice([
        'AGENT RATES EVERY LAKE (PART 7)', 'I SLEPT IN AN ICE HOUSE FOR A LISTING',
        'THE LOON CALL CHALLENGE', 'SELLING A HOUSE IN -30 (GONE WRONG)',
      ]) + '"');
      lines.push('+' + gain + ' FOLLOWERS!');
      for (let i = 0; i < n; i++) {
        const l = this.spawnLead(G.chance(0.4) ? 'lakehome' : 'facebook');
        lines.push('+ LEAD: ' + l.name + ' - "saw your video, had to call!"');
      }
    } else {
      // Bridger: advance the best advanceable lead one stage
      const pick =
        this.bestLead(this.leadsInStage('pending').filter(l => l.issue)) ||
        this.bestLead(this.leadsInStage('offer')) ||
        this.bestLead(this.offerReadyLeads()) ||
        this.bestLead(this.leadsInStage('appt')) ||
        this.bestLead(this.leadsInStage('hot')) ||
        this.bestLead(this.leadsInStage('new'));
      lines.push('POWER CLOSE! Bridger straightens his tie...');
      if (!pick) {
        lines.push('...but there was nobody to close. He closed a car door, powerfully.');
      } else if (pick.stage === 'pending' && pick.issue) {
        pick.issue = false;
        lines.push('He talked the buyer PAST the inspection report. Issue waived!');
      } else {
        const next = { new: 'hot', hot: 'appt', appt: 'active', active: 'offer', offer: 'pending' }[pick.stage];
        this.advance(pick, next);
        lines.push(pick.name + ' never stood a chance. Now: ' + G.Data.STAGE_LABELS[next] + '.');
      }
    }
    G.Audio.ability();
    return { lines };
  },

  // ----------------------------------------------------------
  // Upgrades
  // ----------------------------------------------------------
  buyUpgrade(id) {
    const up = G.Data.UPGRADES.find(u => u.id === id);
    if (!up || this.has(id) || this.s.cash < up.cost) return false;
    this.s.cash -= up.cost;
    this.s.upgrades[id] = true;
    if (id === 'ai') this.s.energy = Math.min(this.s.energy + 1, this.maxEnergy());
    this.pushLog('Bought ' + up.name + '!');
    return true;
  },

  // ----------------------------------------------------------
  // End of day: aging, passive leads, rival AI, random events
  // Returns { eventText, eventGood, rivalLines, passiveLines, bossTime, seasonOver }
  // ----------------------------------------------------------
  endDay() {
    const s = this.s;
    const passiveLines = [];

    // 1. age leads, ghosting
    for (const l of s.leads.slice()) {
      l.daysInStage++;
      if (l.delay > 0) l.delay--;
      if (!this.has('crm') && (l.stage === 'new' || l.stage === 'hot') && l.daysInStage > 3 && G.chance(0.35)) {
        this.removeLead(l);
        passiveLines.push(l.name + ' ghosted you (they ' + G.choice(G.Data.FLAVOR.ghostReasons) + ').');
      }
    }
    if (this.has('crm')) {
      for (const l of this.leadsInStage('new', 'hot')) l.warmth = G.clamp(l.warmth + 5, 0, 100);
    }

    // 2. passive lead sources
    if (this.has('website') && G.chance(0.35)) {
      const l = this.spawnLead('zestimate');
      passiveLines.push('WEBSITE LEAD: ' + l.name + ' filled out your contact form!');
    }
    if (this.has('marketing') && G.chance(0.35)) {
      const l = this.spawnLead();
      passiveLines.push('AD LEAD: ' + l.name + ' saw your billboard by the DQ!');
    }
    if (G.chance(0.2 + s.stats.followers / 20000)) {
      const l = this.spawnLead();
      passiveLines.push('NEW LEAD: ' + l.name + ' (' + l.label + ') reached out!');
    }

    // 3. photographer: listings attract offers passively
    if (this.has('photographer')) {
      for (const l of this.leadsInStage('active').filter(x => x.seller && x.daysInStage >= 2)) {
        if (G.chance(0.4)) {
          this.advance(l, 'offer');
          passiveLines.push('Those pro photos worked: an offer came in on ' + l.name + '\'s place!');
        }
      }
    }

    // 4. rival AI
    const rivalLines = [];
    const rc = this.rivalChar();
    const closeChance = 0.42 + s.month * 0.1;
    let rivalCloses = G.chance(closeChance) ? 1 : 0;
    if (G.chance(0.08)) rivalCloses++;
    for (let i = 0; i < rivalCloses; i++) {
      const val = G.randInt(150000, s.month === 2 ? 600000 : 420000);
      s.rival.homesSold++;
      s.rival.commission += Math.round(val * 0.027);
      rivalLines.push(rc.name + ' closed a ' + G.money(val) + ' sale' + G.choice([
        '. Ugh.', ' and posted about it. Twice.', '. The nerve.', ' with a SOLD selfie.', '.',
      ]));
    }
    s.rival.followers += G.randInt(20, 120);
    if (!rivalCloses && G.chance(0.5)) {
      rivalLines.push(rc.name + ' ' + G.choice([
        'spent all day arguing in a Facebook group.', 'got a flat tire on the logging road.',
        'is "rebranding." Again.', 'held an open house. One guy came for the cookies.',
        'left a voicemail 4 minutes long.',
      ]));
    }

    // 5. random event
    let eventText = null, eventGood = null;
    if (G.chance(0.6)) {
      if (G.chance(0.5)) {
        const ev = G.choice(G.Data.OBSTACLES);
        const extra = this.applyEventFx(ev.fx);
        if (extra !== false) { eventText = ev.text + (extra ? ' ' + extra : ''); eventGood = false; }
      } else {
        const ev = G.choice(G.Data.FUNNY_EVENTS);
        const extra = this.applyEventFx(ev.fx);
        if (extra !== false) { eventText = ev.text + (extra ? ' ' + extra : ''); eventGood = true; }
      }
    }

    // 6. advance calendar
    let bossTime = false;
    s.dayOfMonth++;
    if (s.dayOfMonth > G.Data.SEASON.daysPerMonth) {
      bossTime = true;
      s.pendingBoss = true;
    }

    // 7. reset energy
    s.energy = this.maxEnergy() - (s.effects.snowTomorrow ? 1 : 0);
    if (s.effects.snowTomorrow) passiveLines.push('You lost an hour shoveling the driveway. (-1 energy)');
    s.effects.snowTomorrow = false;
    s.abilityUsed = false;

    this.autosave();
    return { eventText, eventGood, rivalLines, passiveLines, bossTime };
  },

  // Returns extra text ('' ok), or false if the event fizzled (no valid target)
  applyEventFx(fx) {
    const s = this.s;
    switch (fx) {
      case 'inspectionIssue': {
        const t = this.leadsInStage('pending').filter(l => !l.issue);
        if (!t.length) return false;
        G.choice(t).issue = true;
        return '';
      }
      case 'lowAppraisal': {
        const t = this.leadsInStage('offer', 'pending');
        if (!t.length) return false;
        const l = G.choice(t);
        l.value = Math.round(l.value * 0.9);
        return '(' + l.name + ' now ' + G.money(l.value) + ')';
      }
      case 'financeDelay': {
        const t = this.leadsInStage('pending');
        if (!t.length) return false;
        G.choice(t).delay = 2;
        return '';
      }
      case 'snowstorm':
        s.effects.snowTomorrow = true;
        return '';
      case 'badReview':
        s.stats.reviews = Math.max(0, s.stats.reviews - 1);
        s.stats.happiness = G.clamp(s.stats.happiness - 5, 0, 100);
        return '';
      case 'ghostLead': {
        const t = this.leadsInStage('new', 'hot', 'appt');
        if (!t.length) return false;
        const l = G.choice(t);
        this.removeLead(l);
        return '(RIP ' + l.name + ')';
      }
      case 'stolenDeal': {
        const t = this.leadsInStage('offer');
        if (!t.length) return false;
        const l = G.choice(t);
        this.removeLead(l);
        s.rival.homesSold++;
        s.rival.commission += Math.round(l.value * 0.027);
        return '(' + l.name + ' - gone!)';
      }
      case 'rateJump':
        for (const l of s.leads) if (!l.seller && l.stage !== 'closed') l.value = Math.round(l.value * 0.95);
        return '';
      case 'coldFeet': {
        const t = this.leadsInStage('pending');
        if (!t.length) return false;
        const l = G.choice(t);
        this.advance(l, 'offer');
        return '(' + l.name + ' back to offer stage)';
      }
      case 'greedySeller': {
        const t = this.leadsInStage('active').filter(l => l.seller && !l.overpriced);
        if (!t.length) return false;
        const l = G.choice(t);
        l.overpriced = true;
        l.value = Math.round(l.value * 1.2);
        return '(' + l.name + ' at ' + G.money(l.value) + ' now. Good luck.)';
      }
      // funny (good) events
      case 'happy5': s.stats.happiness = G.clamp(s.stats.happiness + 5, 0, 100); return '';
      case 'happy10': s.stats.happiness = G.clamp(s.stats.happiness + 10, 0, 100); return '';
      case 'hotTub': {
        const t = this.leadsInStage('active', 'appt').filter(l => !l.seller);
        if (!t.length) return false;
        const l = this.bestLead(t);
        if (l.stage === 'appt') this.advance(l, 'active');
        this.advance(l, 'offer');
        return '(' + l.name + ' jumped to OFFER!)';
      }
      case 'sellerLead': this.spawnLead(G.chance(0.5) ? 'fsbo' : 'expired'); return '';
      case 'deerVideo': {
        const gain = Math.round(200 * this.followerGainMult());
        s.stats.followers += gain;
        return '(+' + gain + ' followers)';
      }
      case 'fishBiting':
        for (const l of s.leads) if (l.lake) l.warmth = G.clamp(l.warmth + 15, 0, 100);
        return '';
      case 'wrongViral': {
        const gain = Math.round(400 * this.followerGainMult());
        s.stats.followers += gain;
        s.stats.reviews = Math.max(0, s.stats.reviews - 1);
        return '(+' + gain + ' followers, -1 review)';
      }
      case 'videoLead': {
        const l = this.spawnLead('facebook');
        l.warmth = 80;
        l.stage = 'hot';
        return '(' + l.name + ' is HOT)';
      }
      case 'referralLead': {
        this.spawnLead('referral');
        s.stats.referrals++;
        return '';
      }
    }
    return '';
  },

  // ----------------------------------------------------------
  // Boss resolution
  // ----------------------------------------------------------
  currentBoss() { return G.Data.BOSSES[Math.min(this.s.bossIndex, G.Data.BOSSES.length - 1)]; },

  resolveBoss(won) {
    const s = this.s;
    const boss = this.currentBoss();
    const lines = [];
    if (won) {
      s.stats.bossWins++;
      s.cash += boss.reward.cash;
      s.stats.commission += boss.reward.cash;
      s.stats.followers += Math.round(boss.reward.followers * this.followerGainMult());
      for (let i = 0; i < boss.reward.leads; i++) this.spawnLead();
      s.stats.happiness = G.clamp(s.stats.happiness + 8, 0, 100);
      lines.push('YOU BEAT ' + boss.name + '!');
      lines.push('+' + G.money(boss.reward.cash) + ' bonus, +' + boss.reward.leads + ' leads, +followers!');
    } else {
      s.rival.homesSold++;
      s.stats.happiness = G.clamp(s.stats.happiness - 6, 0, 100);
      lines.push(boss.name + ' takes the round...');
      lines.push('They win a listing you wanted. It stings.');
    }
    // advance month
    s.pendingBoss = false;
    s.bossIndex++;
    s.month++;
    s.dayOfMonth = 1;
    if (s.month >= G.Data.SEASON.months.length) {
      s.seasonOver = true;
      G.Save.clear();
    } else {
      this.autosave();
    }
    return { lines, seasonOver: s.seasonOver };
  },

  // ----------------------------------------------------------
  // Scoring
  // ----------------------------------------------------------
  seasonScore() {
    const st = this.s.stats;
    return Math.round(
      st.homesSold * 1000 +
      st.commission / 100 +
      st.reviews * 50 +
      st.followers / 10 +
      st.happiness * 10 +
      st.bossWins * 750 +
      st.referrals * 100
    );
  },

  playerWon() { return this.s.stats.homesSold > this.s.rival.homesSold; },
  tied() { return this.s.stats.homesSold === this.s.rival.homesSold; },
};

</script>
<script>
// ============================================================
// ui.js - text, panels, menus, popups
// ============================================================
'use strict';

G.UI = {
  // Crisp-ish retro text
  text(ctx, str, x, y, opts = {}) {
    const size = opts.size || 8;
    ctx.font = (opts.bold === false ? '' : 'bold ') + size + 'px monospace';
    ctx.textAlign = opts.align || 'left';
    ctx.textBaseline = opts.baseline || 'top';
    if (opts.shadow) {
      ctx.fillStyle = opts.shadow === true ? G.C.ink : opts.shadow;
      ctx.fillText(str, Math.round(x) + 1, Math.round(y) + 1);
    }
    ctx.fillStyle = opts.color || G.C.white;
    ctx.fillText(str, Math.round(x), Math.round(y));
  },

  measure(ctx, str, size = 8, bold = true) {
    ctx.font = (bold ? 'bold ' : '') + size + 'px monospace';
    return ctx.measureText(str).width;
  },

  // Word-wrap text into lines that fit maxWidth
  wrap(ctx, str, maxWidth, size = 8) {
    ctx.font = 'bold ' + size + 'px monospace';
    const words = String(str).split(' ');
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && cur) {
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  },

  panel(ctx, x, y, w, h, opts = {}) {
    ctx.fillStyle = opts.bg || G.C.navy;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = opts.border || G.C.white;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (opts.title) {
      ctx.fillStyle = opts.titleBg || G.C.blue;
      ctx.fillRect(x + 1, y + 1, w - 2, 11);
      this.text(ctx, opts.title, x + w / 2, y + 3, { align: 'center', color: opts.titleColor || G.C.white });
    }
  },

  // Progress/stat bar
  bar(ctx, x, y, w, h, pct, color, bg) {
    ctx.fillStyle = bg || G.C.dusk;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color || G.C.green;
    ctx.fillRect(x, y, Math.round(w * G.clamp(pct, 0, 1)), h);
    ctx.strokeStyle = G.C.ink;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  },

  button(ctx, label, x, y, w, h, opts = {}) {
    const hover = G.Input.inRect(x, y, w, h);
    const active = opts.selected || hover;
    ctx.fillStyle = opts.disabled ? G.C.dusk : (active ? (opts.hoverBg || G.C.blue) : (opts.bg || G.C.navy));
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = active && !opts.disabled ? G.C.yellow : G.C.slate;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    this.text(ctx, label, x + w / 2, y + (h - (opts.size || 8)) / 2, {
      align: 'center',
      size: opts.size || 8,
      color: opts.disabled ? G.C.slate : (active ? G.C.white : (opts.color || G.C.gray)),
    });
    return !opts.disabled && G.Input.clickedRect(x, y, w, h);
  },
};

// ------------------------------------------------------------
// Keyboard/mouse menu
// items: [{label, disabled, note, data}]
// ------------------------------------------------------------
G.Menu = class {
  constructor(items, opts = {}) {
    this.items = items;
    this.index = 0;
    this.x = opts.x || 0; this.y = opts.y || 0;
    this.w = opts.w || 140; this.rowH = opts.rowH || 13;
    this.onSelect = opts.onSelect || (() => {});
    this.skipDisabled(1);
  }

  skipDisabled(dir) {
    let guard = 0;
    while (this.items[this.index] && this.items[this.index].disabled && guard++ < this.items.length) {
      this.index = (this.index + dir + this.items.length) % this.items.length;
    }
  }

  update() {
    const I = G.Input;
    if (I.up())   { this.index = (this.index - 1 + this.items.length) % this.items.length; this.skipDisabled(-1); G.Audio.move(); }
    if (I.down()) { this.index = (this.index + 1) % this.items.length; this.skipDisabled(1); G.Audio.move(); }
    if (I.confirm()) {
      const it = this.items[this.index];
      if (it && !it.disabled) { G.Audio.select(); this.onSelect(it, this.index); }
      else G.Audio.bad();
    }
    // mouse
    for (let i = 0; i < this.items.length; i++) {
      const ry = this.y + i * this.rowH;
      if (I.inRect(this.x, ry, this.w, this.rowH - 1)) {
        if (I.mouse.x !== this._lastMx || I.mouse.y !== this._lastMy) this.index = i;
        if (I.mouse.clicked) {
          const it = this.items[i];
          if (it && !it.disabled) { this.index = i; G.Audio.select(); this.onSelect(it, i); }
          else G.Audio.bad();
        }
      }
    }
    this._lastMx = I.mouse.x; this._lastMy = I.mouse.y;
  }

  render(ctx) {
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      const ry = this.y + i * this.rowH;
      const sel = i === this.index;
      if (sel && !it.disabled) {
        ctx.fillStyle = G.C.blue;
        ctx.fillRect(this.x, ry, this.w, this.rowH - 1);
      }
      G.UI.text(ctx, (sel ? '>' : ' ') + it.label, this.x + 3, ry + 2, {
        color: it.disabled ? G.C.slate : (sel ? G.C.white : G.C.gray),
      });
      if (it.note) {
        G.UI.text(ctx, it.note, this.x + this.w - 3, ry + 2, {
          align: 'right', size: 7,
          color: it.disabled ? G.C.slate : G.C.yellow,
        });
      }
    }
  }
};

// ------------------------------------------------------------
// Modal popup with wrapped lines; closes on confirm/click.
// Use: G.Popup.show({title, lines, color, onClose})
// ------------------------------------------------------------
G.Popup = {
  active: null,
  queue: [],

  show(opts) {
    if (this.active) { this.queue.push(opts); return; }
    this.active = opts;
    this.t = 0;
  },

  update(dt) {
    if (!this.active) return false;
    this.t = (this.t || 0) + dt;
    if (this.t > 0.25 && (G.Input.confirm() || G.Input.cancel() || G.Input.mouse.clicked)) {
      const closed = this.active;
      this.active = null;
      G.Audio.select();
      if (closed.onClose) closed.onClose();
      if (this.queue.length) this.show(this.queue.shift());
    }
    return true; // popup consumed input this frame
  },

  render(ctx) {
    if (!this.active) return;
    const o = this.active;
    ctx.fillStyle = 'rgba(26,28,44,0.75)';
    ctx.fillRect(0, 0, G.W, G.H);

    const w = o.w || 320;
    // pre-wrap lines
    const wrapped = [];
    for (const line of (o.lines || [])) {
      for (const l of G.UI.wrap(ctx, line, w - 24)) wrapped.push(l);
    }
    const h = 40 + wrapped.length * 10 + (o.sprite ? 40 : 0);
    const x = (G.W - w) / 2;
    const y = G.clamp((G.H - h) / 2, 8, G.H);

    G.UI.panel(ctx, x, y, w, h, {
      title: o.title || 'NOTICE',
      titleBg: o.color || G.C.blue,
      bg: G.C.ink,
    });

    let ty = y + 18;
    if (o.sprite && G.Sprites[o.sprite]) {
      G.drawSprite(ctx, G.Sprites[o.sprite], x + w / 2 - 16, ty, 2);
      ty += 38;
    }
    for (const l of wrapped) {
      G.UI.text(ctx, l, x + 12, ty, { color: o.textColor || G.C.white });
      ty += 10;
    }
    if ((this.t || 0) > 0.25 && Math.floor(this.t * 2) % 2 === 0) {
      G.UI.text(ctx, '- PRESS ENTER -', x + w / 2, y + h - 12, { align: 'center', size: 7, color: G.C.yellow });
    }
  },
};

</script>
<script>
// ============================================================
// engine.js - game loop, scene manager, transitions
// ============================================================
'use strict';

G.Engine = {
  scenes: {},
  current: null,
  currentName: '',
  fade: 0,          // 1 = black
  fadeDir: 0,       // -1 fading in, +1 fading out
  pendingScene: null,
  shake: 0,
  time: 0,

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    G.Input.init(canvas);
    this.resize();
    window.addEventListener('resize', () => this.resize());

    let last = performance.now();
    const frame = (now) => {
      let dt = (now - last) / 1000;
      last = now;
      dt = Math.min(dt, 0.05);
      this.time += dt;
      this.update(dt);
      this.render();
      G.Input.endFrame();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  },

  resize() {
    const scale = Math.max(1, Math.floor(Math.min(
      window.innerWidth / G.W, window.innerHeight / G.H
    )));
    this.canvas.style.width = (G.W * scale) + 'px';
    this.canvas.style.height = (G.H * scale) + 'px';
  },

  register(name, scene) { this.scenes[name] = scene; },

  // Fade out, switch, fade in
  goto(name, params) {
    if (this.pendingScene) return;
    this.pendingScene = { name, params };
    this.fadeDir = 1;
  },

  // Instant switch (used at boot)
  set(name, params) {
    if (this.current && this.current.exit) this.current.exit();
    this.current = this.scenes[name];
    this.currentName = name;
    if (this.current.enter) this.current.enter(params);
    this.fade = 1;
    this.fadeDir = -1;
  },

  update(dt) {
    // global keys
    if (G.Input.p('m')) {
      const muted = G.Audio.toggleMute();
      if (muted) G.Audio.stopMusic(); else G.Audio.startMusic();
    }

    // fade transitions
    if (this.fadeDir !== 0) {
      this.fade = G.clamp(this.fade + this.fadeDir * dt * 4, 0, 1);
      if (this.fade >= 1 && this.pendingScene) {
        const p = this.pendingScene;
        this.pendingScene = null;
        this.set(p.name, p.params);
      } else if (this.fade <= 0) {
        this.fadeDir = 0;
      }
    }

    this.shake = Math.max(0, this.shake - dt * 30);

    // popups eat input
    if (G.Popup.update(dt)) return;

    if (this.current && this.current.update && this.fadeDir === 0) {
      this.current.update(dt);
    }
  },

  render() {
    const ctx = this.ctx;
    ctx.save();
    if (this.shake > 0) {
      ctx.translate(G.randInt(-2, 2), G.randInt(-2, 2));
    }
    ctx.fillStyle = G.C.ink;
    ctx.fillRect(-4, -4, G.W + 8, G.H + 8);

    if (this.current && this.current.render) this.current.render(ctx);

    ctx.restore();

    G.Popup.render(ctx);

    // mute indicator
    if (G.Audio.muted) {
      G.UI.text(ctx, 'MUTED [M]', G.W - 4, G.H - 10, { align: 'right', size: 7, color: G.C.slate });
    }

    if (this.fade > 0) {
      ctx.fillStyle = 'rgba(26,28,44,' + this.fade + ')';
      ctx.fillRect(0, 0, G.W, G.H);
    }
  },
};

</script>

'use strict';

G.Engine.register('title', {
  enter() {
    this.t = 0;
    this.snow = [];
    for (let i = 0; i < 40; i++) {
      this.snow.push({ x: G.rand(0, G.W), y: G.rand(0, G.H), v: G.rand(8, 25), drift: G.rand(-6, 6) });
    }
    this.buildMenu();
    G.Audio.startMusic();
  },

  buildMenu() {
    const items = [{ label: 'NEW SEASON', id: 'new' }];
    if (G.Save.hasSave()) items.push({ label: 'CONTINUE', id: 'continue' });
    items.push({ label: 'HOW TO PLAY', id: 'howto' });
    items.push({ label: 'LEADERBOARD', id: 'leaderboard' });
    this.menu = new G.Menu(items, {
      x: G.W / 2 - 60, y: 172, w: 120, rowH: 15,
      onSelect: (it) => {
        if (it.id === 'new') G.Engine.goto('select');
        if (it.id === 'continue') {
          if (G.State.loadGame()) G.Engine.goto('map');
          else { G.Audio.bad(); this.buildMenu(); }
        }
        if (it.id === 'howto') G.Engine.goto('howto');
        if (it.id === 'leaderboard') G.Engine.goto('leaderboard');
      },
    });
  },

  update(dt) {
    this.t += dt;
    for (const s of this.snow) {
      s.y += s.v * dt;
      s.x += s.drift * dt;
      if (s.y > G.H) { s.y = -2; s.x = G.rand(0, G.W); }
    }
    this.menu.update();
  },

  render(ctx) {
    // night sky gradient bands
    ctx.fillStyle = G.C.ink; ctx.fillRect(0, 0, G.W, 120);
    ctx.fillStyle = G.C.navy; ctx.fillRect(0, 120, G.W, 60);
    ctx.fillStyle = G.C.dusk; ctx.fillRect(0, 180, G.W, G.H - 180);

    // stars
    for (let i = 0; i < 30; i++) {
      const sx = (i * 97) % G.W, sy = (i * 41) % 100;
      ctx.fillStyle = (i + Math.floor(this.t * 2)) % 5 === 0 ? G.C.white : G.C.slate;
      ctx.fillRect(sx, sy, 1, 1);
    }

    // northern lights
    for (let x = 0; x < G.W; x += 4) {
      const h = 22 + Math.sin(x * 0.03 + this.t * 1.2) * 10;
      const y = 18 + Math.sin(x * 0.015 + this.t * 0.7) * 8;
      ctx.fillStyle = 'rgba(56,183,100,0.16)';
      ctx.fillRect(x, y, 4, h);
      ctx.fillStyle = 'rgba(115,239,247,0.10)';
      ctx.fillRect(x, y + h * 0.4, 4, h * 0.5);
    }

    // treeline
    for (let x = -4; x < G.W; x += 14) {
      G.drawSprite(ctx, G.Sprites.pine, x, 158, 2);
    }

    // title
    const bounce = Math.sin(this.t * 2) * 2;
    G.UI.text(ctx, 'BRIDGER', G.W / 2 - 64, 48 + bounce, { align: 'center', size: 22, color: '#c0562f', shadow: true });
    G.UI.text(ctx, 'vs', G.W / 2, 56 + bounce, { align: 'center', size: 12, color: G.C.yellow, shadow: true });
    G.UI.text(ctx, 'MALCOLM', G.W / 2 + 66, 48 + bounce, { align: 'center', size: 22, color: G.C.lime, shadow: true });
    G.UI.text(ctx, '- REALTOR RIVALS -', G.W / 2, 80, { align: 'center', size: 12, color: G.C.white, shadow: true });
    G.UI.text(ctx, 'A NORTHERN MINNESOTA SALES SHOWDOWN', G.W / 2, 98, { align: 'center', size: 7, color: G.C.gray });

    // characters flanking the menu
    const hop = Math.abs(Math.sin(this.t * 3)) * 3;
    G.drawSprite(ctx, G.Sprites.bridger, 120, 190 - hop, 3);
    G.drawSprite(ctx, G.Sprites.malcolm, 318, 190 - (3 - hop), 3, true);
    G.drawSprite(ctx, G.Sprites.soldSign, 90, 216, 2);
    G.drawSprite(ctx, G.Sprites.soldSign, 372, 216, 2);

    this.menu.render(ctx);

    // snow on top
    ctx.fillStyle = G.C.white;
    for (const s of this.snow) ctx.fillRect(Math.round(s.x), Math.round(s.y), 1, 1);

    G.UI.text(ctx, 'ARROWS/WASD + ENTER  -  OR JUST CLICK  -  [M] MUTE', G.W / 2, G.H - 10, { align: 'center', size: 7, color: G.C.slate });
  },
});

'use strict';

G.Engine.register('select', {
  enter() {
    this.t = 0;
    this.index = 0; // 0 = bridger, 1 = malcolm
    this.chars = [G.Data.CHARACTERS.bridger, G.Data.CHARACTERS.malcolm];
  },

  update(dt) {
    this.t += dt;
    const I = G.Input;
    if (I.left() || I.right()) { this.index = 1 - this.index; G.Audio.move(); }

    // mouse hover/click on cards
    for (let i = 0; i < 2; i++) {
      const x = 24 + i * 236;
      if (I.inRect(x, 40, 196, 190)) {
        if (I.mouse.x !== this._mx || I.mouse.y !== this._my) this.index = i;
        if (I.mouse.clicked) this.pick();
      }
    }
    this._mx = I.mouse.x; this._my = I.mouse.y;

    if (I.confirm()) this.pick();
    if (I.cancel()) G.Engine.goto('title');
  },

  pick() {
    G.Audio.fanfare();
    const ch = this.chars[this.index];
    G.State.newGame(ch.id);
    G.State.autosave();
    G.Engine.goto('map', { newDay: true });
  },

  render(ctx) {
    ctx.fillStyle = G.C.dusk;
    ctx.fillRect(0, 0, G.W, G.H);

    G.UI.text(ctx, 'CHOOSE YOUR AGENT', G.W / 2, 12, { align: 'center', size: 14, color: G.C.yellow, shadow: true });

    for (let i = 0; i < 2; i++) {
      const ch = this.chars[i];
      const x = 24 + i * 236;
      const sel = this.index === i;
      G.UI.panel(ctx, x, 40, 196, 190, {
        bg: sel ? G.C.navy : G.C.ink,
        border: sel ? G.C.yellow : G.C.slate,
        title: ch.name + ' - ' + ch.title,
        titleBg: ch.color,
      });

      const hop = sel ? Math.abs(Math.sin(this.t * 4)) * 3 : 0;
      G.drawSprite(ctx, G.Sprites[ch.sprite], x + 14, 62 - hop, 3);

      let ty = 58;
      for (const line of G.UI.wrap(ctx, ch.bio.join(' '), 122, 6)) {
        G.UI.text(ctx, line, x + 66, ty, { size: 6, color: G.C.gray });
        ty += 7;
      }

      ty = 106;
      G.UI.text(ctx, 'STRENGTHS:', x + 66, ty, { size: 7, color: G.C.cyan }); ty += 9;
      for (const s of ch.strengths) {
        G.UI.text(ctx, '* ' + s, x + 70, ty, { size: 7, color: G.C.lime });
        ty += 9;
      }

      ty += 4;
      G.UI.text(ctx, 'SPECIAL: ' + ch.ability.name, x + 10, ty, { size: 8, color: G.C.yellow }); ty += 10;
      for (const l of G.UI.wrap(ctx, ch.ability.desc, 176, 7)) {
        G.UI.text(ctx, l, x + 10, ty, { size: 7, color: G.C.white });
        ty += 8;
      }

      if (sel && Math.floor(this.t * 2) % 2 === 0) {
        G.UI.text(ctx, 'PRESS ENTER!', x + 98, 218, { align: 'center', size: 8, color: G.C.yellow });
      }
    }

    G.UI.text(ctx, 'YOUR RIVAL PLAYS THE OTHER AGENT. MOST HOMES SOLD BY END OF JUNE WINS.', G.W / 2, 244, { align: 'center', size: 7, color: G.C.gray });
    G.UI.text(ctx, '[ESC] BACK', G.W / 2, 256, { align: 'center', size: 7, color: G.C.slate });
  },
});
